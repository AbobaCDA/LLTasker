<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:;" />
<title>LLTasker</title>
<style>
  :root {
    --bg: #12151c;
    --panel: rgba(24, 28, 38, .78);
    --panel-2: #1e2431;
    --line: #2a3242;
    --text: #e8ecf4;
    --muted: #8d99ae;
    --accent: #4f8cff;
    --accent-soft: #22314f;
    --ok: #3ecf8e;
    --warn: #f2b544;
    --danger: #f2545b;
    --radius: 14px;
    --panel-alpha: .1;            /* прозрачность колонок дней и карточек — одна на всех */
    --card-rgb: 34, 40, 54;      /* цвет карточки, прозрачность — отдельно */
    --card-line: rgba(255, 255, 255, .08);
    --solid: #1e2431;             /* непрозрачный фон всплывающих окон */
    --wallpaper: none;
    --wallpaper-veil: rgba(10, 12, 18, .55);
    --blur: 10px;
  }
  :root[data-theme="light"] {
    --bg: #e9edf2;
    --panel: rgba(255, 255, 255, .62);
    --panel-2: rgba(255, 255, 255, .92);
    --line: rgba(60, 72, 90, .18);
    --text: #1f2733;
    --muted: #55637a;
    --accent: #2f6fed;
    --accent-soft: rgba(47, 111, 237, .14);
    --ok: #1f9d64;
    --warn: #c98a12;
    --danger: #d9414a;
    --card-rgb: 255, 255, 255;
    --card-line: rgba(80, 92, 110, .35);  /* серый контур облачка */
    --solid: #ffffff;
    --wallpaper-veil: rgba(240, 243, 247, .25);
    --blur: 12px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none;
  }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: var(--wallpaper) center / cover no-repeat; }
  body::after { content: ""; position: fixed; inset: 0; z-index: -1; background: var(--wallpaper-veil); }
  body.no-wallpaper::before, body.no-wallpaper::after { display: none; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  .app { display: flex; flex-direction: column; height: 100vh; min-height: 0; }

  /* --- Верхняя строка: минимум элементов --- */
  .topbar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-right: 4px; white-space: nowrap; }
  .brand .logo { width: 24px; height: 24px; border-radius: 7px; background: linear-gradient(135deg, #4f8cff, #8b5cf6); display: grid; place-items: center; font-size: 13px; color: #fff; }
  .brand .badge { font-weight: 400; }
  .glass { background: rgba(var(--card-rgb), .35); border: 1px solid var(--card-line); backdrop-filter: blur(var(--blur)); }
  .spacer { flex: 1; }
  .weeknav { display: flex; align-items: center; border-radius: 10px; height: 34px; overflow: hidden; }
  .weeknav button { background: transparent; border: 0; color: var(--text); height: 100%; padding: 0 10px; font-size: 13px; white-space: nowrap; }
  .weeknav button:first-child, .weeknav button:last-child { font-size: 18px; color: var(--muted); padding: 0 9px; }
  .weeknav button:hover { color: var(--accent); }
  .weeknav button.off { color: var(--muted); }
    .arch-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .arch-row:last-child { border-bottom: 0; }
  .arch-row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .arch-row .m { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .arch-row button { border-radius: 8px; padding: 5px 10px; font-size: 12px; }
  .preview { color: var(--muted); font-size: 12px; min-height: 18px; margin: 4px 2px 0; }
  .primary { background: var(--accent); border: 0; color: #fff; border-radius: 10px; padding: 8px 14px; font-weight: 600; }
  .primary:hover { filter: brightness(1.08); }
  .primary.glass { background: rgba(47, 111, 237, .55); border: 1px solid rgba(47, 111, 237, .5); color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .25); }
  .primary.glass:hover { background: rgba(47, 111, 237, .75); }
  .search { border-radius: 10px; padding: 7px 10px; width: 150px; outline: none; transition: width .15s; }
  .search::placeholder { color: var(--muted); }
  .search:focus { width: 220px; border-color: var(--accent); }
  .icon-btn { color: var(--muted); border-radius: 10px; width: 34px; height: 34px; display: grid; place-items: center; font-size: 16px; line-height: 1; flex: none; }
  .modal-card .icon-btn { background: transparent; border: 1px solid var(--line); }
  .icon-btn:hover { color: var(--text); border-color: var(--accent); }
  .icon-btn.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; cursor: pointer; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.err { background: var(--danger); }

  /* --- Доска: колонка «Сегодня» + календарная неделя пн–вс --- */
  .board { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.08fr) repeat(7, minmax(0, 1fr)); gap: 7px; padding: 4px 14px 8px; }
  .col.today-pane { margin-right: 8px; }
  .col.is-today .col-head .name { color: var(--accent); }
  .col.is-today { box-shadow: inset 0 3px 0 var(--accent); }
  .col.past { opacity: .78; }
  .col-body .same-day { color: var(--muted); font-size: 11px; text-align: center; padding: 10px 6px; line-height: 1.4; }
  .col { display: flex; flex-direction: column; min-height: 0; border-radius: var(--radius); background: rgba(var(--card-rgb), var(--panel-alpha)); }
  .col.drop { outline: 2px dashed var(--accent); outline-offset: -2px; }
  .col-head { padding: 10px 10px 6px; display: grid; grid-template-columns: 1fr auto; column-gap: 6px; align-items: baseline; }
  .col-head .name { font-weight: 600; font-size: 13px; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .col-head .date { grid-column: 1 / -1; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .col.weekend .col-head .name { color: var(--danger); opacity: .85; }
  .col-head .n { font-size: 11px; color: var(--muted); }
  .shelf .col-head { grid-template-columns: auto 1fr; }
  .col-body { flex: 1; min-height: 40px; overflow-y: auto; padding: 4px 7px 7px; display: flex; flex-direction: column; gap: 7px; }
  /* Выбор недели при перетаскивании: появляется сверху, пока тянешь карточку */
  .weekpick { position: fixed; top: 6px; left: 50%; transform: translateX(-50%); z-index: 60; display: none; flex-direction: column; gap: 6px; padding: 8px 10px; border-radius: 14px; max-width: calc(100vw - 40px); box-shadow: 0 12px 40px rgba(0, 0, 0, .25); }
  body.dragging .weekpick { display: flex; }
  .weekpick .wk-row, .weekpick .wd-row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .weekpick .wk { border: 1px solid var(--line); border-radius: 9px; padding: 4px 9px; font-size: 12px; color: var(--muted); background: rgba(var(--card-rgb), .35); white-space: nowrap; }
  .weekpick .wk b { color: var(--text); font-weight: 600; }
  .weekpick .wk.sel { border-color: var(--accent); background: var(--accent-soft); }
  .weekpick .wk.over, .weekpick .wd.over { outline: 2px dashed var(--accent); outline-offset: -2px; }
  .weekpick .wd { flex: 1; min-width: 64px; border: 1px solid var(--line); border-radius: 9px; padding: 5px 8px; text-align: center; font-size: 12px; background: rgba(var(--card-rgb), .35); }
  .weekpick .wd b { display: block; font-size: 15px; }
  .weekpick .wd.weekend b { color: var(--danger); }
  .weekpick .wd.is-today { border-color: var(--accent); }
  .weekpick .hint { text-align: center; margin: 0; font-size: 11px; }
  .col-body::-webkit-scrollbar { width: 6px; } .col-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

  /* --- Карточка-облачко --- */
  .card {
    position: relative; aspect-ratio: 4 / 3; width: 100%; flex: none;
    border-radius: var(--radius); border: 1px solid var(--card-line);
    background: rgba(var(--card-rgb), var(--panel-alpha)); backdrop-filter: blur(var(--blur));
    padding: 9px 10px 8px; display: flex; flex-direction: column; gap: 4px; cursor: grab;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .06); transition: transform .1s, box-shadow .1s;
  }
  .card:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0, 0, 0, .12); border-color: var(--accent); }
  .card.dragging { opacity: .35; }
  .card.done { opacity: .55; }
  .card.done .title { text-decoration: line-through; color: var(--muted); }
  .card .top { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  .card .top .time { font-weight: 600; color: var(--text); }
  .card .top .late { color: var(--danger); font-weight: 600; }
  .card .check { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--muted); background: transparent; flex: none; padding: 0; margin-left: auto; font-size: 10px; line-height: 1; }
  .card .check:hover { border-color: var(--ok); }
  .card .check.done { background: var(--ok); border-color: var(--ok); color: #fff; }
  .card .title { font-weight: 500; font-size: 13px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow-wrap: anywhere; flex: 1; }
  .card .foot { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); min-height: 14px; }
  .card .foot .proj { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .stripe { position: absolute; left: 10px; right: 10px; top: 0; height: 3px; border-radius: 0 0 3px 3px; }
  .prio-0 .stripe, .prio-1 .stripe { background: transparent; } .prio-0 .title { color: var(--muted); font-weight: 500; } .prio-2 .stripe { background: #f59e0b; } .prio-3 .stripe { background: #ef4444; }
  .placeholder { flex: none; width: 100%; aspect-ratio: 4 / 3; border-radius: var(--radius); border: 2px dashed var(--accent); opacity: .6; }

  /* --- Полка внизу: без срока и позже --- */
  .shelf { display: grid; grid-template-columns: 1fr; gap: 8px; padding: 0 14px 12px; height: 150px; }
  .shelf .col { flex-direction: column; }
  .shelf .col-body { flex-direction: row; overflow-x: auto; overflow-y: hidden; align-items: stretch; }
  .shelf .card { width: 108px; aspect-ratio: auto; height: 100%; }
  .shelf .placeholder { width: 108px; aspect-ratio: auto; height: auto; }
  .shelf.collapsed { height: 40px; }
  .shelf.collapsed .col-body { display: none; }
  .empty-hint { color: var(--muted); font-size: 12px; align-self: center; padding: 3px 9px; border-radius: 8px; background: rgba(var(--card-rgb), .55); }

  /* --- Всплывающие окна --- */
  .overlay { position: fixed; inset: 0; background: rgba(6, 8, 12, .45); display: none; z-index: 20; }
  .overlay.open { display: block; }
  .modal { position: fixed; inset: 0; display: none; place-items: center; z-index: 30; background: rgba(6, 8, 12, .35); }
  .modal.open { display: grid; }
  .modal-card { width: min(560px, calc(100vw - 40px)); max-height: calc(100vh - 40px); overflow-y: auto; background: rgba(var(--card-rgb), .72); backdrop-filter: blur(22px) saturate(1.1); border: 1px solid var(--card-line); border-radius: 16px; padding: 18px 20px 16px; box-shadow: 0 20px 60px rgba(0, 0, 0, .25); }
  :root[data-theme="light"] .modal-card .field input, :root[data-theme="light"] .modal-card .field select, :root[data-theme="light"] .modal-card .field textarea { background: rgba(255, 255, 255, .6); }
  :root[data-theme="light"] .modal-card .log-view { background: rgba(255, 255, 255, .7); }
  .editor-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .editor-head h3 { margin: 0; font-size: 16px; }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .field label { font-size: 12px; color: var(--muted); }
  .field input, .field select, .field textarea { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; outline: none; width: 100%; }
  :root[data-theme="light"] .field input, :root[data-theme="light"] .field select, :root[data-theme="light"] .field textarea { background: #fff; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 56px; }
  .field input[type=range] { padding: 0; border: 0; background: transparent; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .offsets { display: flex; flex-wrap: wrap; gap: 6px; }
  .offsets button { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 20px; padding: 4px 10px; font-size: 12px; }
  .offsets button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  .actions button { flex: 1; border-radius: 9px; padding: 9px 12px; }
  .ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 7px 10px; }
  .ghost:hover { color: var(--text); border-color: var(--accent); }
  .danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
  .danger:hover { background: rgba(242, 84, 91, .12); }
  .hint { color: var(--muted); font-size: 12px; line-height: 1.5; }
  .chip { border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); border-radius: 20px; padding: 3px 10px; font-size: 12px; }

  /* --- Настройки (выезжающая панель) --- */
  .drawer { position: fixed; top: 0; right: 0; height: 100vh; width: 400px; background: var(--panel-2); border-left: 1px solid var(--line); padding: 16px; overflow-y: auto; z-index: 25; }
  :root[data-theme="light"] .drawer { background: #f6f8fb; }
  .drawer h3 { margin: 0 0 4px; }
  .section { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 14px; }
  .section h4 { margin: 0 0 10px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 70vw; z-index: 40; }
  .toast.show { opacity: 1; }
  .badge { font-size: 11px; border-radius: 6px; padding: 1px 6px; background: var(--panel-2); color: var(--muted); }
  .badge.ok { color: var(--ok); } .badge.err { color: var(--danger); } .badge.warn { color: var(--warn); }
  .log-view { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; max-height: 60vh; overflow: auto; font: 12px/1.5 Consolas, "Cascadia Mono", monospace; white-space: pre-wrap; user-select: text; }
  :root[data-theme="light"] .log-view { background: #fff; }
  .log-view .t { color: var(--muted); }
  .log-view .e { color: var(--accent); font-weight: 600; }
  .wall-options { display: flex; gap: 8px; }
  .wall-options button { flex: 1; border-radius: 10px; border: 2px solid var(--line); height: 54px; background: var(--panel-2) center / cover no-repeat; color: var(--muted); font-size: 12px; padding: 0 4px; }
  .wall-options button span { display: inline-block; background: rgba(255, 255, 255, .85); color: #1f2733; border-radius: 6px; padding: 2px 7px; }
  .wall-options button.plain span { background: transparent; color: inherit; }
  .wall-options button.on { border-color: var(--accent); color: var(--text); }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="logo">✦</span> LLTasker <span class="badge" id="version"></span></div>
    <div class="weeknav glass">
      <button id="weekPrev" title="Предыдущая неделя">‹</button>
      <button id="weekLabel" title="Вернуться к текущей неделе"></button>
      <button id="weekNext" title="Следующая неделя">›</button>
    </div>
    <div class="spacer"></div>
    <button class="primary glass" id="quickAdd" title="Новая задача (Ctrl+N)">Добавить</button>
    <input type="search" class="search glass" id="search" placeholder="Поиск" />
    <button class="icon-btn glass" id="showDone" title="Показывать выполненные">✓</button>
    <button class="icon-btn glass" id="archiveButton" title="Архив">▤</button>
    <div class="status" id="status" title="Нажми, чтобы синхронизировать"><span class="dot" id="cloudDot"></span><span id="cloudText">Локальный режим</span></div>
    <button class="icon-btn glass" id="settingsButton" title="Настройки и аккаунт">⚙</button>
  </header>

  <main class="board" id="board"></main>
<div class="weekpick glass" id="weekPick"></div>
  <section class="shelf" id="shelf"></section>
</div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer" style="display:none"></div>
<div class="modal" id="modal"><div class="modal-card" id="editor"></div></div>
<div class="modal" id="archiveModal"><div class="modal-card" id="archiveBody"></div></div>
<div class="modal" id="logModal"><div class="modal-card" style="width:min(860px, calc(100vw - 40px))" id="logBody"></div></div>
<div class="toast" id="toast"></div>

<script>
// Без Electron (например, при простом открытии файла) интерфейс работает в демо-режиме:
// так видно вёрстку и поведение без сборки приложения.
const DEMO = !window.lltasker;
function demoTasks() {
  const utc = (days, hour, minute) => {
    const base = new Date();
    const shifted = new Date(Date.UTC(base.getUTCFullYear(), base.getUTCMonth(), base.getUTCDate() + days, hour, minute));
    return shifted.toISOString();
  };
  const make = (id, title, extra) => ({
    id, title, notes: '', priority: 1, project: null, tags: [], all_day: false,
    remind_offsets: [1440, 60, 10], status: 'open', completed_at: null, recurrence: null,
    created_at: utc(0, 8, 0), updated_at: utc(0, 8, 0), synced: true, dirty: false, ...extra,
  });
  return [
    make('demo-1', 'Оплатить хостинг', { due_at: utc(0, 15, 30), priority: 2, project: 'работа' }),
    make('demo-2', 'Сдать отчёт за квартал', { due_at: utc(1, 9, 0), priority: 3, project: 'работа', recurrence: 'weekly' }),
    make('demo-3', 'Позвонить в банк', { due_at: utc(-1, 11, 0), priority: 2, remind_offsets: [60, 10] }),
    make('demo-4', 'Тренировка', { due_at: utc(1, 4, 30), recurrence: 'weekdays', project: 'здоровье' }),
    make('demo-5', 'Купить фильтр для воды', { project: 'дом', tags: ['быт'], remind_offsets: [] }),
    make('demo-6', 'Разобрать входящие письма', { status: 'done', completed_at: utc(-1, 19, 0) }),
  ];
}
const demoBridge = {
  load: async () => ({
    tasks: demoTasks(),
    settings: { timezone: 'Europe/Moscow', digestEnabled: true, digestAt: '09:00', notifications: 'both', supabaseUrl: '', supabaseKey: '', theme: 'light', wallpaper: 'forest', panelOpacity: 10 },
    cloud: { configured: false, signedIn: false, error: '' },
    update: { status: 'dev' },
    startup: false,
  }),
  info: async () => ({ version: 'демо', packaged: false, platform: 'browser', dataFolder: '' }),
  save: async (tasks) => ({ saved: tasks.length, sync: { ok: false, reason: 'demo' } }),
  remove: async () => ({ ok: true }),
  preview: async (text) => ({ title: String(text).trim(), dueAt: null, allDay: false, priority: 1, project: null, tags: [], recurrence: null, offsets: null, dueLabel: '' }),
  saveSettings: async (patch) => ({ ...state.settings, ...patch }),
  cloudState: async () => ({}),
  signIn: async () => ({}),
  signUp: async () => ({ needsConfirmation: false, state: {} }),
  signOut: async () => ({}),
  syncNow: async () => ({ ok: false, reason: 'demo' }),
  linkTelegram: async () => ({ state: {} }),
  setStartup: async () => ({ enabled: false }),
  checkUpdates: async () => ({ status: 'dev' }),
  installUpdate: () => {},
  openDataFolder: async () => {},
  getWallpaper: async () => {
    try {
      const blob = await (await fetch('assets/wallpaper-forest.jpg')).blob();
      const forest = await new Promise((resolve) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.readAsDataURL(blob); });
      return { forest, custom: null };
    } catch { return { forest: null, custom: null }; }
  },
  chooseWallpaper: async () => ({ ok: false, reason: 'demo' }),
  log: async () => true,
  logTail: async () => ({ lines: ['2026-10-08 12:00:00\tприложение запущено\tверсия демо', '2026-10-08 12:01:10\tзадача добавлена\t«Оплатить хостинг» · сегодня 18:30'], file: 'демо', directory: 'демо' }),
  openLogFile: async () => {},
  openLogFolder: async () => {},
  hideWindow: async () => {},
  onTasksChanged: () => {},
  onCloudStatus: () => {},
  onUpdateStatus: () => {},
  onFocusTask: () => {},
};
const bridge = window.lltasker ?? demoBridge;

const state = {
  tasks: [],
  settings: {},
  cloud: {},
  startup: false,
  update: {},
  info: {},
  search: '',

const PRIORITY_LABELS = ['Низкий', 'Обычная', 'Средний', 'Высокий']; // 1 — по умолчанию, полоска только у 2 и 3

function toast(message) {

// --- Работа с датами в интерфейсе (часовой пояс из настроек) ---
function parts(iso, timeZone) {
  const formatter = new Intl.DateTimeFormat('en-CA', { timeZone, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false, hourCycle: 'h23' });
  const list = formatter.formatToParts(new Date(iso));
  const value = (type) => Number(list.find((part) => part.type === type)?.value ?? 0);
  return { year: value('year'), month: value('month'), day: value('day'), hour: value('hour') % 24, minute: value('minute') };
}
function localDate(iso, timeZone) {
  const p = parts(iso, timeZone);
  return `${p.year}-${String(p.month).padStart(2, '0')}-${String(p.day).padStart(2, '0')}`;
}
function todayLocal(timeZone) {
  return localDate(new Date().toISOString(), timeZone);
}
function addDaysLocal(timeZone, days) {
  const p = parts(new Date().toISOString(), timeZone);
  const shifted = new Date(Date.UTC(p.year, p.month - 1, p.day + days, 12, 0));
  return `${shifted.getUTCFullYear()}-${String(shifted.getUTCMonth() + 1).padStart(2, '0')}-${String(shifted.getUTCDate()).padStart(2, '0')}`;
}
function dueLabel(task) {
  if (!task.due_at) return '';
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const p = parts(task.due_at, timeZone);
  const time = `${String(p.hour).padStart(2, '0')}:${String(p.minute).padStart(2, '0')}`;
  return task.all_day ? '' : time;
}
function dueDayLabel(task) {
  if (!task.due_at) return 'без срока';
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const target = localDate(task.due_at, timeZone);
  const today = todayLocal(timeZone);
  const time = dueLabel(task);
  const suffix = time ? ` ${time}` : '';
  if (target === today) return `сегодня${suffix}`;
  if (target === addDaysLocal(timeZone, 1)) return `завтра${suffix}`;
  const p = parts(task.due_at, timeZone);
  return `${String(p.day).padStart(2, '0')}.${String(p.month).padStart(2, '0')}${suffix}`;
}
// Локальные дата и время → момент UTC в выбранном поясе (та же логика, что в общем модуле).
function zonedToUtc(year, month, day, hour, minute, timeZone) {
  const guess = new Date(Date.UTC(year, month - 1, day, hour, minute));
  const offsetOf = (date) => {
    const p = parts(date.toISOString(), timeZone);
    return Math.round((Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute) - date.getTime()) / 60_000);
  };
  const offset = offsetOf(guess);
  const first = new Date(guess.getTime() - offset * 60_000);
  const second = offsetOf(first);
  return second === offset ? first : new Date(guess.getTime() - second * 60_000);
}

function isLate(task) {
  return task.status === 'open' && task.due_at && localDate(task.due_at, state.settings.timezone || 'Europe/Moscow') < todayLocal(state.settings.timezone || 'Europe/Moscow');
}

function newTask(title, extra = {}) {

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
}


// --- Неделя: раскладка задач по дням ---
const WEEKDAY = new Intl.DateTimeFormat('ru-RU', { weekday: 'long' });
const WEEKDAY_SHORT = new Intl.DateTimeFormat('ru-RU', { weekday: 'short' });
const DAY_MONTH = new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'short' });
function dateAtNoon(dateString) {
  const [year, month, day] = dateString.split('-').map(Number);
  return new Date(Date.UTC(year, month - 1, day, 12, 0));
}
function capitalize(text) { return text ? text[0].toUpperCase() + text.slice(1) : text; }

/** Календарная неделя пн–вс со сдвигом state.weekOffset: ключ-дата, подпись, мелкая дата. */
function weekDays(offset = state.weekOffset) {
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const today = todayLocal(timeZone);
  const tomorrow = addDaysLocal(timeZone, 1);
  const narrow = window.innerWidth < 1280;
  const mondayShift = (dateAtNoon(today).getUTCDay() + 6) % 7; // пн=0 … вс=6
  return Array.from({ length: 7 }, (_, index) => {
    const date = addDaysLocal(timeZone, -mondayShift + offset * 7 + index);
    const noon = dateAtNoon(date);
    const weekday = noon.getUTCDay();
    const name = narrow ? capitalize(WEEKDAY_SHORT.format(noon)) : capitalize(WEEKDAY.format(noon));
    const dm = DAY_MONTH.format(noon).replace('.', '');
    const sub = date === today ? `${dm} · сегодня` : date === tomorrow ? `${dm} · завтра` : dm;
    return { date, name, sub, weekend: weekday === 0 || weekday === 6, isToday: date === today, isPast: date < today };
  });
}

/** Колонка «Сегодня» слева: всегда видна, какую бы неделю ни листали. */
function todayColumn() {
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const date = todayLocal(timeZone);
  const noon = dateAtNoon(date);
  return { date, name: 'Сегодня', sub: `${WEEKDAY_SHORT.format(noon)}, ${DAY_MONTH.format(noon).replace('.', '')}`, weekend: false, isToday: true, isPast: false };
}

/** Подпись диапазона недели для навигации. */
function weekRangeLabel(days) {
  const first = dateAtNoon(days[0].date);
  const last = dateAtNoon(days[6].date);
  const a = DAY_MONTH.format(first).replace('.', '');
  const b = DAY_MONTH.format(last).replace('.', '');
  if (state.weekOffset === 0) return `${a} – ${b}`;
  if (state.weekOffset === 1) return `след. неделя · ${a} – ${b}`;
  if (state.weekOffset === -1) return `пред. неделя · ${a} – ${b}`;
  return `${state.weekOffset > 0 ? '+' : ''}${state.weekOffset} нед · ${a} – ${b}`;
}

function matchesSearch(task) {
  const query = state.search.trim().toLowerCase();
  if (!query) return true;
  return `${task.title} ${task.notes} ${task.project ?? ''} ${(task.tags || []).join(' ')}`.toLowerCase().includes(query);
}

function byBoardOrder(left, right) {
  if (left.status !== right.status) return left.status === 'open' ? -1 : 1;
  const leftOrder = Number.isFinite(Number(left.sort_order)) ? Number(left.sort_order) : 0;
  const rightOrder = Number.isFinite(Number(right.sort_order)) ? Number(right.sort_order) : 0;
  if (leftOrder !== rightOrder) return leftOrder - rightOrder;
  const leftDue = left.due_at ? Date.parse(left.due_at) : Number.MAX_SAFE_INTEGER;
  const rightDue = right.due_at ? Date.parse(right.due_at) : Number.MAX_SAFE_INTEGER;
  if (leftDue !== rightDue) return leftDue - rightDue;
  return Number(right.priority) - Number(left.priority);
}

/** Раскладка: { days: Map(date → tasks[]), none: tasks[] }. Просроченные попадают в «Сегодня» (на текущей неделе). */
function boardData() {
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const days = weekDays();
  const today = todayLocal(timeZone);
  // «Сегодня» — отдельная колонка слева; в сетке недели её день остаётся, но карточки не дублируются.
  const buckets = { today: [], days: new Map(days.map((day) => [day.date, []])), none: [] };
  for (const task of state.tasks) {
    if (task.status === 'archived') continue;
    if (task.status === 'done' && !state.showDone) continue;
    if (!matchesSearch(task)) continue;
    if (!task.due_at) { buckets.none.push(task); continue; }
    const date = localDate(task.due_at, timeZone);
    if (date === today) buckets.today.push(task);
    else if (date < today && task.status !== 'done') buckets.today.push(task); // просроченные — в «Сегодня», всегда на виду
    else if (buckets.days.has(date)) buckets.days.get(date).push(task);
  }
  buckets.today.sort(byBoardOrder);
  for (const list of buckets.days.values()) list.sort(byBoardOrder);
  buckets.none.sort(byBoardOrder);
  return { days, buckets, today };
}

function cardHtml(task, { showDay = false } = {}) {
  const late = isLate(task);
  const time = dueLabel(task);
  const top = [];
  if (showDay && task.due_at) top.push(`<span class="${late ? 'late' : 'time'}">${escapeHtml(dueDayLabel(task))}</span>`);
  else if (late) top.push(`<span class="late" title="Просрочено">${escapeHtml(dueDayLabel(task))}</span>`);
  else if (time) top.push(`<span class="time">${time}</span>`);
  else if (task.due_at) top.push('<span>весь день</span>');
  const foot = [];
  if (task.project) foot.push(`<span class="proj">#${escapeHtml(task.project)}</span>`);
  if (task.recurrence) foot.push('<span title="Повторяется">🔁</span>');
  if (task.due_at && (task.remind_offsets || []).length === 0) foot.push('<span title="Напоминания выключены">🔕</span>');
  if (!task.synced && state.cloud.signedIn) foot.push('<span title="Ещё не ушло в облако">⏳</span>');
  return `
    <div class="card prio-${Number(task.priority) || 0} ${task.status === 'done' ? 'done' : ''}" draggable="true" data-id="${task.id}" title="${escapeHtml(task.title)}">
      <span class="stripe"></span>
      <div class="top">${top.join('')}<button class="check ${task.status === 'done' ? 'done' : ''}" data-toggle="${task.id}" title="Выполнено">${task.status === 'done' ? '✓' : ''}</button></div>
      <div class="title">${escapeHtml(task.title)}</div>
      <div class="foot">${foot.join('')}</div>
    </div>`;
}

function renderBoard() {
  const { days, buckets } = boardData();
  const todayCol = todayColumn();
  const columnHtml = (day, tasks, extraClass = '', body = null) => `
      <section class="col ${extraClass} ${day.isToday ? 'is-today' : ''} ${day.isPast ? 'past' : ''} ${day.weekend ? 'weekend' : ''}" data-day="${day.date}">
        <div class="col-head"><span class="name">${day.name}</span><span class="n">${tasks.length || ''}</span><span class="date">${day.sub}</span></div>
        <div class="col-body" data-zone="day" data-day="${day.date}">${body ?? tasks.map((task) => cardHtml(task)).join('')}</div>
      </section>`;
  $('board').innerHTML = columnHtml(todayCol, buckets.today, 'today-pane')
    + days.map((day) => day.isToday
      ? columnHtml(day, buckets.today, '', '<div class="same-day">← задачи на сегодня — в колонке слева</div>')
      : columnHtml(day, buckets.days.get(day.date))).join('');

  const pool = buckets.none;
  $('shelf').innerHTML = `
    <section class="col" data-zone-wrap="none">
      <div class="col-head"><span class="name">Без срока</span><span class="n">${pool.length || ''}</span></div>
      <div class="col-body" data-zone="none">${pool.length ? pool.map((task) => cardHtml(task)).join('') : '<span class="empty-hint">Пул дел без даты. Перетащи карточку сюда, чтобы снять срок, или на день — чтобы назначить.</span>'}</div>
    </section>`;
  $('weekLabel').textContent = weekRangeLabel(days);
  $('weekLabel').classList.toggle('off', state.weekOffset === 0);

  document.querySelectorAll('[data-toggle]').forEach((button) => {
    button.onclick = (event) => { event.stopPropagation(); toggleDone(button.dataset.toggle); };
  });
  document.querySelectorAll('.card[data-id]').forEach((card) => {
    card.onclick = () => selectTask(card.dataset.id);
    card.addEventListener('dragstart', onDragStart);
    card.addEventListener('dragend', onDragEnd);
  });
  // Бросать можно в любое место колонки (включая заголовок и пустоту) — карточки лежат в .col-body.
  document.querySelectorAll('.col').forEach((col) => {
    col.addEventListener('dragover', onDragOver);
    col.addEventListener('dragleave', onDragLeave);
    col.addEventListener('drop', onDrop);
  });
}

// --- Перетаскивание: внутри дня (порядок) и между днями (срок) ---
let dragId = null;
let placeholder = null;

function onDragStart(event) {
  dragId = event.currentTarget.dataset.id;
  event.currentTarget.classList.add('dragging');
  event.dataTransfer.effectAllowed = 'move';
  event.dataTransfer.setData('text/plain', dragId);
  placeholder = document.createElement('div');
  placeholder.className = 'placeholder';
  // Полоску выбора недели показываем на следующем тике: правка DOM прямо в dragstart срывает перетаскивание в Chromium.
  setTimeout(() => { if (dragId) { pickWeek = state.weekOffset + 1; renderWeekPick(); document.body.classList.add('dragging'); } }, 0);
}
function onDragEnd() {
  document.querySelectorAll('.card.dragging').forEach((card) => card.classList.remove('dragging'));
  document.querySelectorAll('.col.drop').forEach((col) => col.classList.remove('drop'));
  document.body.classList.remove('dragging');
  placeholder?.remove();
  placeholder = null;
  dragId = null;
}

// --- Полоска выбора недели при перетаскивании: наведи на неделю — раскроются её дни, брось на число ---
let pickWeek = 1;
const PICK_OFFSETS = [-1, 0, 1, 2, 3, 4, 5];
function pickWeekTag(offset) {
  return offset === 0 ? 'эта' : offset === 1 ? 'след.' : offset === -1 ? 'пред.' : `+${offset}`;
}
function renderWeekPick() {
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const today = todayLocal(timeZone);
  const weeks = PICK_OFFSETS.map((offset) => {
    const days = weekDays(offset);
    const a = DAY_MONTH.format(dateAtNoon(days[0].date)).replace('.', '');
    const b = DAY_MONTH.format(dateAtNoon(days[6].date)).replace('.', '');
    return { offset, days, label: `${a} – ${b}` };
  });
  const selected = weeks.find((week) => week.offset === pickWeek) ?? weeks[2];
  $('weekPick').innerHTML = `
    <div class="wk-row">${weeks.map((week) => `<div class="wk ${week.offset === selected.offset ? 'sel' : ''}" data-week="${week.offset}">${pickWeekTag(week.offset)} <b>${week.label}</b></div>`).join('')}</div>
    <div class="wd-row">${selected.days.map((day) => `<div class="wd ${day.weekend ? 'weekend' : ''} ${day.date === today ? 'is-today' : ''}" data-date="${day.date}">${WEEKDAY_SHORT.format(dateAtNoon(day.date))}<b>${dateAtNoon(day.date).getUTCDate()}</b></div>`).join('')}</div>
    <p class="hint">Наведи на неделю — откроются её дни. Брось карточку на число.</p>`;
  $('weekPick').querySelectorAll('.wk').forEach((chip) => {
    chip.addEventListener('dragenter', (event) => {
      event.preventDefault();
      const offset = Number(chip.dataset.week);
      if (offset !== pickWeek) { pickWeek = offset; renderWeekPick(); }
    });
    chip.addEventListener('dragover', (event) => { event.preventDefault(); event.dataTransfer.dropEffect = 'move'; chip.classList.add('over'); });
    chip.addEventListener('dragleave', () => chip.classList.remove('over'));
    chip.addEventListener('drop', async (event) => {
      // Бросили на саму неделю — тот же день недели в выбранной неделе.
      event.preventDefault();
      const taskId = dragId || event.dataTransfer.getData('text/plain');
      const task = state.tasks.find((item) => item.id === taskId);
      onDragEnd();
      if (!task) return;
      const days = weekDays(Number(chip.dataset.week));
      const current = task.due_at ? localDate(task.due_at, timeZone) : today;
      const weekdayIndex = (dateAtNoon(current).getUTCDay() + 6) % 7;
      await dropOnDate(taskId, days[weekdayIndex].date);
    });
  });
  $('weekPick').querySelectorAll('.wd').forEach((cell) => {
    cell.addEventListener('dragover', (event) => { event.preventDefault(); event.dataTransfer.dropEffect = 'move'; cell.classList.add('over'); });
    cell.addEventListener('dragleave', () => cell.classList.remove('over'));
    cell.addEventListener('drop', async (event) => {
      event.preventDefault();
      const taskId = dragId || event.dataTransfer.getData('text/plain');
      onDragEnd();
      if (taskId) await dropOnDate(taskId, cell.dataset.date);
    });
  });
}
/** Перенос на дату, которой может не быть на экране: встаёт в конец этого дня. */
async function dropOnDate(taskId, date) {
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const sameDay = state.tasks
    .filter((task) => task.id !== taskId && task.status !== 'archived' && task.due_at && localDate(task.due_at, timeZone) === date)
    .sort(byBoardOrder)
    .map((task) => task.id);
  await moveTask(taskId, { kind: 'day', date }, [...sameDay, taskId]);
}
function onDragOver(event) {
  if (!dragId) return;
  event.preventDefault();
  event.dataTransfer.dropEffect = 'move';
  const col = event.currentTarget;
  const zone = col.querySelector('.col-body[data-zone]');
  if (!zone) return;
  col.classList.add('drop');
  // Куда вставить: перед первой карточкой, чья середина ниже (или правее — на полке) курсора.
  const horizontal = zone.dataset.zone !== 'day';
  const cards = Array.from(zone.querySelectorAll('.card:not(.dragging)'));
  const next = cards.find((card) => {
    const rect = card.getBoundingClientRect();
    return horizontal ? event.clientX < rect.left + rect.width / 2 : event.clientY < rect.top + rect.height / 2;
  });
  if (placeholder && placeholder.parentElement !== zone || (next ? placeholder.nextSibling !== next : placeholder.parentElement !== zone || zone.lastElementChild !== placeholder)) {
    if (next) zone.insertBefore(placeholder, next); else zone.appendChild(placeholder);
  }
}
function onDragLeave(event) {
  const col = event.currentTarget;
  if (!col.contains(event.relatedTarget)) col.classList.remove('drop');
}
async function onDrop(event) {
  event.preventDefault();
  const zone = event.currentTarget.querySelector('.col-body[data-zone]');
  const taskId = dragId || event.dataTransfer.getData('text/plain');
  if (!zone || !taskId) return;
  // Порядок в целевой зоне: карточки + метка на месте вставки.
  const order = Array.from(zone.children)
    .map((element) => (element === placeholder ? taskId : element.dataset?.id))
    .filter((id, index, list) => id && list.indexOf(id) === index);
  if (!order.includes(taskId)) order.push(taskId);
  const target = zone.dataset.zone === 'day' ? { kind: 'day', date: zone.dataset.day } : { kind: zone.dataset.zone };
  onDragEnd();
  await moveTask(taskId, target, order);
}

/** Переносит задачу: меняет срок (время сохраняется) и переписывает порядок карточек в целевой зоне. */
async function moveTask(taskId, target, order) {
  const task = state.tasks.find((item) => item.id === taskId);
  if (!task) return;
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const now = new Date().toISOString();
  let patch = {};
  if (target.kind === 'day') {
    const dateString = target.date;
    const [year, month, day] = dateString.split('-').map(Number);
    if (task.due_at && !task.all_day) {
      const p = parts(task.due_at, timeZone);
      patch = { due_at: zonedToUtc(year, month, day, p.hour, p.minute, timeZone).toISOString(), all_day: false };
    } else {
      patch = { due_at: zonedToUtc(year, month, day, 12, 0, timeZone).toISOString(), all_day: true };
    }
    if (target.kind === 'day' && task.due_at && localDate(task.due_at, timeZone) === target.date) patch = {};
  } else if (target.kind === 'none') {
    patch = task.due_at ? { due_at: null, all_day: false } : {};
  }
  const positions = new Map(order.map((id, index) => [id, index * 10]));
  const next = state.tasks.map((item) => {
    const isMoved = item.id === taskId;
    const position = positions.get(item.id);
    const orderChanged = position !== undefined && Number(item.sort_order) !== position;
    if (!isMoved && !orderChanged) return item;
    return { ...item, ...(isMoved ? patch : {}), ...(position !== undefined ? { sort_order: position } : {}), updated_at: now, dirty: true };
  });
  const label = target.kind === 'none' ? 'без срока' : `на ${dueDayLabelFor(target.date)}`;
  bridge.log('перетаскивание', `«${task.title}» → ${label}${Object.keys(patch).length ? '' : ' (изменён порядок)'}`);
  await saveTasks(next, Object.keys(patch).length ? `«${task.title}» — ${label}` : null);
}
function dueDayLabelFor(dateString) {
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  if (dateString === todayLocal(timeZone)) return 'сегодня';
  if (dateString === addDaysLocal(timeZone, 1)) return 'завтра';
  const noon = dateAtNoon(dateString);
  return `${WEEKDAY_SHORT.format(noon)}, ${DAY_MONTH.format(noon).replace('.', '')}`;
}
async function toggleDone(taskId) {
  const task = state.tasks.find((item) => item.id === taskId);
  if (!task) return;
  const done = task.status !== 'done';
  const next = state.tasks.map((item) => item.id === taskId
    ? { ...item, status: done ? 'done' : 'open', completed_at: done ? new Date().toISOString() : null, updated_at: new Date().toISOString(), dirty: true }
    : item);
  if (done && task.recurrence) {
    // Повторяющиеся задачи создаёт триггер в БД; локально показываем подсказку.
    const backendNote = state.cloud.signedIn ? 'следующее вхождение создастся в облаке' : 'повтор создастся при включённой синхронизации';
    toast(`Готово: ${task.title} · ${backendNote}`);
  }
  await saveTasks(next, null);
}

// --- Карточка задачи (всплывающее окно) ---
function renderEditor() {
  // Новая задача живёт в state.pending, пока её не создали кнопкой; в списке её ещё нет.
  const task = state.tasks.find((item) => item.id === state.selectedId)
    ?? (state.pending && state.pending.id === state.selectedId ? state.pending : null);
  const isNew = Boolean(task && state.pending && task.id === state.pending.id);
  if (!task) {
    $('modal').classList.remove('open');
    $('editor').innerHTML = '';
    return;
  }
  $('modal').classList.add('open');
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const p = task.due_at ? parts(task.due_at, timeZone) : null;
  const savedDate = p ? `${p.year}-${String(p.month).padStart(2, '0')}-${String(p.day).padStart(2, '0')}` : '';
  const savedTime = p && !task.all_day ? `${String(p.hour).padStart(2, '0')}:${String(p.minute).padStart(2, '0')}` : '';
  // Если для этой задачи есть несохранённый черновик — показываем его, а не сохранённые значения.
  // Иначе любая перерисовка (вкладки, фоновая синхронизация) стирала бы введённое.
  if (state.draft && state.draft.taskId !== task.id) state.draft = null;
  const d = state.draft ?? {};
  const v = {
    title: d.title ?? task.title,
    notes: d.notes ?? (task.notes || ''),
    date: d.date ?? savedDate,
    time: d.time ?? savedTime,
    priority: d.priority ?? Number(task.priority),
    recurrence: d.recurrence ?? (task.recurrence ?? ''),
    project: d.project ?? (task.project ?? ''),
    tags: d.tags ?? (task.tags || []).join(' '),
    remind_offsets: d.remind_offsets ?? (task.remind_offsets || []),
  };
  $('editor').innerHTML = `
    <div class="editor-head">
      <h3>${isNew ? 'Новая задача' : task.due_at ? escapeHtml(dueDayLabel(task)) : 'Без срока'}${state.draft && !isNew ? ' <span class="hint">· не сохранено</span>' : ''}</h3>
      <button class="icon-btn" id="fClose" title="Закрыть без сохранения (Esc)">×</button>
    </div>
    <div class="field"><label>Название</label><input id="fTitle" value="${escapeHtml(v.title)}" placeholder="${isNew ? 'купить фильтр завтра 19:00 !2 #дом' : ''}" autocomplete="off" /></div>
    ${isNew ? '<div class="preview" id="quickPreview"></div><p class="hint" style="margin:2px 0 10px">Можно просто словами: <b>завтра 19:00</b>, <b>в пятницу в 10</b>, <b>через 3 дня</b>, <b>!3</b> — приоритет, <b>#дом</b> — проект, <b>+срочно</b> — тег, <b>за день за час</b> — напоминания, <b>каждый день</b>. Что разобралось из строки — подставится в пустые поля ниже.</p>' : ''}
    <div class="field"><label>Заметки</label><textarea id="fNotes">${escapeHtml(v.notes)}</textarea></div>
    <div class="row">
      <div class="field"><label>Дата</label><input type="date" id="fDate" value="${v.date}" /></div>
      <div class="field"><label>Время</label><input type="time" id="fTime" value="${v.time}" /></div>
    </div>
    <div class="row">
      <div class="field"><label>Приоритет</label><select id="fPriority">
        ${PRIORITY_LABELS.map((label, index) => `<option value="${index}" ${Number(v.priority) === index ? 'selected' : ''}>${label}</option>`).join('')}
      </select></div>
      <div class="field"><label>Повтор</label><select id="fRecurrence">
        ${RECURRENCE_OPTIONS.map(([value, label]) => `<option value="${value}" ${v.recurrence === value ? 'selected' : ''}>${label}</option>`).join('')}
      </select></div>
    </div>
    <div class="row">
      <div class="field"><label>Проект</label><input id="fProject" value="${escapeHtml(v.project)}" placeholder="например, работа" /></div>
      <div class="field"><label>Теги</label><input id="fTags" value="${escapeHtml(v.tags)}" placeholder="через пробел" /></div>
    </div>
    <div class="field">
      <label>Напоминания до срока</label>
      <div class="offsets" id="fOffsets">
        ${OFFSET_PRESETS.map((minutes) => `<button data-offset="${minutes}" class="${v.remind_offsets.includes(minutes) ? 'on' : ''}">${offsetLabel(minutes)}</button>`).join('')}
        <button data-offset="none" class="${v.remind_offsets.length === 0 ? 'on' : ''}">выключены</button>
      </div>
    </div>
    <div class="actions">
      ${isNew
        ? '<button class="primary" id="fSave">Создать</button><button class="ghost" id="fCancel">Отмена</button>'
        : `<button class="primary" id="fSave">Сохранить</button>
      <button class="ghost" id="fArchive">${task.status === 'archived' ? 'Вернуть' : 'В архив'}</button>
      <button class="danger" id="fDelete">Удалить</button>`}
    </div>
    ${isNew ? '' : `<p class="hint" style="margin:10px 0 0">${task.synced ? 'Синхронизировано с облаком' : 'Ждёт синхронизации'}</p>`}`;

  // Любой ввод в карточке — в черновик, чтобы перерисовка его не потеряла.
  ['fTitle', 'fNotes', 'fDate', 'fTime', 'fPriority', 'fRecurrence', 'fProject', 'fTags'].forEach((id) => {
    $(id).addEventListener('input', () => captureDraft(task));
    $(id).addEventListener('change', () => captureDraft(task));
  });
  $('fOffsets').querySelectorAll('button').forEach((button) => {
    button.onclick = () => {
      captureDraft(task);
      const value = button.dataset.offset;
      const current = new Set(state.draft.remind_offsets);
      if (value === 'none') current.clear();
      else if (current.has(Number(value))) current.delete(Number(value));
      else current.add(Number(value));
      state.draft.remind_offsets = Array.from(current).sort((a, b) => b - a);
      renderEditor();
    };
  });
  $('fSave').onclick = () => applyEditor(task);
  $('fClose').onclick = () => { state.draft = null; state.pending = null; state.selectedId = null; render(); };
  if (isNew) {
    $('fCancel').onclick = $('fClose').onclick;
    $('fTitle').addEventListener('input', () => { clearTimeout(previewTimer); previewTimer = setTimeout(updatePreview, 180); });
    $('fTitle').addEventListener('keydown', (event) => { if (event.key === 'Enter') { event.preventDefault(); applyEditor(task); } });
    if (!state.draft) setTimeout(() => $('fTitle')?.focus(), 30);
    else if (state.draft.title) updatePreview();
    return;
  }
  $('fArchive').onclick = async () => {
    const next = state.tasks.map((item) => item.id === task.id
      ? { ...item, status: item.status === 'archived' ? 'open' : 'archived', updated_at: new Date().toISOString(), dirty: true }
      : item);
    state.draft = null;
    state.selectedId = null; // карточка закрывается, задача уходит в архив (кнопка ▤ сверху)
    await saveTasks(next, task.status === 'archived' ? 'Возвращено из архива' : 'Убрано в архив');
  };
  $('fDelete').onclick = async () => {
    state.draft = null;
    await bridge.remove(task.id);
    state.tasks = state.tasks.filter((item) => item.id !== task.id);
    state.selectedId = null;
    render();
    toast('Задача удалена');
  };
}

function offsetLabel(minutes) {
  if (minutes >= 10080) return `${minutes / 10080} нед`;
  if (minutes >= 1440) return `${minutes / 1440} дн`;
  if (minutes >= 60) return `${minutes / 60} ч`;
  return `${minutes} мин`;
}

async function applyEditor(task) {
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const isNew = Boolean(state.pending && task.id === state.pending.id);
  const date = $('fDate').value;
  const time = $('fTime').value;
  const previous = task;
  if (isNew) return createFromEditor(task, date, time);
  let dueAt = null;
  let allDay = false;
  if (date) {
    const [year, month, day] = date.split('-').map(Number);
    if (time) {
      const [hour, minute] = time.split(':').map(Number);
      dueAt = zonedToUtc(year, month, day, hour, minute, timeZone).toISOString();
    } else {
      dueAt = zonedToUtc(year, month, day, 12, 0, timeZone).toISOString();
      allDay = true;
    }
  }
  const updated = {
    ...previous,
    title: $('fTitle').value.trim() || previous.title,
    notes: $('fNotes').value,
    priority: Number($('fPriority').value),
    recurrence: $('fRecurrence').value || null,
    project: $('fProject').value.trim() || null,
    tags: $('fTags').value.split(/\s+/).map((tag) => tag.replace(/^\+/, '')).filter(Boolean).slice(0, 8),
    due_at: dueAt,
    all_day: allDay,
    remind_offsets: state.draft?.taskId === previous.id && state.draft.remind_offsets ? state.draft.remind_offsets : previous.remind_offsets,
    updated_at: new Date().toISOString(),
    dirty: true,
  };
  state.draft = null;
  state.selectedId = null; // после «Сохранить» карточка закрывается
  await saveTasks(state.tasks.map((item) => (item.id === previous.id ? updated : item)), 'Сохранено');
}

/** Создание из полной карточки: умная строка в названии дополняет пустые поля. */
async function createFromEditor(task, date, time) {
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const raw = $('fTitle').value.trim();
  if (!raw) { toast('Введите название'); $('fTitle').focus(); return; }
  const parsed = await bridge.preview(raw);
  bridge.log('новая задача', raw);
  const title = (parsed.title || raw).trim() || raw;
  let dueAt = null;
  let allDay = false;
  if (date) {
    const [year, month, day] = date.split('-').map(Number);
    if (time) {
      const [hour, minute] = time.split(':').map(Number);
      dueAt = zonedToUtc(year, month, day, hour, minute, timeZone).toISOString();
    } else {
      dueAt = zonedToUtc(year, month, day, 12, 0, timeZone).toISOString();
      allDay = true;
    }
  } else if (parsed.dueAt) {
    dueAt = parsed.dueAt;
    allDay = Boolean(parsed.allDay);
  }
  const formPriority = Number($('fPriority').value);
  const formProject = $('fProject').value.trim();
  const formTags = $('fTags').value.split(/\s+/).map((tag) => tag.replace(/^\+/, '')).filter(Boolean);
  const formRecurrence = $('fRecurrence').value || null;
  const draftOffsets = state.draft?.taskId === task.id && state.draft.remind_offsets ? state.draft.remind_offsets : null;
  const created = newTask(title, {
    notes: $('fNotes').value,
    priority: formPriority !== 1 ? formPriority : Number(parsed.priority ?? 1),
    project: formProject || parsed.project || null,
    tags: (formTags.length ? formTags : (parsed.tags || [])).slice(0, 8),
    recurrence: formRecurrence || parsed.recurrence || null,
    due_at: dueAt,
    all_day: allDay,
    remind_offsets: draftOffsets ?? (parsed.offsets === null || parsed.offsets === undefined ? [1440, 60, 10] : parsed.offsets),
  });
  state.draft = null;
  state.pending = null;
  state.selectedId = null;
  await saveTasks([...state.tasks, created], `Добавлено: ${created.title}`);
}

/** Снимок полей карточки в черновик (вызывается при каждом вводе). */
function captureDraft(task) {
  if (!$('fTitle')) return;
  const previous = state.draft?.taskId === task.id ? state.draft : null;
  state.draft = {
    taskId: task.id,
    title: $('fTitle').value,
    notes: $('fNotes').value,
    date: $('fDate').value,
    time: $('fTime').value,
    priority: Number($('fPriority').value),
    recurrence: $('fRecurrence').value,
    project: $('fProject').value,
    tags: $('fTags').value,
    remind_offsets: previous?.remind_offsets ?? (task.remind_offsets || []),
  };
}

/** Выбор задачи в списке: черновик другой задачи сбрасывается. */
function selectTask(taskId) {
  if (state.draft && state.draft.taskId !== taskId) state.draft = null;
  state.selectedId = taskId;
  render();
}

// --- Добавление задачи: сразу полная карточка ---
let previewTimer = null;
async function updatePreview() {
  const input = $('fTitle');
  const box = $('quickPreview');
  if (!input || !box) return;
  const text = input.value.trim();
  if (!text) { box.textContent = ''; return; }
  const parsed = await bridge.preview(text);
  const bits = [];
  if (parsed.title && parsed.title !== text) bits.push(`«${parsed.title}»`);
  if (parsed.dueLabel) bits.push(parsed.dueLabel);
  if (Number(parsed.priority) > 1) bits.push(`!${parsed.priority}`);
  if (parsed.project) bits.push(`#${parsed.project}`);
  if (parsed.offsets && parsed.offsets.length) bits.push(`🔔 ${parsed.offsets.map(offsetLabel).join(', ')}`);
  else if (parsed.offsets && parsed.offsets.length === 0) bits.push('🔕');
  if (parsed.recurrence) bits.push('🔁');
  if (box.isConnected) box.textContent = bits.join(' · ');
}

function openAdd(dateIso = '') {
  state.draft = null;
  state.pending = newTask('', { remind_offsets: [1440, 60, 10] });
  state.pending.due_at = null;
  state.selectedId = state.pending.id;
  render();
  if (dateIso && $('fDate')) { $('fDate').value = dateIso; captureDraft(state.pending); }
}

  $('archiveBody').innerHTML = `

    </div>
    ${items.length ? items.map((task) => `

    button.onclick = async () => {
      const id = button.dataset.remove;

      state.tasks = state.tasks.filter((item) => item.id !== id);
      render();
      renderArchive();
      toast('Задача удалена');
    };
  });
}

      <h4>Журнал действий</h4>
      <p class="hint">Приложение записывает действия с точным временем в текстовые файлы (один файл на день, хранятся 30 дней). Файлы лежат только на этом компьютере.</p>
      <div class="actions"><button class="ghost" id="sLogShow">Показать журнал</button><button class="ghost" id="sLogFile">Открыть файл</button><button class="ghost" id="sLogFolder">Папка</button></div>
    </div>

    <div class="section">
      <h4>Приложение</h4>
      <div class="switch"><span>Запускать с Windows</span><input type="checkbox" id="sStartup" ${state.startup ? 'checked' : ''} /></div>
      <div class="actions"><button class="ghost" id="sCheckUpdates">Проверить обновления</button>${state.update.status === 'ready' ? '<button class="primary" id="sInstall">Перезапустить и обновить</button>' : ''}</div>
      <p class="hint">${escapeHtml(updateLabel(state.update))}</p>
      <p class="hint">Кнопка «×» закрывает окно в трей: напоминания продолжают работать.</p>
    </div>
    <div class="actions"><button class="ghost" id="sClose">Закрыть</button></div>`;

  const saveSettings = async (patch, message) => {
    state.settings = await bridge.saveSettings(patch);
    if (message) toast(message);
    render();
  };
  $('sTimezone').onchange = () => saveSettings({ timezone: $('sTimezone').value }, 'Часовой пояс сохранён');
  $('sTheme').onchange = async () => { await saveSettings({ theme: $('sTheme').value }); await applyAppearance(); };
  $('sOpacity').oninput = () => { $('sOpacityValue').textContent = `${$('sOpacity').value}%`; document.documentElement.style.setProperty('--panel-alpha', String(Number($('sOpacity').value) / 100)); };
  $('sOpacity').onchange = async () => { await saveSettings({ panelOpacity: Number($('sOpacity').value) }); await applyAppearance(); };
  $('drawer').querySelectorAll('[data-wall]').forEach((button) => {
    button.onclick = async () => {
      const choice = button.dataset.wall;
      if (choice === 'custom') {
        // Повторный клик по уже выбранной своей картинке — предлагаем заменить; иначе просто включаем.
        if (state.settings.wallpaper === 'custom' || !state.settings.wallpaperFile) {
          const result = await bridge.chooseWallpaper();
          if (!result?.ok) { if (result?.reason && result.reason !== 'cancelled') toast(`Не удалось: ${result.reason}`); return; }
          await loadWallpapers(true);
          state.settings = result.settings || { ...state.settings, wallpaper: 'custom' };
          toast('Фон обновлён');
        } else {
          await saveSettings({ wallpaper: 'custom' });
        }
      } else {
        await saveSettings({ wallpaper: choice });
      }
      await applyAppearance();
      renderSettings();
    };
  });
  $('sDigest').onchange = () => saveSettings({ digestEnabled: $('sDigest').checked });
  $('sDigestAt').onchange = () => saveSettings({ digestAt: $('sDigestAt').value || '09:00' }, 'Время дайджеста сохранено');
  $('sNotifications').onchange = () => saveSettings({ notifications: $('sNotifications').value });
  $('sStartup').onchange = async () => {
    const result = await bridge.setStartup($('sStartup').checked);
    state.startup = Boolean(result?.enabled);
    toast(state.startup ? 'Автозапуск включён' : 'Автозапуск выключен');
  };
  $('sSaveCloud').onclick = () => saveSettings({ supabaseUrl: $('sUrl').value.trim(), supabaseKey: $('sKey').value.trim() }, 'Параметры облака сохранены');
  $('sSync')?.addEventListener('click', async () => { const result = await bridge.syncNow(); toast(result?.ok ? 'Синхронизировано' : `Не удалось: ${result?.reason ?? result?.error ?? 'ошибка'}`); render(); });
  // Перед входом/регистрацией подхватываем URL и ключ из полей, даже если «Сохранить параметры облака» не нажимали.
  const ensureCloudSaved = async () => {
    const url = $('sUrl').value.trim();
    const key = $('sKey').value.trim();
    if (!url || !key) throw new Error('заполни Supabase URL и Publishable key ниже');
    if (url !== (state.settings.supabaseUrl || '') || key !== (state.settings.supabaseKey || '')) {
      state.settings = await bridge.saveSettings({ supabaseUrl: url, supabaseKey: key });
    }
  };
  $('sSignIn')?.addEventListener('click', async () => {
    try {
      await ensureCloudSaved();
      state.cloud = await bridge.signIn($('sEmail').value, $('sPassword').value);
      toast('Вход выполнен');
      render();
    } catch (error) { toast(`Не удалось войти: ${error.message}`); }
  });
  $('sSignUp')?.addEventListener('click', async () => {
    try {
      await ensureCloudSaved();
      const result = await bridge.signUp($('sEmail').value, $('sPassword').value);
      toast(result.needsConfirmation ? 'Аккаунт создан: подтвердите e-mail письмом' : 'Аккаунт создан');
      state.cloud = result.state || state.cloud;
      render();
    } catch (error) { toast(`Не удалось зарегистрироваться: ${error.message}`); }
  });
  $('sSignOut')?.addEventListener('click', async () => { state.cloud = await bridge.signOut(); toast('Вы вышли из аккаунта'); render(); });
  $('sTgLink')?.addEventListener('click', async () => {
    try {
      const result = await bridge.linkTelegram($('sTgCode').value);
      state.cloud = result.state || state.cloud;
      toast('Telegram привязан');
      render();
    } catch (error) { toast(error.message); }
  });
  $('sCheckUpdates')?.addEventListener('click', async () => { await bridge.checkUpdates(); render(); });
  $('sInstall')?.addEventListener('click', () => bridge.installUpdate());
  $('openData')?.addEventListener('click', () => bridge.openDataFolder());
  $('sClose').onclick = closeDrawer;
  $('sLogShow').onclick = showLog;
  $('sLogFile').onclick = () => bridge.openLogFile();
  $('sLogFolder').onclick = () => bridge.openLogFolder();
}

// --- Просмотр журнала в приложении ---
async function showLog() {
  const data = await bridge.logTail(400);
  const lines = (data?.lines ?? []).slice().reverse(); // свежие сверху
  const html = lines.map((line) => {
    const [time = '', event = '', ...rest] = line.split('\t');
    return `<div><span class="t">${escapeHtml(time)}</span>  <span class="e">${escapeHtml(event)}</span>  ${escapeHtml(rest.join(' '))}</div>`;
  }).join('') || '<span class="hint">Пока пусто.</span>';
  $('logBody').innerHTML = `
    <div class="editor-head">
      <h3>Журнал действий <span class="hint">· ${lines.length} записей, свежие сверху</span></h3>
      <button class="icon-btn" id="logClose" title="Закрыть (Esc)">×</button>
    </div>
    <div class="log-view">${html}</div>
    <p class="hint" style="margin:10px 0 0">Файл: ${escapeHtml(data?.file ?? '')}</p>`;
  $('logModal').classList.add('open');
  $('logClose').onclick = closeLog;
}
function closeLog() { $('logModal').classList.remove('open'); }

function updateLabel(update) {
  const map = {
    idle: 'Обновления проверяются при запуске приложения.',
    dev: 'Проверка обновлений доступна только в установленной версии.',
    checking: 'Проверяем обновления…',
    available: `Найдена версия ${update.version}. Скачиваем.`,
    downloading: `Скачивание: ${update.percent ?? 0}%`,
    ready: `Версия ${update.version} скачана. Обновление пройдёт без окон: приложение закроется и само откроется через несколько секунд.`,
    current: 'Установлена последняя версия.',
    error: `Ошибка обновления: ${update.error || 'неизвестно'}`,
  };
  return map[update.status] ?? '';
}

async function openDrawer() {
  await loadWallpapers();
  renderSettings();
  $('drawer').style.display = 'block';
  $('overlay').classList.add('open');
}
function closeDrawer() {
  $('drawer').style.display = 'none';
  $('overlay').classList.remove('open');
}


// --- Общий рендер и события ---
function render() {
  renderBoard();
  renderEditor();
  if ($('drawer').style.display === 'block') renderSettings();
  if ($('archiveModal').classList.contains('open')) renderArchive();

  const cloud = state.cloud || {};
  $('cloudDot').className = `dot ${!cloud.configured ? '' : cloud.signedIn ? (cloud.error ? 'warn' : 'ok') : 'warn'}`;
  $('cloudText').textContent = !cloud.configured
    ? 'локально'
    : cloud.signedIn
      ? (state.cloud.lastSyncAt ? 'синхронизировано' : 'в облаке')
      : 'нет входа';
  $('status').title = cloud.signedIn ? `${cloud.email} · нажми, чтобы синхронизировать` : 'Аккаунт настраивается в ⚙ Настройках';
  $('showDone').classList.toggle('on', state.showDone);
}

$('quickAdd').onclick = () => openAdd();
$('archiveButton').onclick = openArchive;
$('weekPrev').onclick = () => { state.weekOffset -= 1; renderBoard(); };
$('weekNext').onclick = () => { state.weekOffset += 1; renderBoard(); };
$('weekLabel').onclick = () => { state.weekOffset = 0; renderBoard(); };
$('archiveModal').addEventListener('mousedown', (event) => { if (event.target === $('archiveModal')) closeArchive(); });
$('search').addEventListener('input', () => { state.search = $('search').value; render(); });
$('showDone').onclick = () => { state.showDone = !state.showDone; render(); };
$('settingsButton').onclick = openDrawer;
$('status').onclick = async () => {
  const result = await bridge.syncNow();
  toast(result?.ok ? `Синхронизировано: ${result.pushed} отправлено, ${result.pulled} получено` : `Синхронизация не выполнена: ${result?.reason ?? result?.error ?? 'нет входа в аккаунт'}`);
};
$('overlay').onclick = closeDrawer;
$('modal').addEventListener('mousedown', (event) => {
  // Клик по затемнению вокруг окна — закрыть без сохранения.
  if (event.target === $('modal')) { state.draft = null; state.pending = null; state.selectedId = null; render(); }
});
$('logModal').addEventListener('mousedown', (event) => { if (event.target === $('logModal')) closeLog(); });
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') {
    if ($('logModal').classList.contains('open')) { closeLog(); return; }
    if ($('archiveModal').classList.contains('open')) { closeArchive(); return; }
    if ($('modal').classList.contains('open')) { state.draft = null; state.pending = null; state.selectedId = null; render(); return; }
    closeDrawer();
  }
  if (event.key === 'n' && event.ctrlKey) { event.preventDefault(); openAdd(); }
});

let resizeTimer = null;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(renderBoard, 120); });
bridge.onTasksChanged((tasks) => { state.tasks = tasks || []; render(); });
bridge.onCloudStatus((cloud) => { state.cloud = { ...state.cloud, ...cloud }; render(); });
bridge.onUpdateStatus((update) => { state.update = update; render(); });
bridge.onFocusTask((taskId) => { selectTask(taskId); });

bootstrap();
</script>
</body>
</html>

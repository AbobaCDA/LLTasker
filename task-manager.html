}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
}


// --- Неделя: раскладка задач по дням ---
const WEEKDAY = new Intl.DateTimeFormat('ru-RU', { weekday: 'long' });
const WEEKDAY_SHORT = new Intl.DateTimeFormat('ru-RU', { weekday: 'short' });
const DAY_MONTH = new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'short' });
function dateAtNoon(dateString) {
  const [year, month, day] = dateString.split('-').map(Number);
  return new Date(Date.UTC(year, month - 1, day, 12, 0));
}
function capitalize(text) { return text ? text[0].toUpperCase() + text.slice(1) : text; }

/** Календарная неделя пн–вс со сдвигом offset (для полоски недель при перетаскивании). */
function weekDays(offset = 0) {
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const today = todayLocal(timeZone);
  const tomorrow = addDaysLocal(timeZone, 1);
  const narrow = window.innerWidth < 1280;
  const mondayShift = (dateAtNoon(today).getUTCDay() + 6) % 7; // пн=0 … вс=6
  return Array.from({ length: 7 }, (_, index) => {
    const date = addDaysLocal(timeZone, -mondayShift + offset * 7 + index);
    const noon = dateAtNoon(date);
    const weekday = noon.getUTCDay();
    const name = narrow ? capitalize(WEEKDAY_SHORT.format(noon)) : capitalize(WEEKDAY.format(noon));
    const dm = DAY_MONTH.format(noon).replace('.', '');
    const sub = date === today ? `${dm} · сегодня` : date === tomorrow ? `${dm} · завтра` : dm;
    return { date, name, sub, weekend: weekday === 0 || weekday === 6, isToday: date === today, isPast: date < today };
  });
}

/** Лента доски: STRIP_DAYS дней начиная с завтра — ключ-дата, подпись, мелкая дата. В окне видно 7. */
const STRIP_DAYS = 28;
function boardDays() {
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const today = todayLocal(timeZone);
  const tomorrow = addDaysLocal(timeZone, 1);
  const narrow = window.innerWidth < 1280;
  return Array.from({ length: STRIP_DAYS }, (_, index) => {
    const date = addDaysLocal(timeZone, 1 + index);
    const noon = dateAtNoon(date);
    const weekday = noon.getUTCDay();
    const name = narrow ? capitalize(WEEKDAY_SHORT.format(noon)) : capitalize(WEEKDAY.format(noon));
    const dm = DAY_MONTH.format(noon).replace('.', '');
    const sub = date === today ? `${dm} · сегодня` : date === tomorrow ? `${dm} · завтра` : dm;
    return { date, name, sub, weekend: weekday === 0 || weekday === 6, isToday: date === today, isPast: date < today };
  });
}
/** Шаг ленты: ширина колонки + зазор. */
function colStep() { const col = $('days')?.querySelector('.col'); return Math.max(60, (col?.offsetWidth ?? 150) + 7); }
/** Индекс первого видимого дня ленты (0 = завтра). */
function firstVisibleIndex() { const el = $('days'); return el ? Math.max(0, Math.min(STRIP_DAYS - 7, Math.round(el.scrollLeft / colStep()))) : 0; }
function scrollToIndex(index, smooth = true) {
  const el = $('days'); if (!el) return;
  const target = Math.max(0, Math.min(STRIP_DAYS - 7, index)) * colStep();
  el.scrollTo({ left: target, behavior: smooth ? 'smooth' : 'auto' });
  state.daysScroll = target;
  updateRangeLabel(index);
}
function shiftDays(count) { scrollToIndex(firstVisibleIndex() + count); }
function goToDate(date) {
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const index = Math.round((dateAtNoon(date) - dateAtNoon(addDaysLocal(timeZone, 1))) / 86400000);
  if (index < 0 || index >= STRIP_DAYS) toast('Доска показывает 4 недели вперёд');
  scrollToIndex(index);
}
function updateRangeLabel(index = firstVisibleIndex()) {
  const days = boardDays();
  const first = Math.max(0, Math.min(STRIP_DAYS - 7, index));
  const a = DAY_MONTH.format(dateAtNoon(days[first].date)).replace('.', '');
  const b = DAY_MONTH.format(dateAtNoon(days[first + 6].date)).replace('.', '');
  $('weekLabel').textContent = `${a} – ${b}`;
  $('weekLabel').classList.toggle('off', first === 0);
}

/** Колонка «Сегодня» слева: всегда видна, какую бы неделю ни листали. */
function todayColumn() {
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const date = todayLocal(timeZone);
  const noon = dateAtNoon(date);
  return { date, name: 'Сегодня', sub: `${WEEKDAY_SHORT.format(noon)}, ${DAY_MONTH.format(noon).replace('.', '')}`, weekend: false, isToday: true, isPast: false };
}

function matchesSearch(task) {
  const query = state.search.trim().toLowerCase();
  if (!query) return true;
  return `${task.title} ${task.notes} ${task.project ?? ''} ${(task.tags || []).join(' ')}`.toLowerCase().includes(query);
}

function byBoardOrder(left, right) {
  if (left.status !== right.status) return left.status === 'open' ? -1 : 1;
  const leftOrder = Number.isFinite(Number(left.sort_order)) ? Number(left.sort_order) : 0;
  const rightOrder = Number.isFinite(Number(right.sort_order)) ? Number(right.sort_order) : 0;
  if (leftOrder !== rightOrder) return leftOrder - rightOrder;
  const leftDue = left.due_at ? Date.parse(left.due_at) : Number.MAX_SAFE_INTEGER;
  const rightDue = right.due_at ? Date.parse(right.due_at) : Number.MAX_SAFE_INTEGER;
  if (leftDue !== rightDue) return leftDue - rightDue;
  return Number(right.priority) - Number(left.priority);
}

/** Раскладка: { days: Map(date → tasks[]), none: tasks[] }. Просроченные попадают в «Сегодня» (на текущей неделе). */
function boardData() {
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const days = boardDays();
  const today = todayLocal(timeZone);
  // «Сегодня» — отдельная колонка слева; в ленте её день остаётся, но карточки не дублируются.
  const buckets = { today: [], days: new Map(days.map((day) => [day.date, []])), none: [] };
  for (const task of state.tasks) {
    if (task.status === 'archived') continue;
    if (task.status === 'done' && !state.showDone) continue;
    if (!matchesSearch(task)) continue;
    if (!task.due_at) { buckets.none.push(task); continue; }
    const date = localDate(task.due_at, timeZone);
    if (date === today) buckets.today.push(task);
    else if (date < today && task.status !== 'done') buckets.today.push(task); // просроченные — в «Сегодня», всегда на виду
    else if (buckets.days.has(date)) buckets.days.get(date).push(task);
  }
  buckets.today.sort(byBoardOrder);
  for (const list of buckets.days.values()) list.sort(byBoardOrder);
  buckets.none.sort(byBoardOrder);
  return { days, buckets, today };
}

function cardHtml(task, { showDay = false, attrs = '' } = {}) {
  const late = isLate(task);
  const time = dueLabel(task);
  const top = [];
  if (showDay && task.due_at) top.push(`<span class="${late ? 'late' : 'time'}">${escapeHtml(dueDayLabel(task))}</span>`);
  else if (late) top.push(`<span class="late" title="Просрочено">${escapeHtml(dueDayLabel(task))}</span>`);
  else if (time) top.push(`<span class="time">${time}</span>`);
  else if (task.due_at) top.push('<span>весь день</span>');
  const foot = [];
  if (task.project) foot.push(`<span class="proj">#${escapeHtml(task.project)}</span>`);
  if (task.recurrence) foot.push('<span title="Повторяется">🔁</span>');
  if (task.due_at && (task.remind_offsets || []).length === 0) foot.push('<span title="Напоминания выключены">🔕</span>');
  if (!task.synced && state.cloud.signedIn) foot.push('<span title="Ещё не ушло в облако">⏳</span>');
  return `
    <div class="card prio-${Number(task.priority) || 0} ${task.status === 'done' ? 'done' : ''}" draggable="true" data-id="${task.id}" title="${escapeHtml(task.title)}"${attrs}>
      <span class="stripe"></span>
      <div class="top">${top.join('')}<button class="check ${task.status === 'done' ? 'done' : ''}" data-toggle="${task.id}" title="Выполнено">${task.status === 'done' ? '✓' : ''}</button></div>
      <div class="title">${escapeHtml(task.title)}</div>
      <div class="foot">${foot.join('')}</div>
    </div>`;
}

// --- Таймлайн дня: 8:00–22:00, шаг полчаса ---
const DAY_START = 8 * 60;
const DAY_END = 22 * 60;
const DAY_SPAN = DAY_END - DAY_START;
/** Минуты от полуночи (локально) для задачи со временем; null — весь день / без срока. */
function taskMinutes(task) {
  if (!task.due_at || task.all_day) return null;
  const p = parts(task.due_at, state.settings.timezone || 'Europe/Moscow');
  return p.hour * 60 + p.minute;
}
function minutesLabel(minutes) { return `${String(Math.floor(minutes / 60)).padStart(2, '0')}:${String(minutes % 60).padStart(2, '0')}`; }
/** Тело колонки дня: просроченные (только «Сегодня») сверху, таймлайн, внизу — задачи без времени. */
function dayBodyHtml(tasks) {
  const overdue = tasks.filter((task) => isLate(task));
  const timed = tasks.filter((task) => !isLate(task) && taskMinutes(task) !== null).sort((a, b) => taskMinutes(a) - taskMinutes(b));
  const allDay = tasks.filter((task) => !isLate(task) && taskMinutes(task) === null);
  const slots = Array.from({ length: DAY_SPAN / 30 }, (_, i) => (i % 2 === 0 ? `<div class="slot hour" data-h="${DAY_START / 60 + i / 2}"></div>` : '<div class="slot"></div>')).join('');
  return `${overdue.length ? `<div class="overdue">${overdue.map((task) => cardHtml(task)).join('')}</div>` : ''}
    <div class="timeline">${slots}${timed.map((task) => cardHtml(task, { attrs: ` data-min="${taskMinutes(task)}"` })).join('')}</div>
    <div class="allday">${allDay.map((task) => cardHtml(task)).join('')}</div>`;
}
/** Расставляет карточки таймлайна по времени (px), разводит наложения сдвигом, рисует линию «сейчас». */
function layoutTimelines() {
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const today = todayLocal(timeZone);
  const now = parts(new Date().toISOString(), timeZone);
  const nowMinutes = now.hour * 60 + now.minute;
  document.querySelectorAll('.timeline').forEach((timeline) => {
    const height = timeline.clientHeight;
    if (!height) return;
    const toPx = (minutes) => (Math.min(DAY_END, Math.max(DAY_START, minutes)) - DAY_START) / DAY_SPAN * height;
    let prev = null;
    const cards = Array.from(timeline.querySelectorAll('.card[data-min]')).sort((a, b) => Number(a.dataset.min) - Number(b.dataset.min));
    cards.forEach((card, index) => {
      const h = card.offsetHeight;
      let top = Math.min(height - h, toPx(Number(card.dataset.min)));
      let shift = 0;
      if (prev && top < prev.top + prev.h - 2) { // наложение — чуть ниже и правее предыдущей
        top = Math.min(height - h, Math.max(top, prev.top + 18));
        shift = prev.shift + 10;
      } else shift = 0;
      card.style.top = `${Math.max(0, top)}px`;
      card.style.left = `${2 + shift}px`;
      card.style.zIndex = String(3 + index);
      prev = { top: Math.max(0, top), h, shift };
    });
    let line = timeline.querySelector('.now');
    const isToday = timeline.closest('.col')?.dataset.day === today;
    if (isToday && nowMinutes >= DAY_START && nowMinutes <= DAY_END) {
      if (!line) { line = document.createElement('div'); line.className = 'now'; timeline.appendChild(line); }
      line.style.top = `${toPx(nowMinutes)}px`;
    } else line?.remove();
  });
}
/** Время по положению курсора в таймлайне (шаг 30 минут) или null, если ниже сетки (зона «без времени»). */
function minutesAtPoint(zone, clientY) {
  const timeline = zone.querySelector('.timeline');
  if (!timeline) return null;
  const rect = timeline.getBoundingClientRect();
  if (clientY >= rect.bottom) return null;
  const ratio = Math.min(1, Math.max(0, (clientY - rect.top) / rect.height));
  return Math.min(DAY_END - 30, DAY_START + Math.round(ratio * DAY_SPAN / 30) * 30);
}

function renderBoard() {
  const { days, buckets } = boardData();
  const todayCol = todayColumn();
  const columnHtml = (day, tasks, extraClass = '', body = null) => `
      <section class="col ${extraClass} ${day.isToday ? 'is-today' : ''} ${day.isPast ? 'past' : ''} ${day.weekend ? 'weekend' : ''}" data-day="${day.date}">
        <div class="col-head"><span class="name">${day.name}</span><span class="n">${tasks.length || ''}</span><span class="date">${day.sub}</span></div>
        <div class="col-body" data-zone="day" data-day="${day.date}">${body ?? dayBodyHtml(tasks)}</div>
      </section>`;
  $('board').innerHTML = columnHtml(todayCol, buckets.today, 'today-pane')
    + `<div class="days" id="days">${days.map((day) => day.isToday
      ? columnHtml(day, buckets.today, '', '<div class="same-day">← задачи на сегодня — в колонке слева</div>')
      : columnHtml(day, buckets.days.get(day.date))).join('')}</div>`;
  const daysEl = $('days');
  const dayBody = daysEl.querySelector('.col-body');
  if (dayBody) {
    const cs = getComputedStyle(dayBody);
    const width = dayBody.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    if (width > 60) document.documentElement.style.setProperty('--day-card-w', `${Math.round(width)}px`); // карточки на полке — той же ширины, что в днях
  }
  daysEl.scrollLeft = state.daysScroll || 0;
  daysEl.addEventListener('scroll', () => { state.daysScroll = daysEl.scrollLeft; if (!pan) updateRangeLabel(); }, { passive: true });
  // Автопрокрутка ленты, когда карточку тянут к её краю.
  daysEl.addEventListener('dragover', (event) => {
    if (!dragId) return;
    const rect = daysEl.getBoundingClientRect();
    if (event.clientX < rect.left + 48) daysEl.scrollLeft -= 14;
    else if (event.clientX > rect.right - 48) daysEl.scrollLeft += 14;
  });
  attachDaysPan(daysEl);
  updateRangeLabel();
  layoutTimelines();
  // Двойной клик по дню (не по карточке) — новая задача сразу на эту дату; по полке — без срока.
  document.querySelectorAll('#board .col[data-day]').forEach((col) => {
    col.addEventListener('dblclick', (event) => {
      if (event.target.closest('.card, button')) return;
      const zone = col.querySelector('.col-body[data-zone="day"]');
      const minutes = zone && event.target.closest('.timeline') ? minutesAtPoint(zone, event.clientY) : null;
      openAdd(col.dataset.day, minutes === null ? '' : minutesLabel(minutes));
    });
  });


  const pool = buckets.none;
  $('shelf').innerHTML = `
    <section class="col" data-zone-wrap="none">
      <div class="col-head"><span class="name">Без срока</span><span class="n">${pool.length || ''}</span></div>
      <div class="col-body" data-zone="none">${pool.length ? pool.map((task) => cardHtml(task)).join('') : '<span class="empty-hint">Пул дел без даты. Перетащи карточку сюда, чтобы снять срок, или на день — чтобы назначить.</span>'}</div>
    </section>`;

  $('shelf').querySelector('.col')?.addEventListener('dblclick', (event) => { if (!event.target.closest('.card, button')) openAdd(); });
  document.querySelectorAll('[data-toggle]').forEach((button) => {
    button.onclick = (event) => { event.stopPropagation(); toggleDone(button.dataset.toggle); };
  });
  document.querySelectorAll('.card[data-id]').forEach((card) => {
    card.onclick = () => selectTask(card.dataset.id);
    card.oncontextmenu = (event) => openCardMenu(event, card.dataset.id);
    card.addEventListener('dragstart', onDragStart);
    card.addEventListener('dragend', onDragEnd);
  });
  // Бросать можно в любое место колонки (включая заголовок и пустоту) — карточки лежат в .col-body.
  document.querySelectorAll('.col').forEach((col) => {
    col.addEventListener('dragover', onDragOver);
    col.addEventListener('dragleave', onDragLeave);
    col.addEventListener('drop', onDrop);
  });
}

// --- Лента дней: тянуть мышкой за день, колесо — вбок, автопрокрутка при переносе карточки ---
let pan = null; // { x, left, moved } — лента листается протяжкой мышкой за заголовок/пустое место
window.addEventListener('mousemove', (event) => {
  if (!pan) return;
  const dx = event.clientX - pan.x;
  if (!pan.moved && Math.abs(dx) < 6) return;
  pan.moved = true;
  document.body.classList.add('panning');
  const el = $('days'); if (el) el.scrollLeft = pan.left - dx;
});
window.addEventListener('mouseup', () => {
  if (!pan) return;
  document.body.classList.remove('panning');
  const moved = pan.moved; pan = null;
  if (moved) scrollToIndex(Math.round(($('days')?.scrollLeft ?? 0) / colStep())); // довести до целой колонки
});
let lastRightClick = 0;
function attachDaysPan(el) {
  if (!el) return;
  const cols = el.querySelectorAll('.col');
  cols.forEach((col) => {
    // Два правых щелчка подряд по дню (не по карточке) — вернуться к сегодняшним дням.
    col.addEventListener('contextmenu', (event) => {
      if (event.target.closest('.card')) return;
      event.preventDefault();
      const now = Date.now();
      if (now - lastRightClick < 500) { lastRightClick = 0; if (firstVisibleIndex() !== 0) { scrollToIndex(0); toast('К сегодняшним дням'); } }
      else lastRightClick = now;
    });
    col.addEventListener('mousedown', (event) => {
      if (event.button !== 0 || event.target.closest('.card, button')) return;
      pan = { x: event.clientX, left: el.scrollLeft, moved: false };
    });
    col.addEventListener('wheel', (event) => {
      if (Math.abs(event.deltaX) > Math.abs(event.deltaY)) { event.preventDefault(); shiftDays(event.deltaX > 0 ? 1 : -1); return; }
      const body = event.target.closest('.col-body');
      if (body && body.scrollHeight > body.clientHeight + 2) return; // внутри колонки есть что листать вниз
      if (!event.shiftKey) return; // обычное колесо — ничего; Shift+колесо — листать дни
      event.preventDefault();
      shiftDays(event.deltaY > 0 ? 1 : -1);
    }, { passive: false });
  });
}

/** Календарь по клику на подпись дат: выбрал день — доска начинается с него. */
function openRangeCalendar() {
  if (picker && picker.anchor === $('weekLabel')) { closePicker(); return; }
  closePicker();
  const first = boardDays()[firstVisibleIndex()].date;
  const input = document.createElement('input');
  input.value = displayDate(first);
  const el = document.createElement('div');
  el.className = 'picker';
  el.addEventListener('mousedown', (event) => event.preventDefault());
  document.body.appendChild(el);
  picker = { kind: 'date', input, el, anchor: $('weekLabel'), month: first.slice(0, 7), range: 7, onPick: (iso) => goToDate(iso) };
  renderPicker();
}

// --- Перетаскивание: внутри дня (порядок) и между днями (срок) ---
let dragId = null;
let placeholder = null;

let dragGrabY = 0; // где внутри карточки схватили — чтобы время считалось по верхнему краю карточки
function onDragStart(event) {
  dragId = event.currentTarget.dataset.id;
  dragGrabY = event.clientY - event.currentTarget.getBoundingClientRect().top;
  event.currentTarget.classList.add('dragging');
  event.dataTransfer.effectAllowed = 'move';
  event.dataTransfer.setData('text/plain', dragId);
  placeholder = document.createElement('div');
  placeholder.className = 'placeholder';
  // Полоску выбора недели показываем на следующем тике: правка DOM прямо в dragstart срывает перетаскивание в Chromium.
  setTimeout(() => { if (dragId) { pickWeek = 1; renderWeekPick(); document.body.classList.add('dragging'); } }, 0);
}
function onDragEnd() {
  document.querySelectorAll('.card[style]').forEach((card) => { card.style.transform = ''; card.style.transition = ''; }); // позиции таймлайна (top/left) не трогаем
  document.querySelectorAll('.card.dragging').forEach((card) => card.classList.remove('dragging'));
  document.querySelectorAll('.col.drop').forEach((col) => col.classList.remove('drop'));
  document.body.classList.remove('dragging');
  placeholder?.remove();
  placeholder = null;
  dragId = null;
}

// --- Полоска выбора недели при перетаскивании: наведи на неделю — раскроются её дни, брось на число ---
let pickWeek = 1;
const PICK_OFFSETS = [-1, 0, 1, 2, 3, 4, 5];
function pickWeekTag(offset) {
  return offset === 0 ? 'эта' : offset === 1 ? 'след.' : offset === -1 ? 'пред.' : `+${offset}`;
}
function renderWeekPick() {
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const today = todayLocal(timeZone);
  const weeks = PICK_OFFSETS.map((offset) => {
    const days = weekDays(offset);
    const a = DAY_MONTH.format(dateAtNoon(days[0].date)).replace('.', '');
    const b = DAY_MONTH.format(dateAtNoon(days[6].date)).replace('.', '');
    return { offset, days, label: `${a} – ${b}` };
  });
  const selected = weeks.find((week) => week.offset === pickWeek) ?? weeks[2];
  $('weekPick').innerHTML = `
    <div class="wk-row">${weeks.map((week) => `<div class="wk ${week.offset === selected.offset ? 'sel' : ''}" data-week="${week.offset}">${pickWeekTag(week.offset)} <b>${week.label}</b></div>`).join('')}</div>
    <div class="wd-row">${selected.days.map((day) => `<div class="wd ${day.weekend ? 'weekend' : ''} ${day.date === today ? 'is-today' : ''}" data-date="${day.date}">${WEEKDAY_SHORT.format(dateAtNoon(day.date))}<b>${dateAtNoon(day.date).getUTCDate()}</b></div>`).join('')}</div>
    <p class="hint">Наведи на неделю — откроются её дни. Брось карточку на число.</p>`;
  $('weekPick').querySelectorAll('.wk').forEach((chip) => {
    chip.addEventListener('dragenter', (event) => {
      event.preventDefault();
      const offset = Number(chip.dataset.week);
      if (offset !== pickWeek) { pickWeek = offset; renderWeekPick(); }
    });
    chip.addEventListener('dragover', (event) => { event.preventDefault(); event.dataTransfer.dropEffect = 'move'; chip.classList.add('over'); });
    chip.addEventListener('dragleave', () => chip.classList.remove('over'));
    chip.addEventListener('drop', async (event) => {
      // Бросили на саму неделю — тот же день недели в выбранной неделе.
      event.preventDefault();
      const taskId = dragId || event.dataTransfer.getData('text/plain');
      const task = state.tasks.find((item) => item.id === taskId);
      onDragEnd();
      if (!task) return;
      const days = weekDays(Number(chip.dataset.week));
      const current = task.due_at ? localDate(task.due_at, timeZone) : today;
      const weekdayIndex = (dateAtNoon(current).getUTCDay() + 6) % 7;
      await dropOnDate(taskId, days[weekdayIndex].date);
    });
  });
  $('weekPick').querySelectorAll('.wd').forEach((cell) => {
    cell.addEventListener('dragover', (event) => { event.preventDefault(); event.dataTransfer.dropEffect = 'move'; cell.classList.add('over'); });
    cell.addEventListener('dragleave', () => cell.classList.remove('over'));
    cell.addEventListener('drop', async (event) => {
      event.preventDefault();
      const taskId = dragId || event.dataTransfer.getData('text/plain');
      onDragEnd();
      if (taskId) await dropOnDate(taskId, cell.dataset.date);
    });
  });
}
/** Перенос на дату, которой может не быть на экране: встаёт в конец этого дня. */
async function dropOnDate(taskId, date) {
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const sameDay = state.tasks
    .filter((task) => task.id !== taskId && task.status !== 'archived' && task.due_at && localDate(task.due_at, timeZone) === date)
    .sort(byBoardOrder)
    .map((task) => task.id);
  await moveTask(taskId, { kind: 'day', date }, [...sameDay, taskId]);
}
function onDragOver(event) {
  if (!dragId) return;
  event.preventDefault();
  event.dataTransfer.dropEffect = 'move';
  const col = event.currentTarget;
  const zone = col.querySelector('.col-body[data-zone]');
  if (!zone) return;
  col.classList.add('drop');
  if (zone.dataset.zone === 'day') { placeDayPlaceholder(zone, event.clientY - dragGrabY); return; }
  // Полка: вставить перед первой карточкой, чья середина правее курсора.
  const horizontal = zone.dataset.zone !== 'day';
  const cards = Array.from(zone.querySelectorAll('.card:not(.dragging)'));
  const next = cards.find((card) => {
    const rect = layoutRect(card); // без учёта анимации сдвига — иначе карточки «дрожат» между двумя позициями
    return horizontal ? event.clientX < rect.left + rect.width / 2 : event.clientY < rect.top + rect.height / 2;
  });
  if (placeholder && placeholder.parentElement !== zone || (next ? placeholder.nextSibling !== next : placeholder.parentElement !== zone || zone.lastElementChild !== placeholder)) {
    movePlaceholder(zone, next);
  }
}
/** Заглушка в колонке дня: прилипает к получасу под верхним краем карточки; ниже сетки — в зону «без времени». */
function placeDayPlaceholder(zone, topY) {
  if (!placeholder) return;
  const timeline = zone.querySelector('.timeline');
  const allday = zone.querySelector('.allday');
  const minutes = minutesAtPoint(zone, topY + 1);
  if (minutes === null) {
    if (placeholder.parentElement !== allday) { placeholder.removeAttribute('style'); allday.appendChild(placeholder); }
    placeholder.dataset.min = '';
    return;
  }
  if (placeholder.parentElement !== timeline) timeline.appendChild(placeholder);
  const rect = timeline.getBoundingClientRect();
  const top = Math.min(rect.height - placeholder.offsetHeight, (minutes - DAY_START) / DAY_SPAN * rect.height);
  placeholder.style.top = `${Math.max(0, top)}px`;
  placeholder.dataset.min = String(minutes);
}
/** Прямоугольник карточки по раскладке, без текущего transform (FLIP-анимация, hover). */
function layoutRect(card) {
  const rect = card.getBoundingClientRect();
  const matrix = new DOMMatrix(getComputedStyle(card).transform);
  return { left: rect.left - matrix.m41, top: rect.top - matrix.m42, width: rect.width, height: rect.height };
}
/** Переставляет заглушку и плавно «доводит» соседние карточки на новые места (FLIP), а не телепортирует их. */
function movePlaceholder(zone, next) {
  const cards = Array.from(zone.querySelectorAll('.card:not(.dragging)'));
  const before = new Map(cards.map((card) => [card, card.getBoundingClientRect()])); // где карточка сейчас визуально (с учётом недоигранной анимации)
  if (next) zone.insertBefore(placeholder, next); else zone.appendChild(placeholder);
  for (const card of cards) {
    const a = before.get(card);
    const b = layoutRect(card);
    const dx = a.left - b.left;
    const dy = a.top - b.top;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) continue;
    card.style.transition = 'none';
    card.style.transform = `translate(${dx}px, ${dy}px)`;
    requestAnimationFrame(() => {
      if (!dragId) { card.style.transform = ''; card.style.transition = ''; return; }
      card.style.transition = 'transform .18s ease';
      card.style.transform = '';
      setTimeout(() => { card.style.transform = ''; card.style.transition = ''; }, 200);
    });
  }
}
function onDragLeave(event) {
  const col = event.currentTarget;
  if (!col.contains(event.relatedTarget)) col.classList.remove('drop');
}
async function onDrop(event) {
  event.preventDefault();
  const zone = event.currentTarget.querySelector('.col-body[data-zone]');
  const taskId = dragId || event.dataTransfer.getData('text/plain');
  if (!zone || !taskId) return;
  // Порядок в целевой зоне: карточки + метка на месте вставки.
  const order = Array.from(zone.children)
    .filter((element) => element === placeholder || element.dataset?.id !== taskId) // саму карточку считаем там, где стоит метка
    .map((element) => (element === placeholder ? taskId : element.dataset?.id))
    .filter((id, index, list) => id && list.indexOf(id) === index);
  if (!order.includes(taskId)) order.push(taskId);
  const target = zone.dataset.zone === 'day'
    ? { kind: 'day', date: zone.dataset.day, minutes: placeholder?.dataset.min ? Number(placeholder.dataset.min) : null, allDay: placeholder?.parentElement?.classList.contains('allday') ?? false }
    : { kind: zone.dataset.zone };
  const point = { x: event.clientX, y: event.clientY };
  onDragEnd();
  await moveTask(taskId, target, target.kind === 'day' ? [] : order);
  if (target.kind === 'day' && target.minutes !== null) {
    const task = state.tasks.find((item) => item.id === taskId);
    if (task && taskMinutes(task) !== target.minutes) openTimeSuggest(taskId, target.date, target.minutes, point);
  }
}

/** Всплывашка у места броска: предлагает время по сетке; Enter/✓ — поставить, Esc/✕ — оставить как было. */
function openTimeSuggest(taskId, date, minutes, point) {
  closePicker();
  const task = state.tasks.find((item) => item.id === taskId);
  if (!task) return;
  const current = taskMinutes(task);
  const el = document.createElement('div');
  el.className = 'picker timepop';
  el.innerHTML = `
    <div class="row"><span>Время</span><input id="tpTime" value="${minutesLabel(minutes)}" inputmode="numeric" autocomplete="off" /><button type="button" class="ok" title="Поставить (Enter)">✓</button><button type="button" class="no" title="Оставить (Esc)">✕</button></div>
    <div class="hint">${current === null ? 'Сейчас — без времени' : `Сейчас — ${minutesLabel(current)}`} · Enter — поставить, Esc — оставить</div>`;
  document.body.appendChild(el);
  const input = el.querySelector('#tpTime');
  picker = { kind: 'timepop', input, el, point };
  placePicker();
  input.focus(); input.select();
  const apply = async () => {
    const text = parseTimeText(input.value);
    if (!text) { input.classList.add('bad'); return; }
    closePicker();
    const [hour, minute] = text.split(':').map(Number);
    const [year, month, day] = date.split('-').map(Number);
    const timeZone = state.settings.timezone || 'Europe/Moscow';
    const due = zonedToUtc(year, month, day, hour, minute, timeZone).toISOString();
    bridge.log('время по сетке', `«${task.title}» → ${text}`);
    await saveTasks(state.tasks.map((item) => (item.id === taskId ? { ...item, due_at: due, all_day: false, updated_at: new Date().toISOString(), dirty: true } : item)), `${task.title} — ${text}`);
  };
  el.querySelector('.ok').onclick = apply;
  el.querySelector('.no').onclick = () => closePicker();
  input.addEventListener('keydown', (event) => { if (event.key === 'Enter') { event.preventDefault(); apply(); } });
  input.addEventListener('input', () => input.classList.remove('bad'));
}

/** Переносит задачу: меняет срок (время сохраняется) и переписывает порядок карточек в целевой зоне. */
async function moveTask(taskId, target, order) {
  const task = state.tasks.find((item) => item.id === taskId);
  if (!task) return;
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const now = new Date().toISOString();
  let patch = {};
  if (target.kind === 'day') {
    const dateString = target.date;
    const [year, month, day] = dateString.split('-').map(Number);
    if (target.allDay) {
      patch = { due_at: zonedToUtc(year, month, day, 12, 0, timeZone).toISOString(), all_day: true };
    } else if (task.due_at && !task.all_day) {
      const p = parts(task.due_at, timeZone);
      patch = { due_at: zonedToUtc(year, month, day, p.hour, p.minute, timeZone).toISOString(), all_day: false };
    } else {
      patch = { due_at: zonedToUtc(year, month, day, 12, 0, timeZone).toISOString(), all_day: true };
    }
    if (task.due_at && localDate(task.due_at, timeZone) === target.date && (!target.allDay || task.all_day)) patch = {};
  } else if (target.kind === 'none') {
    patch = task.due_at ? { due_at: null, all_day: false } : {};
  }
  if (!Object.keys(patch).length && !order.length) return; // бросили туда же — менять нечего
  const positions = new Map(order.map((id, index) => [id, index * 10]));
  const next = state.tasks.map((item) => {
    const isMoved = item.id === taskId;
    const position = positions.get(item.id);
    const orderChanged = position !== undefined && Number(item.sort_order) !== position;
    if (!isMoved && !orderChanged) return item;
    return { ...item, ...(isMoved ? patch : {}), ...(position !== undefined ? { sort_order: position } : {}), updated_at: now, dirty: true };
  });
  const label = target.kind === 'none' ? 'без срока' : `на ${dueDayLabelFor(target.date)}`;
  bridge.log('перетаскивание', `«${task.title}» → ${label}${Object.keys(patch).length ? '' : ' (изменён порядок)'}`);
  await saveTasks(next, Object.keys(patch).length ? `«${task.title}» — ${label}` : null);
}
function dueDayLabelFor(dateString) {
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  if (dateString === todayLocal(timeZone)) return 'сегодня';
  if (dateString === addDaysLocal(timeZone, 1)) return 'завтра';
  const noon = dateAtNoon(dateString);
  return `${WEEKDAY_SHORT.format(noon)}, ${DAY_MONTH.format(noon).replace('.', '')}`;
}
async function toggleDone(taskId) {
  const task = state.tasks.find((item) => item.id === taskId);
  if (!task) return;
  const done = task.status !== 'done';
  const next = state.tasks.map((item) => item.id === taskId
    ? { ...item, status: done ? 'done' : 'open', completed_at: done ? new Date().toISOString() : null, updated_at: new Date().toISOString(), dirty: true }
    : item);
  if (done && task.recurrence) {
    // Повторяющиеся задачи создаёт триггер в БД; локально показываем подсказку.
    const backendNote = state.cloud.signedIn ? 'следующее вхождение создастся в облаке' : 'повтор создастся при включённой синхронизации';
    toast(`Готово: ${task.title} · ${backendNote}`);
  }
  await saveTasks(next, null);
}

// --- Карточка задачи (всплывающее окно) ---
function renderEditor() {
  // Новая задача живёт в state.pending, пока её не создали кнопкой; в списке её ещё нет.
  const task = state.tasks.find((item) => item.id === state.selectedId)
    ?? (state.pending && state.pending.id === state.selectedId ? state.pending : null);
  const isNew = Boolean(task && state.pending && task.id === state.pending.id);
  if (!task) {
    $('modal').classList.remove('open');
    $('editor').innerHTML = '';
    closePicker();
    return;
  }
  $('modal').classList.add('open');
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const p = task.due_at ? parts(task.due_at, timeZone) : null;
  const savedDate = p ? `${p.year}-${String(p.month).padStart(2, '0')}-${String(p.day).padStart(2, '0')}` : '';
  const savedTime = p && !task.all_day ? `${String(p.hour).padStart(2, '0')}:${String(p.minute).padStart(2, '0')}` : '';
  // Если для этой задачи есть несохранённый черновик — показываем его, а не сохранённые значения.
  // Иначе любая перерисовка (вкладки, фоновая синхронизация) стирала бы введённое.
  if (state.draft && state.draft.taskId !== task.id) state.draft = null;
  const d = state.draft ?? {};
  const v = {
    title: d.title ?? task.title,
    notes: d.notes ?? (task.notes || ''),
    date: d.date ?? displayDate(savedDate),
    time: d.time ?? savedTime,
    priority: d.priority ?? Number(task.priority),
    recurrence: d.recurrence ?? (task.recurrence ?? ''),
    project: d.project ?? (task.project ?? ''),
    tags: d.tags ?? (task.tags || []).join(' '),
    remind_offsets: d.remind_offsets ?? (task.remind_offsets || []),
  };
  $('editor').innerHTML = `
    <div class="editor-head">
      <h3>${isNew ? 'Новая задача' : task.due_at ? escapeHtml(dueDayLabel(task)) : 'Без срока'}${state.draft && !isNew ? ' <span class="hint">· не сохранено</span>' : ''}</h3>
      <button class="icon-btn" id="fClose" title="Закрыть без сохранения (Esc)">×</button>
    </div>
    <div class="field"><label>Название</label><input id="fTitle" value="${escapeHtml(v.title)}" placeholder="${isNew ? 'купить фильтр завтра 19:00 !2 #дом' : ''}" autocomplete="off" /></div>
    ${isNew ? '<div class="preview" id="quickPreview"></div><p class="hint" style="margin:2px 0 10px">Можно просто словами: <b>завтра 19:00</b>, <b>в пятницу в 10</b>, <b>через 3 дня</b>, <b>!3</b> — приоритет, <b>#дом</b> — проект, <b>+срочно</b> — тег, <b>за день за час</b> — напоминания, <b>каждый день</b>. Что разобралось из строки — подставится в пустые поля ниже.</p>' : ''}
    <div class="field"><label>Заметки</label><textarea id="fNotes">${escapeHtml(v.notes)}</textarea></div>
    <div class="row">
      <div class="field"><label>Дата</label><input id="fDate" value="${escapeHtml(v.date)}" placeholder="дд.мм.гггг" inputmode="numeric" autocomplete="off" /></div>
      <div class="field"><label>Время</label><input id="fTime" value="${escapeHtml(v.time)}" placeholder="чч:мм" inputmode="numeric" autocomplete="off" /></div>
    </div>
    <div class="row">
      <div class="field"><label>Приоритет</label>${selectHtml('fPriority', PRIORITY_CHOICES.map((index) => [String(index), PRIORITY_LABELS[index]]), String(Math.max(1, Number(v.priority) || 1)))}</div>
      <div class="field"><label>Повтор</label>${selectHtml('fRecurrence', RECURRENCE_OPTIONS, v.recurrence)}</div>
    </div>
    <div class="row">
      <div class="field"><label>Проект</label><input id="fProject" value="${escapeHtml(v.project)}" placeholder="например, работа" /></div>
      <div class="field"><label>Теги</label><input id="fTags" value="${escapeHtml(v.tags)}" placeholder="через пробел" /></div>
    </div>
    <div class="field">
      <label>Напоминания до срока</label>
      <div class="offsets" id="fOffsets">
        ${OFFSET_PRESETS.map((minutes) => `<button data-offset="${minutes}" class="${v.remind_offsets.includes(minutes) ? 'on' : ''}">${offsetLabel(minutes)}</button>`).join('')}
        ${v.remind_offsets.filter((minutes) => !OFFSET_PRESETS.includes(minutes)).sort((a, b) => b - a).map((minutes) => `<button data-offset="${minutes}" class="on custom" title="Своё напоминание — нажми, чтобы убрать">${offsetLabel(minutes)} ×</button>`).join('')}
        <button data-offset="none" class="${v.remind_offsets.length === 0 ? 'on' : ''}">выключены</button>
      </div>
      <div class="custom-offset">
        <input type="range" class="slim" id="fOffsetSlider" min="0" max="${OFFSET_SLIDER.length - 1}" step="1" value="${OFFSET_SLIDER.indexOf(60)}" />
        <span id="fOffsetValue">за ${offsetLabel(60)}</span>
        <button class="ghost" id="fOffsetAdd" title="Добавить своё напоминание">+ Добавить</button>
      </div>
    </div>
    <div class="actions">
      ${isNew
        ? '<button class="primary" id="fSave">Создать</button><button class="ghost" id="fCancel">Отмена</button>'
        : `<button class="primary" id="fSave">Сохранить</button>
      <button class="ghost" id="fArchive">${task.status === 'archived' ? 'Вернуть' : 'В архив'}</button>
      <button class="danger" id="fDelete">Удалить</button>`}
    </div>
    ${isNew ? '' : `<p class="hint" style="margin:10px 0 0">${task.synced ? 'Синхронизировано с облаком' : 'Ждёт синхронизации'}</p>`}`;

  closePicker();
  attachPicker($('fDate'), 'date');
  attachPicker($('fTime'), 'time');
  attachSelect('fPriority', PRIORITY_CHOICES.map((index) => [String(index), PRIORITY_LABELS[index]]));
  attachSelect('fRecurrence', RECURRENCE_OPTIONS);
  // Любой ввод в карточке — в черновик, чтобы перерисовка его не потеряла.
  ['fTitle', 'fNotes', 'fDate', 'fTime', 'fPriority', 'fRecurrence', 'fProject', 'fTags'].forEach((id) => {
    $(id).addEventListener('input', () => captureDraft(task));
    $(id).addEventListener('change', () => captureDraft(task));
  });
  $('fOffsets').querySelectorAll('button').forEach((button) => {
    button.onclick = () => {
      captureDraft(task);
      const value = button.dataset.offset;
      const current = new Set(state.draft.remind_offsets);
      if (value === 'none') current.clear();
      else if (current.has(Number(value))) current.delete(Number(value));
      else current.add(Number(value));
      state.draft.remind_offsets = Array.from(current).sort((a, b) => b - a);
      renderEditor();
    };
  });
  $('fOffsetSlider').oninput = () => { $('fOffsetValue').textContent = `за ${offsetLabel(OFFSET_SLIDER[Number($('fOffsetSlider').value)])}`; };
  $('fOffsetAdd').onclick = () => {
    captureDraft(task);
    const minutes = OFFSET_SLIDER[Number($('fOffsetSlider').value)];
    const current = new Set(state.draft.remind_offsets);
    if (current.size >= 6 && !current.has(minutes)) { toast('Не больше шести напоминаний на задачу'); return; }
    current.add(minutes);
    state.draft.remind_offsets = Array.from(current).sort((a, b) => b - a);
    state.draft.sliderIndex = Number($('fOffsetSlider').value);
    renderEditor();
  };
  if (state.draft?.sliderIndex !== undefined) { $('fOffsetSlider').value = String(state.draft.sliderIndex); $('fOffsetSlider').oninput(); }
  $('fSave').onclick = () => applyEditor(task);
  $('fClose').onclick = () => { state.draft = null; state.pending = null; state.selectedId = null; render(); };
  if (isNew) {
    $('fCancel').onclick = $('fClose').onclick;
    $('fTitle').addEventListener('input', () => { clearTimeout(previewTimer); previewTimer = setTimeout(updatePreview, 180); });
    $('fTitle').addEventListener('keydown', (event) => { if (event.key === 'Enter') { event.preventDefault(); applyEditor(task); } });
    if (!state.draft) setTimeout(() => $('fTitle')?.focus(), 30);
    else if (state.draft.title) updatePreview();
    return;
  }
  $('fArchive').onclick = async () => {
    const next = state.tasks.map((item) => item.id === task.id
      ? { ...item, status: item.status === 'archived' ? 'open' : 'archived', updated_at: new Date().toISOString(), dirty: true }
      : item);
    state.draft = null;
    state.selectedId = null; // карточка закрывается, задача уходит в архив (кнопка ▤ сверху)
    await saveTasks(next, task.status === 'archived' ? 'Возвращено из архива' : 'Убрано в архив');
  };
  $('fDelete').onclick = () => confirmDelete(task.id);
}

function offsetLabel(minutes) {
  const m = Number(minutes);
  if (m >= 10080 && m % 10080 === 0) return `${m / 10080} нед`;
  if (m >= 1440 && m % 1440 === 0) return `${m / 1440} дн`;
  if (m >= 60) return m % 60 === 0 ? `${m / 60} ч` : `${Math.floor(m / 60)} ч ${m % 60} мин`;
  return `${m} мин`;
}

async function applyEditor(task) {
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const isNew = Boolean(state.pending && task.id === state.pending.id);
  const fields = readDateTimeFields();
  if (!fields) return;
  const { date, time } = fields;
  const previous = task;
  if (isNew) return createFromEditor(task, date, time);
  let dueAt = null;
  let allDay = false;
  if (date) {
    const [year, month, day] = date.split('-').map(Number);
    if (time) {
      const [hour, minute] = time.split(':').map(Number);
      dueAt = zonedToUtc(year, month, day, hour, minute, timeZone).toISOString();
    } else {
      dueAt = zonedToUtc(year, month, day, 12, 0, timeZone).toISOString();
      allDay = true;
    }
  }
  const updated = {
    ...previous,
    title: $('fTitle').value.trim() || previous.title,
    notes: $('fNotes').value,
    priority: Number($('fPriority').value),
    recurrence: $('fRecurrence').value || null,
    project: $('fProject').value.trim() || null,
    tags: $('fTags').value.split(/\s+/).map((tag) => tag.replace(/^\+/, '')).filter(Boolean).slice(0, 8),
    due_at: dueAt,
    all_day: allDay,
    remind_offsets: state.draft?.taskId === previous.id && state.draft.remind_offsets ? state.draft.remind_offsets : previous.remind_offsets,
    updated_at: new Date().toISOString(),
    dirty: true,
  };
  state.draft = null;
  state.selectedId = null; // после «Сохранить» карточка закрывается
  await saveTasks(state.tasks.map((item) => (item.id === previous.id ? updated : item)), 'Сохранено');
}

/** Дата и время из полей: текст → ISO-дата и ЧЧ:ММ. Непонятный ввод — подсветка и отказ. */
function readDateTimeFields() {
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  let date = parseDateText($('fDate').value);
  const time = parseTimeText($('fTime').value);
  if (date === null) { $('fDate').classList.add('bad'); toast('Не понял дату — нужно дд.мм.гггг, например 12.10'); $('fDate').focus(); return null; }
  if (time === null) { $('fTime').classList.add('bad'); toast('Не понял время — нужно чч:мм, например 18:30'); $('fTime').focus(); return null; }
  if (!date && time) date = todayLocal(timeZone); // время без даты — на сегодня
  return { date, time };
}

/** Создание из полной карточки: умная строка в названии дополняет пустые поля. */
async function createFromEditor(task, date, time) {
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const raw = $('fTitle').value.trim();
  if (!raw) { toast('Введите название'); $('fTitle').focus(); return; }
  const parsed = await bridge.preview(raw);
  bridge.log('новая задача', raw);
  const title = (parsed.title || raw).trim() || raw;
  let dueAt = null;
  let allDay = false;
  if (date) {
    const [year, month, day] = date.split('-').map(Number);
    if (time) {
      const [hour, minute] = time.split(':').map(Number);
      dueAt = zonedToUtc(year, month, day, hour, minute, timeZone).toISOString();
    } else {
      dueAt = zonedToUtc(year, month, day, 12, 0, timeZone).toISOString();
      allDay = true;
    }
  } else if (parsed.dueAt) {
    dueAt = parsed.dueAt;
    allDay = Boolean(parsed.allDay);
  }
  const formPriority = Number($('fPriority').value);
  const formProject = $('fProject').value.trim();
  const formTags = $('fTags').value.split(/\s+/).map((tag) => tag.replace(/^\+/, '')).filter(Boolean);
  const formRecurrence = $('fRecurrence').value || null;
  const draftOffsets = state.draft?.taskId === task.id && state.draft.remind_offsets ? state.draft.remind_offsets : null;
  const created = newTask(title, {
    notes: $('fNotes').value,
    priority: formPriority !== 1 ? formPriority : Number(parsed.priority ?? 1),
    project: formProject || parsed.project || null,
    tags: (formTags.length ? formTags : (parsed.tags || [])).slice(0, 8),
    recurrence: formRecurrence || parsed.recurrence || null,
    due_at: dueAt,
    all_day: allDay,
    remind_offsets: draftOffsets ?? (parsed.offsets === null || parsed.offsets === undefined ? [...DEFAULT_OFFSETS] : parsed.offsets),
  });
  state.draft = null;
  state.pending = null;
  state.selectedId = null;
  await saveTasks([...state.tasks, created], `Добавлено: ${created.title}`);
}

/** Снимок полей карточки в черновик (вызывается при каждом вводе). */
function captureDraft(task) {
  if (!$('fTitle')) return;
  const previous = state.draft?.taskId === task.id ? state.draft : null;
  state.draft = {
    taskId: task.id,
    title: $('fTitle').value,
    notes: $('fNotes').value,
    date: $('fDate').value, // как напечатано — разбирается при сохранении
    time: $('fTime').value,
    priority: Number($('fPriority').value),
    recurrence: $('fRecurrence').value,
    project: $('fProject').value,
    tags: $('fTags').value,
    remind_offsets: previous?.remind_offsets ?? (task.remind_offsets || []),
    sliderIndex: previous?.sliderIndex,
  };
}

/** Выбор задачи в списке: черновик другой задачи сбрасывается. */
function selectTask(taskId) {
  if (state.draft && state.draft.taskId !== taskId) state.draft = null;
  state.selectedId = taskId;
  render();
}

// --- Дата и время: текст в поле + всплывающий выбор, оба в обе стороны синхронны ---
const MONTH_YEAR = new Intl.DateTimeFormat('ru-RU', { month: 'long', year: 'numeric' });
function isoFromParts(year, month, day) {
  const y = Number(year); const m = Number(month); const d = Number(day);
  if (!y || m < 1 || m > 12 || d < 1 || d > 31) return null;
  const probe = new Date(Date.UTC(y, m - 1, d, 12));
  if (probe.getUTCMonth() !== m - 1 || probe.getUTCDate() !== d) return null;
  return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}
/** «12.10», «12.10.26», «12.10.2026», «1210», «2026-10-12» → ISO; пусто → ''; мусор → null. */
function parseDateText(text) {
  const t = String(text ?? '').trim();
  if (!t) return '';
  const year = dateAtNoon(todayLocal(state.settings.timezone || 'Europe/Moscow')).getUTCFullYear();
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(t);
  if (m) return isoFromParts(m[1], m[2], m[3]);
  m = /^(\d{1,2})[./\-\s](\d{1,2})(?:[./\-\s](\d{2}|\d{4}))?\.?$/.exec(t);
  if (m) return isoFromParts(m[3] ? (m[3].length === 2 ? 2000 + Number(m[3]) : m[3]) : year, m[2], m[1]);
  m = /^(\d{2})(\d{2})(\d{4}|\d{2})?$/.exec(t);
  if (m) return isoFromParts(m[3] ? (m[3].length === 2 ? 2000 + Number(m[3]) : m[3]) : year, m[2], m[1]);
  return null;
}
/** «18», «18:30», «1830», «18.30», «9:5» → ЧЧ:ММ; пусто → ''; мусор → null. */
function parseTimeText(text) {
  const t = String(text ?? '').trim();
  if (!t) return '';
  let m = /^(\d{1,2})(?:[:.\-\s](\d{1,2}))?$/.exec(t);
  if (!m) m = /^(\d{1,2})(\d{2})$/.exec(t);
  if (!m) return null;
  const h = Number(m[1]); const mm = Number(m[2] ?? 0);
  if (h > 23 || mm > 59) return null;
  return `${String(h).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
}
function displayDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}.${m}.${y}`;
}

let picker = null; // { kind: 'date'|'time', input, el, month: 'yyyy-mm' }
function attachPicker(input, kind) {
  if (!input) return;
  input.addEventListener('focus', () => openPicker(input, kind));
  input.addEventListener('click', () => openPicker(input, kind));
  input.addEventListener('input', () => { input.classList.remove('bad'); if (picker?.input === input) { if (kind === 'date') { const iso = parseDateText(input.value); if (iso) picker.month = iso.slice(0, 7); } renderPicker(); } });
  input.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') { event.preventDefault(); normalizeField(input, kind); closePicker(); }
    if (event.key === 'Escape') { if (picker) { event.stopPropagation(); closePicker(); } }
    if (event.key === 'Tab') { normalizeField(input, kind); closePicker(); }
  });
}
/** Привести напечатанное к виду дд.мм.гггг / чч:мм (если разобралось). */
function normalizeField(input, kind) {
  const parsed = kind === 'date' ? parseDateText(input.value) : parseTimeText(input.value);
  if (parsed === null) { input.classList.add('bad'); return; }
  input.classList.remove('bad');
  const pretty = kind === 'date' ? displayDate(parsed) : parsed;
  if (pretty !== input.value) { input.value = pretty; input.dispatchEvent(new Event('input', { bubbles: true })); }
}
function openPicker(input, kind) {
  if (picker && picker.input === input) return;
  closePicker();
  const el = document.createElement('div');
  el.className = 'picker';
  // mousedown внутри выбора не должен уводить фокус из поля (иначе выбор закроется до клика)
  el.addEventListener('mousedown', (event) => event.preventDefault());
  document.body.appendChild(el);
  const iso = kind === 'date' ? parseDateText(input.value) : null;
  picker = { kind, input, el, month: (iso || todayLocal(state.settings.timezone || 'Europe/Moscow')).slice(0, 7) };
  renderPicker();
}
function closePicker() {
  if (!picker) return;
  picker.anchor?.classList.remove('open');
  picker.el.remove();
  picker = null;
}
function placePicker() {
  const rect = picker.point
    ? { left: picker.point.x, right: picker.point.x, top: picker.point.y, bottom: picker.point.y }
    : (picker.anchor ?? picker.input).getBoundingClientRect();
  const el = picker.el;
  let top = rect.bottom + 4;
  if (top + el.offsetHeight > window.innerHeight - 8) top = Math.max(8, rect.top - el.offsetHeight - 4);
  let left = rect.left;
  if (left + el.offsetWidth > window.innerWidth - 8) left = Math.max(8, window.innerWidth - el.offsetWidth - 8);
  el.style.top = `${top}px`;
  el.style.left = `${left}px`;
}
function setPickerValue(text) {
  const input = picker.input;
  input.value = text;
  input.classList.remove('bad');
  input.dispatchEvent(new Event('input', { bubbles: true }));
  input.dispatchEvent(new Event('change', { bubbles: true }));
}
function renderPicker() {
  if (!picker) return;
  if (picker.kind !== 'date' && picker.kind !== 'time') { placePicker(); return; }
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const today = todayLocal(timeZone);
  const el = picker.el;
  if (picker.kind === 'date') {
    const selected = parseDateText(picker.input.value) || '';
    const [year, month] = picker.month.split('-').map(Number);
    const first = new Date(Date.UTC(year, month - 1, 1, 12));
    const lead = (first.getUTCDay() + 6) % 7; // пустых клеток до 1-го (неделя с пн)
    const cells = [];
    for (let i = 0; i < 42; i += 1) {
      const d = new Date(Date.UTC(year, month - 1, 1 - lead + i, 12));
      const iso = `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
      const other = d.getUTCMonth() !== month - 1;
      const we = d.getUTCDay() === 0 || d.getUTCDay() === 6;
      if (i >= 35 && other) break;
      let rangeClass = '';
      if (picker.range && selected) {
        const offset = Math.round((d - dateAtNoon(selected)) / 86400000);
        if (offset >= 0 && offset < picker.range) rangeClass = `range ${offset === 0 ? 'first' : ''} ${offset === picker.range - 1 ? 'last' : ''}`;
      }
      cells.push(`<button type="button" data-iso="${iso}" class="${other ? 'other' : ''} ${we ? 'we' : ''} ${iso === selected && !picker.range ? 'sel' : ''} ${rangeClass} ${iso === today ? 'now' : ''}">${d.getUTCDate()}</button>`);
    }
    el.innerHTML = `<div class="cal">
      <div class="cal-head"><button type="button" data-nav="-1">‹</button><b>${MONTH_YEAR.format(first).replace(' г.', '')}</b><button type="button" data-nav="1">›</button></div>
      <div class="cal-grid">${['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'].map((n, i) => `<span class="${i >= 5 ? 'we' : ''}">${n}</span>`).join('')}${cells.join('')}</div>
      <div class="cal-foot"><button type="button" data-iso="${today}">Сегодня</button><button type="button" data-iso="${addDaysLocal(timeZone, 1)}">Завтра</button>${picker.range ? '' : '<button type="button" data-iso="">Без даты</button>'}</div>
    </div>`;
    el.querySelectorAll('[data-nav]').forEach((b) => { b.onclick = () => { const d = new Date(Date.UTC(year, month - 1 + Number(b.dataset.nav), 1, 12)); picker.month = `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`; renderPicker(); }; });
    el.querySelectorAll('[data-iso]').forEach((b) => { b.onclick = () => { const onPick = picker.onPick; setPickerValue(displayDate(b.dataset.iso)); closePicker(); if (onPick && b.dataset.iso) onPick(b.dataset.iso); }; });
  } else {
    const current = parseTimeText(picker.input.value) || '';
    const [ch, cm] = current ? current.split(':').map(Number) : [null, null];
    const hours = Array.from({ length: 24 }, (_, h) => `<button type="button" data-h="${h}" class="${h === ch ? 'sel' : ''}">${String(h).padStart(2, '0')}</button>`);
    const minutes = Array.from({ length: 12 }, (_, i) => i * 5).map((m) => `<button type="button" data-m="${m}" class="${m === cm ? 'sel' : ''}">${String(m).padStart(2, '0')}</button>`);
    el.innerHTML = `<div class="tp"><div class="tp-col" data-col="h">${hours.join('')}</div><div class="tp-col" data-col="m">${minutes.join('')}</div></div>
      <div class="tp-foot"><button type="button" data-t="09:00">09:00</button><button type="button" data-t="12:00">12:00</button><button type="button" data-t="18:00">18:00</button><button type="button" data-t="">Весь день</button></div>`;
    el.querySelectorAll('[data-h]').forEach((b) => { b.onclick = () => { setPickerValue(`${String(b.dataset.h).padStart(2, '0')}:${String(cm ?? 0).padStart(2, '0')}`); renderPicker(); }; });
    el.querySelectorAll('[data-m]').forEach((b) => { b.onclick = () => { setPickerValue(`${String(ch ?? 12).padStart(2, '0')}:${String(b.dataset.m).padStart(2, '0')}`); closePicker(); }; });
    el.querySelectorAll('[data-t]').forEach((b) => { b.onclick = () => { setPickerValue(b.dataset.t); closePicker(); }; });
    el.querySelectorAll('.tp-col .sel').forEach((b) => b.scrollIntoView({ block: 'center' }));
  }
  placePicker();
}
document.addEventListener('mousedown', (event) => {
  if (picker && !picker.el.contains(event.target) && event.target !== picker.input && !(picker.anchor && picker.anchor.contains(event.target))) closePicker();
}, true);

// --- Выпадающий список в общем стиле: скрытое поле + кнопка + меню-пикер ---
function selectHtml(id, options, value) {
  const current = options.find(([v]) => String(v) === String(value ?? '')) ?? options[0];
  return `<input type="hidden" id="${id}" value="${escapeHtml(current[0])}" /><button type="button" class="select-btn" id="${id}Btn">${escapeHtml(current[1])}</button>`;
}
function attachSelect(id, options) {
  const hidden = $(id);
  const button = $(`${id}Btn`);
  if (!hidden || !button) return;
  button.onclick = () => {
    if (picker && picker.input === hidden) { closePicker(); return; }
    closePicker();
    const el = document.createElement('div');
    el.className = 'picker menu';
    el.addEventListener('mousedown', (event) => event.preventDefault());
    el.innerHTML = options.map(([v, label]) => `<button type="button" data-v="${escapeHtml(v)}" class="${String(v) === hidden.value ? 'sel' : ''}">${escapeHtml(label)}</button>`).join('');
    document.body.appendChild(el);
    picker = { kind: 'select', input: hidden, el, anchor: button };
    button.classList.add('open');
    el.querySelectorAll('[data-v]').forEach((item) => {
      item.onclick = () => {
        hidden.value = item.dataset.v;
        button.textContent = options.find(([v]) => String(v) === item.dataset.v)?.[1] ?? item.dataset.v;
        hidden.dispatchEvent(new Event('change', { bubbles: true }));
        closePicker();
      };
    });
    placePicker();
  };
}

// --- Контекстное меню карточки (правая кнопка) ---
function openCardMenu(event, taskId) {
  event.preventDefault();
  closePicker();
  const task = state.tasks.find((item) => item.id === taskId);
  if (!task) return;
  const el = document.createElement('div');
  el.className = 'picker menu';
  el.innerHTML = `
    <button type="button" data-act="open">Открыть</button>
    <button type="button" data-act="done">${task.status === 'done' ? 'Вернуть в работу' : 'Выполнено'}</button>
    <button type="button" data-act="move">Переместить…</button>
    <hr />
    <button type="button" data-act="archive">${task.status === 'archived' ? 'Вернуть из архива' : 'В архив'}</button>
    <button type="button" data-act="delete" class="danger-item">Удалить…</button>`;
  document.body.appendChild(el);
  picker = { kind: 'menu', input: null, el, point: { x: event.clientX, y: event.clientY } };
  placePicker();
  el.querySelectorAll('[data-act]').forEach((item) => {
    item.onclick = async () => {
      const act = item.dataset.act;
      closePicker();
      if (act === 'open') selectTask(taskId);
      else if (act === 'done') await toggleDone(taskId);
      else if (act === 'move') openMove(taskId);
      else if (act === 'archive') {
        const archived = task.status === 'archived';
        await saveTasks(state.tasks.map((t) => (t.id === taskId ? { ...t, status: archived ? 'open' : 'archived', updated_at: new Date().toISOString(), dirty: true } : t)), archived ? 'Возвращено из архива' : `В архиве: ${task.title}`);
        bridge.log(archived ? 'возвращено из архива' : 'убрано в архив', task.title);
      } else if (act === 'delete') confirmDelete(taskId);
    };
  });
}

/** Окно «Переместить»: дата и время — замена перетаскиванию. */
function openMove(taskId) {
  const task = state.tasks.find((item) => item.id === taskId);
  if (!task) return;
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const p = task.due_at ? parts(task.due_at, timeZone) : null;
  const date = p ? displayDate(`${p.year}-${String(p.month).padStart(2, '0')}-${String(p.day).padStart(2, '0')}`) : '';
  const time = p && !task.all_day ? `${String(p.hour).padStart(2, '0')}:${String(p.minute).padStart(2, '0')}` : '';
  $('moveBody').innerHTML = `
    <div class="editor-head"><h3>Переместить</h3><button class="icon-btn" id="moveClose" title="Отмена (Esc)">×</button></div>
    <p class="hint" style="margin:0 0 10px">«${escapeHtml(task.title)}»</p>
    <div class="row">
      <div class="field"><label>Дата</label><input id="mDate" value="${escapeHtml(date)}" placeholder="дд.мм.гггг" inputmode="numeric" autocomplete="off" /></div>
      <div class="field"><label>Время</label><input id="mTime" value="${escapeHtml(time)}" placeholder="чч:мм" inputmode="numeric" autocomplete="off" /></div>
    </div>
    <div class="actions"><button class="primary" id="moveOk">Переместить</button><button class="ghost" id="moveNone">Без срока</button><button class="ghost" id="moveCancel">Отмена</button></div>`;
  $('moveModal').classList.add('open');
  attachPicker($('mDate'), 'date');
  attachPicker($('mTime'), 'time');
  const close = () => { closePicker(); $('moveModal').classList.remove('open'); };
  $('moveClose').onclick = close;
  $('moveCancel').onclick = close;
  $('moveNone').onclick = async () => {
    close();
    if (!task.due_at) return;
    await saveTasks(state.tasks.map((t) => (t.id === taskId ? { ...t, due_at: null, all_day: false, updated_at: new Date().toISOString(), dirty: true } : t)), `«${task.title}» — без срока`);
    bridge.log('перемещение', `«${task.title}» → без срока`);
  };
  $('moveOk').onclick = async () => {
    let dateIso = parseDateText($('mDate').value);
    const timeText = parseTimeText($('mTime').value);
    if (dateIso === null) { $('mDate').classList.add('bad'); toast('Не понял дату — нужно дд.мм.гггг'); return; }
    if (timeText === null) { $('mTime').classList.add('bad'); toast('Не понял время — нужно чч:мм'); return; }
    if (!dateIso && timeText) dateIso = todayLocal(timeZone);
    if (!dateIso) { $('mDate').classList.add('bad'); toast('Выбери дату или нажми «Без срока»'); return; }
    const [year, month, day] = dateIso.split('-').map(Number);
    const [hour, minute] = timeText ? timeText.split(':').map(Number) : [12, 0];
    const patch = { due_at: zonedToUtc(year, month, day, hour, minute, timeZone).toISOString(), all_day: !timeText };
    close();
    await saveTasks(state.tasks.map((t) => (t.id === taskId ? { ...t, ...patch, updated_at: new Date().toISOString(), dirty: true } : t)), `«${task.title}» — ${dueDayLabelFor(dateIso)}${timeText ? ` ${timeText}` : ''}`);
    bridge.log('перемещение', `«${task.title}» → ${dateIso}${timeText ? ` ${timeText}` : ''}`);
  };
  ['mDate', 'mTime'].forEach((id) => $(id).addEventListener('keydown', (event) => { if (event.key === 'Enter' && !picker) $('moveOk').click(); }));
  setTimeout(() => $('mDate').focus(), 30);
}

// --- Добавление задачи: сразу полная карточка ---
let previewTimer = null;
async function updatePreview() {
  const input = $('fTitle');
  const box = $('quickPreview');
  if (!input || !box) return;
  const text = input.value.trim();
  if (!text) { box.textContent = ''; return; }
  const parsed = await bridge.preview(text);
  const bits = [];
  if (parsed.title && parsed.title !== text) bits.push(`«${parsed.title}»`);
  if (parsed.dueLabel) bits.push(parsed.dueLabel);
  if (Number(parsed.priority) > 1) bits.push(`!${parsed.priority}`);
  if (parsed.project) bits.push(`#${parsed.project}`);
  if (parsed.offsets && parsed.offsets.length) bits.push(`🔔 ${parsed.offsets.map(offsetLabel).join(', ')}`);
  else if (parsed.offsets && parsed.offsets.length === 0) bits.push('🔕');
  if (parsed.recurrence) bits.push('🔁');
  if (box.isConnected) box.textContent = bits.join(' · ');
}

      <div class="actions"><button class="ghost" id="sSaveCloud">Сохранить параметры облака</button></div>
      ${cloud.signedIn ? `
        <div class="field" style="margin-top:12px"><label>Код привязки Telegram</label><input id="sTgCode" placeholder="10 символов из бота" /></div>
        <div class="actions"><button class="ghost" id="sTgLink">Привязать Telegram</button></div>
        <p class="hint">Отправь боту /start, получи код и введи его здесь.</p>` : ''}
    </div>

    <div class="section">
      <h4>Оформление</h4>
      <div class="field"><label>Тема</label><select id="sTheme">
        <option value="dark" ${settings.theme !== 'light' ? 'selected' : ''}>Тёмная</option>
        <option value="light" ${settings.theme === 'light' ? 'selected' : ''}>Светлая</option>
      </select></div>
      <div class="field"><label>Фон</label>
        <div class="wall-options">
          <button class="plain ${settings.wallpaper === 'none' || !settings.wallpaper ? 'on' : ''}" data-wall="none"><span>Без картинки</span></button>
          <button class="${settings.wallpaper === 'forest' ? 'on' : ''}" data-wall="forest" ${wallpapers?.forest ? `style="background-image:url('${wallpapers.forest}')"` : ''}><span>Лес в тумане</span></button>
          <button class="${settings.wallpaper === 'custom' ? 'on' : ''}" data-wall="custom" ${wallpapers?.custom ? `style="background-image:url('${wallpapers.custom}')"` : ''}><span>${settings.wallpaperFile ? 'Своя картинка' : 'Выбрать свою…'}</span></button>
        </div>
      </div>
      ${settings.wallpaperFile ? '<p class="hint">Чтобы заменить свою картинку, нажми «Своя картинка» ещё раз.</p>' : '<p class="hint">Своя картинка копируется в папку данных приложения (jpg, png, webp).</p>'}
      <div class="field"><label>Прозрачность дней и карточек: <span id="sOpacityValue">${Number(settings.panelOpacity) || 10}%</span></label>
        <input type="range" class="slim" id="sOpacity" min="5" max="60" step="5" value="${Number(settings.panelOpacity) || 10}" /></div>
      <div class="field"><label>Высота карточек: <span id="sScaleValue">${Number(settings.cardScale) || 100}%</span></label>
        <input type="range" class="slim" id="sScale" min="25" max="160" step="5" value="${Number(settings.cardScale) || 100}" /></div>
    </div>

    <div class="section">
      <h4>Журнал действий</h4>
      <p class="hint">Приложение записывает действия с точным временем в текстовые файлы (один файл на день, хранятся 30 дней). Файлы лежат только на этом компьютере.</p>
      <div class="actions"><button class="ghost" id="sLogShow">Показать журнал</button><button class="ghost" id="sLogFile">Открыть файл</button><button class="ghost" id="sLogFolder">Папка</button></div>
    </div>

    <div class="section">
      <h4>Приложение</h4>
      <div class="switch"><span>Запускать с Windows</span><input type="checkbox" id="sStartup" ${state.startup ? 'checked' : ''} /></div>
      <div class="actions"><button class="ghost" id="sCheckUpdates">Проверить обновления</button>${state.update.status === 'ready' ? '<button class="primary" id="sInstall">Перезапустить и обновить</button>' : ''}</div>
      <p class="hint">${escapeHtml(updateLabel(state.update))}</p>
      <p class="hint">Кнопка «×» закрывает окно в трей: напоминания продолжают работать.</p>
    </div>
    <div class="actions"><button class="ghost" id="sClose">Закрыть</button></div>`;

  const saveSettings = async (patch, message) => {
    state.settings = await bridge.saveSettings(patch);
    if (message) toast(message);
    render();
  };
  $('sTimezone').onchange = () => saveSettings({ timezone: $('sTimezone').value }, 'Часовой пояс сохранён');
  $('sTheme').onchange = async () => { await saveSettings({ theme: $('sTheme').value }); await applyAppearance(); };
  $('sOpacity').oninput = () => { $('sOpacityValue').textContent = `${$('sOpacity').value}%`; document.documentElement.style.setProperty('--panel-alpha', String(Number($('sOpacity').value) / 100)); };
  $('sOpacity').onchange = async () => { await saveSettings({ panelOpacity: Number($('sOpacity').value) }); await applyAppearance(); };
  $('sScale').oninput = () => { $('sScaleValue').textContent = `${$('sScale').value}%`; setCardScale($('sScale').value); };
  $('sScale').onchange = async () => { await saveSettings({ cardScale: Number($('sScale').value) }); await applyAppearance(); };
  $('drawer').querySelectorAll('[data-wall]').forEach((button) => {
    button.onclick = async () => {
      const choice = button.dataset.wall;
      if (choice === 'custom') {
        // Повторный клик по уже выбранной своей картинке — предлагаем заменить; иначе просто включаем.
        if (state.settings.wallpaper === 'custom' || !state.settings.wallpaperFile) {
          const result = await bridge.chooseWallpaper();
          if (!result?.ok) { if (result?.reason && result.reason !== 'cancelled') toast(`Не удалось: ${result.reason}`); return; }
          await loadWallpapers(true);
          state.settings = result.settings || { ...state.settings, wallpaper: 'custom' };
          toast('Фон обновлён');
        } else {
          await saveSettings({ wallpaper: 'custom' });
        }
      } else {
        await saveSettings({ wallpaper: choice });
      }
      await applyAppearance();
      renderSettings();
    };
  });
  $('sDigest').onchange = () => saveSettings({ digestEnabled: $('sDigest').checked });
  $('sDigestAt').onchange = () => saveSettings({ digestAt: $('sDigestAt').value || '09:00' }, 'Время дайджеста сохранено');
  $('sNotifications').onchange = () => saveSettings({ notifications: $('sNotifications').value });
  $('sStartup').onchange = async () => {
    const result = await bridge.setStartup($('sStartup').checked);
    state.startup = Boolean(result?.enabled);
    toast(state.startup ? 'Автозапуск включён' : 'Автозапуск выключен');
  };
  $('sSaveCloud').onclick = () => saveSettings({ supabaseUrl: $('sUrl').value.trim(), supabaseKey: $('sKey').value.trim() }, 'Параметры облака сохранены');
  $('sSync')?.addEventListener('click', async () => { const result = await bridge.syncNow(); toast(result?.ok ? 'Синхронизировано' : `Не удалось: ${result?.reason ?? result?.error ?? 'ошибка'}`); render(); });
  // Перед входом/регистрацией подхватываем URL и ключ из полей, даже если «Сохранить параметры облака» не нажимали.
  const ensureCloudSaved = async () => {
    const url = $('sUrl').value.trim();
    const key = $('sKey').value.trim();
    if (!url || !key) throw new Error('заполни Supabase URL и Publishable key ниже');
    if (url !== (state.settings.supabaseUrl || '') || key !== (state.settings.supabaseKey || '')) {
      state.settings = await bridge.saveSettings({ supabaseUrl: url, supabaseKey: key });
    }
  };
  $('sSignIn')?.addEventListener('click', async () => {
    try {
      await ensureCloudSaved();
      state.cloud = await bridge.signIn($('sEmail').value, $('sPassword').value);
      toast('Вход выполнен');
      render();
    } catch (error) { toast(`Не удалось войти: ${error.message}`); }
  });
  $('sSignUp')?.addEventListener('click', async () => {
    try {
      await ensureCloudSaved();
      const result = await bridge.signUp($('sEmail').value, $('sPassword').value);
      toast(result.needsConfirmation ? 'Аккаунт создан: подтвердите e-mail письмом' : 'Аккаунт создан');
      state.cloud = result.state || state.cloud;
      render();
    } catch (error) { toast(`Не удалось зарегистрироваться: ${error.message}`); }
  });
  $('sSignOut')?.addEventListener('click', async () => { state.cloud = await bridge.signOut(); toast('Вы вышли из аккаунта'); render(); });
  $('sTgLink')?.addEventListener('click', async () => {
    try {
      const result = await bridge.linkTelegram($('sTgCode').value);
      state.cloud = result.state || state.cloud;
      toast('Telegram привязан');
      render();
    } catch (error) { toast(error.message); }
  });
  $('sCheckUpdates')?.addEventListener('click', async () => { await bridge.checkUpdates(); render(); });
  $('sInstall')?.addEventListener('click', () => bridge.installUpdate());
  $('openData')?.addEventListener('click', () => bridge.openDataFolder());
  $('sClose').onclick = closeDrawer;
  $('sLogShow').onclick = showLog;
  $('sLogFile').onclick = () => bridge.openLogFile();
  $('sLogFolder').onclick = () => bridge.openLogFolder();
}

// --- Просмотр журнала в приложении ---
async function showLog() {
  const data = await bridge.logTail(400);
  const lines = (data?.lines ?? []).slice().reverse(); // свежие сверху
  const html = lines.map((line) => {
    const [time = '', event = '', ...rest] = line.split('\t');
    return `<div><span class="t">${escapeHtml(time)}</span>  <span class="e">${escapeHtml(event)}</span>  ${escapeHtml(rest.join(' '))}</div>`;
  }).join('') || '<span class="hint">Пока пусто.</span>';
  $('logBody').innerHTML = `
    <div class="editor-head">
      <h3>Журнал действий <span class="hint">· ${lines.length} записей, свежие сверху</span></h3>
      <button class="icon-btn" id="logClose" title="Закрыть (Esc)">×</button>
    </div>
    <div class="log-view">${html}</div>
    <p class="hint" style="margin:10px 0 0">Файл: ${escapeHtml(data?.file ?? '')}</p>`;
  $('logModal').classList.add('open');
  $('logClose').onclick = closeLog;
}
function closeLog() { $('logModal').classList.remove('open'); }

function updateLabel(update) {
  const map = {
    idle: 'Обновления проверяются при запуске приложения.',
    dev: 'Проверка обновлений доступна только в установленной версии.',
    checking: 'Проверяем обновления…',
    available: `Найдена версия ${update.version}. Скачиваем.`,
    downloading: `Скачивание: ${update.percent ?? 0}%`,
    ready: `Версия ${update.version} скачана. Обновление пройдёт без окон: приложение закроется и само откроется через несколько секунд.`,
    current: 'Установлена последняя версия.',
    error: `Ошибка обновления: ${update.error || 'неизвестно'}`,
  };
  return map[update.status] ?? '';
}

async function openDrawer() {
  await loadWallpapers();
  renderSettings();
  $('drawer').style.display = 'block';
  $('overlay').classList.add('open');
}
function closeDrawer() {
  $('drawer').style.display = 'none';
  $('overlay').classList.remove('open');
}


// --- Общий рендер и события ---
function render() {
  renderBoard();
  renderEditor();
  if ($('drawer').style.display === 'block') renderSettings();
  if ($('archiveModal').classList.contains('open')) renderArchive();

  const cloud = state.cloud || {};
  $('cloudDot').className = `dot ${!cloud.configured ? '' : cloud.signedIn ? (cloud.error ? 'warn' : 'ok') : 'warn'}`;
  $('cloudText').textContent = !cloud.configured
    ? 'локально'
    : cloud.signedIn
      ? (state.cloud.lastSyncAt ? 'синхронизировано' : 'в облаке')
      : 'нет входа';
  $('status').title = cloud.signedIn ? `${cloud.email} · нажми, чтобы синхронизировать` : 'Аккаунт настраивается в ⚙ Настройках';
  $('showDone').classList.toggle('on', state.showDone);
}

$('quickAdd').onclick = () => openAdd();
$('archiveButton').onclick = openArchive;
$('weekPrev').onclick = () => shiftDays(-7);
$('weekNext').onclick = () => shiftDays(7);
$('weekLabel').onclick = openRangeCalendar;
$('archiveModal').addEventListener('mousedown', (event) => { if (event.target === $('archiveModal')) closeArchive(); });
$('confirmModal').addEventListener('mousedown', (event) => { if (event.target === $('confirmModal')) $('confirmModal').classList.remove('open'); });
$('moveModal').addEventListener('mousedown', (event) => { if (event.target === $('moveModal')) { closePicker(); $('moveModal').classList.remove('open'); } });
$('search').addEventListener('input', () => { state.search = $('search').value; render(); });
$('showDone').onclick = () => { state.showDone = !state.showDone; render(); };
$('settingsButton').onclick = openDrawer;
$('status').onclick = async () => {
  const result = await bridge.syncNow();
  toast(result?.ok ? `Синхронизировано: ${result.pushed} отправлено, ${result.pulled} получено` : `Синхронизация не выполнена: ${result?.reason ?? result?.error ?? 'нет входа в аккаунт'}`);
};
$('overlay').onclick = closeDrawer;
$('modal').addEventListener('mousedown', (event) => {
  // Клик по затемнению вокруг окна — закрыть без сохранения.
  if (event.target === $('modal')) { state.draft = null; state.pending = null; state.selectedId = null; render(); }
});
$('logModal').addEventListener('mousedown', (event) => { if (event.target === $('logModal')) closeLog(); });
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') {
    if ($('logModal').classList.contains('open')) { closeLog(); return; }
    if (picker) { closePicker(); return; }
    if ($('confirmModal').classList.contains('open')) { $('confirmModal').classList.remove('open'); return; }
    if ($('moveModal').classList.contains('open')) { $('moveModal').classList.remove('open'); return; }
    if ($('archiveModal').classList.contains('open')) { closeArchive(); return; }
    if ($('modal').classList.contains('open')) { state.draft = null; state.pending = null; state.selectedId = null; render(); return; }
    closeDrawer();
  }
  if (event.key === 'n' && event.ctrlKey) { event.preventDefault(); openAdd(); }
});

setInterval(() => { if (!dragId) layoutTimelines(); }, 60_000);
let resizeTimer = null;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(renderBoard, 120); });
bridge.onTasksChanged((tasks) => { state.tasks = tasks || []; render(); });
bridge.onCloudStatus((cloud) => { state.cloud = { ...state.cloud, ...cloud }; render(); });
bridge.onUpdateStatus((update) => { state.update = update; render(); });
bridge.onFocusTask((taskId) => { selectTask(taskId); });

bootstrap();
</script>
</body>
</html>

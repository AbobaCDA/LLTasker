<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:;" />
<title>Forge Tasks</title>
<style>
  :root {
    --bg: #12151c;
    --panel: #181c26;
    --panel-2: #1e2431;
    --line: #2a3242;
    --text: #e8ecf4;
    --muted: #8d99ae;
    --accent: #4f8cff;
    --accent-soft: #22314f;
    --ok: #3ecf8e;
    --warn: #f2b544;
    --danger: #f2545b;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .app { display: grid; grid-template-columns: 232px 1fr; height: 100vh; }

  /* --- Боковая панель --- */
  .sidebar { background: var(--panel); border-right: 1px solid var(--line); padding: 14px 12px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: .2px; }
  .brand .logo { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, #4f8cff, #8b5cf6); display: grid; place-items: center; font-size: 15px; }
  .nav { display: flex; flex-direction: column; gap: 3px; }
  .nav button {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    background: transparent; border: 0; border-radius: 8px; padding: 7px 10px; color: var(--muted); text-align: left;
  }
  .nav button:hover { background: var(--panel-2); color: var(--text); }
  .nav button.active { background: var(--accent-soft); color: var(--text); font-weight: 600; }
  .nav .count { font-size: 12px; background: var(--panel-2); border-radius: 20px; padding: 1px 7px; }
  .nav button.active .count { background: rgba(79, 140, 255, .25); }
  .side-title { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 4px 0 -6px 4px; }
  .projects { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); border-radius: 20px; padding: 3px 10px; font-size: 12px; }
  .chip.active { border-color: var(--accent); color: var(--text); background: var(--accent-soft); }
  .sidebar-footer { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
  .ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 7px 10px; }
  .ghost:hover { color: var(--text); border-color: var(--accent); }

  /* --- Основная область --- */
  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .quick { flex: 1; display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px; }
  .quick input { flex: 1; background: transparent; border: 0; outline: none; }
  .quick .preview { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .primary { background: var(--accent); border: 0; color: #fff; border-radius: 9px; padding: 8px 14px; font-weight: 600; }
  .primary:hover { filter: brightness(1.08); }
  .status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.err { background: var(--danger); }

  .toolbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; color: var(--muted); font-size: 12px; }
  .toolbar input[type=search] { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; width: 220px; outline: none; }

  .content { display: grid; grid-template-columns: 1fr 340px; gap: 0; flex: 1; min-height: 0; }
  .list { overflow-y: auto; padding: 4px 16px 20px; }
  .day-group { margin: 14px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .task {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: var(--radius);
    border: 1px solid transparent; margin-bottom: 6px; background: var(--panel);
  }
  .task:hover { border-color: var(--line); }
  .task.selected { border-color: var(--accent); background: var(--panel-2); }
  .task .check { width: 18px; height: 18px; margin-top: 2px; border-radius: 50%; border: 1.5px solid var(--line); background: transparent; flex: none; }
  .task .check:hover { border-color: var(--ok); }
  .task .check.done { background: var(--ok); border-color: var(--ok); color: #0c2a1d; font-size: 12px; line-height: 1; }
  .task .body { flex: 1; min-width: 0; }
  .task .title { font-weight: 500; overflow-wrap: anywhere; }
  .task.done .title, .task.archived .title { color: var(--muted); text-decoration: line-through; }
  .task .meta { display: flex; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: 12px; margin-top: 3px; }
  .task .meta .late { color: var(--danger); }
  .task .prio { width: 4px; border-radius: 3px; align-self: stretch; background: var(--line); flex: none; }
  .prio-0 { background: #4a5568; } .prio-1 { background: #3b82f6; } .prio-2 { background: #f59e0b; } .prio-3 { background: #ef4444; }
  .empty { color: var(--muted); padding: 30px 12px; text-align: center; line-height: 1.7; }

  /* --- Панель задачи --- */
  .editor { border-left: 1px solid var(--line); background: var(--panel); padding: 14px; overflow-y: auto; }
  .editor h3 { margin: 0 0 12px; font-size: 15px; }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .field label { font-size: 12px; color: var(--muted); }
  .field input, .field select, .field textarea {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; outline: none; width: 100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 64px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .offsets { display: flex; flex-wrap: wrap; gap: 6px; }
  .offsets button { border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); border-radius: 20px; padding: 4px 10px; font-size: 12px; }
  .offsets button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  .actions button { flex: 1; border-radius: 9px; padding: 9px 12px; }
  .danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
  .danger:hover { background: rgba(242, 84, 91, .12); }
  .hint { color: var(--muted); font-size: 12px; line-height: 1.5; }

  /* --- Настройки --- */
  .overlay { position: fixed; inset: 0; background: rgba(6, 8, 12, .6); display: none; }
  .overlay.open { display: block; }
  .drawer { position: fixed; top: 0; right: 0; height: 100vh; width: 400px; background: var(--panel); border-left: 1px solid var(--line); padding: 16px; overflow-y: auto; }
  .drawer h3 { margin: 0 0 4px; }
  .section { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 14px; }
  .section h4 { margin: 0 0 10px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 70vw; }
  .toast.show { opacity: 1; }
  .badge { font-size: 11px; border-radius: 6px; padding: 1px 6px; background: var(--panel-2); color: var(--muted); }
  .badge.ok { color: var(--ok); } .badge.err { color: var(--danger); } .badge.warn { color: var(--warn); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">✦</span> Forge Tasks <span class="badge" id="version"></span></div>
    <nav class="nav" id="filters"></nav>
    <div class="side-title">Проекты</div>
    <div class="projects" id="projects"><span class="hint">Пока нет проектов</span></div>
    <div class="sidebar-footer">
      <button class="ghost" id="syncButton">Синхронизировать</button>
      <button class="ghost" id="settingsButton">Настройки и аккаунт</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="quick">
        <input id="quickInput" placeholder="купить фильтр завтра 19:00 !2 #дом — просто напиши задачу" />
        <span class="preview" id="quickPreview"></span>
      </div>
      <button class="primary" id="quickAdd">Добавить</button>
      <div class="status"><span class="dot" id="cloudDot"></span><span id="cloudText">Локальный режим</span></div>
    </div>

    <div class="toolbar">
      <input type="search" id="search" placeholder="Поиск по задачам" />
      <label class="hint"><input type="checkbox" id="showDone" /> показывать выполненные</label>
      <span class="hint" id="stats"></span>
    </div>

    <div class="content">
      <div class="list" id="list"></div>
      <div class="editor" id="editor"><p class="hint">Выбери задачу слева или добавь новую строкой сверху.<br /><br />Подсказки ввода:<br />• завтра 19:00<br />• в пятницу в 10<br />• через 3 дня<br />• !2 — приоритет<br />• #дом — проект, +срочно — тег<br />• за день за час — напоминания<br />• каждый день / по будням</p></div>
    </div>
  </main>
</div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer" style="display:none"></div>
<div class="toast" id="toast"></div>

<script>
// Без Electron (например, при простом открытии файла) интерфейс работает в демо-режиме:
// так видно вёрстку и поведение без сборки приложения.
const DEMO = !window.forge;
function demoTasks() {
  const utc = (days, hour, minute) => {
    const base = new Date();
    const shifted = new Date(Date.UTC(base.getUTCFullYear(), base.getUTCMonth(), base.getUTCDate() + days, hour, minute));
    return shifted.toISOString();
  };
  const make = (id, title, extra) => ({
    id, title, notes: '', priority: 1, project: null, tags: [], all_day: false,
    remind_offsets: [1440, 60, 10], status: 'open', completed_at: null, recurrence: null,
    created_at: utc(0, 8, 0), updated_at: utc(0, 8, 0), synced: true, dirty: false, ...extra,
  });
  return [
    make('demo-1', 'Оплатить хостинг', { due_at: utc(0, 15, 30), priority: 2, project: 'работа' }),
    make('demo-2', 'Сдать отчёт за квартал', { due_at: utc(1, 9, 0), priority: 3, project: 'работа', recurrence: 'weekly' }),
    make('demo-3', 'Позвонить в банк', { due_at: utc(-1, 11, 0), priority: 2, remind_offsets: [60, 10] }),
    make('demo-4', 'Тренировка', { due_at: utc(1, 4, 30), recurrence: 'weekdays', project: 'здоровье' }),
    make('demo-5', 'Купить фильтр для воды', { project: 'дом', tags: ['быт'], remind_offsets: [] }),
    make('demo-6', 'Разобрать входящие письма', { status: 'done', completed_at: utc(-1, 19, 0) }),
  ];
}
const demoBridge = {
  load: async () => ({
    tasks: demoTasks(),
    settings: { timezone: 'Europe/Moscow', digestEnabled: true, digestAt: '09:00', notifications: 'both', supabaseUrl: '', supabaseKey: '' },
    cloud: { configured: false, signedIn: false, error: '' },
    update: { status: 'dev' },
    startup: false,
  }),
  info: async () => ({ version: 'демо', packaged: false, platform: 'browser', dataFolder: '' }),
  save: async (tasks) => ({ saved: tasks.length, sync: { ok: false, reason: 'demo' } }),
  remove: async () => ({ ok: true }),
  preview: async (text) => ({ title: String(text).trim(), dueAt: null, allDay: false, priority: 1, project: null, tags: [], recurrence: null, offsets: null, dueLabel: '' }),
  saveSettings: async (patch) => ({ ...state.settings, ...patch }),
  cloudState: async () => ({}),
  signIn: async () => ({}),
  signUp: async () => ({ needsConfirmation: false, state: {} }),
  signOut: async () => ({}),
  syncNow: async () => ({ ok: false, reason: 'demo' }),
  linkTelegram: async () => ({ state: {} }),
  setStartup: async () => ({ enabled: false }),
  checkUpdates: async () => ({ status: 'dev' }),
  installUpdate: () => {},
  openDataFolder: async () => {},
  hideWindow: async () => {},
  onTasksChanged: () => {},
  onCloudStatus: () => {},
  onUpdateStatus: () => {},
  onFocusTask: () => {},
};
const bridge = window.forge ?? demoBridge;

const state = {
  tasks: [],
  settings: {},
  cloud: {},
  startup: false,
  update: {},
  info: {},
  filter: 'today',
  project: null,
  search: '',
  selectedId: null,
  showDone: false,
};

const PRIORITY_LABELS = ['Обычная', 'Низкий', 'Средний', 'Высокий'];
const OFFSET_PRESETS = [10080, 1440, 720, 180, 60, 30, 10, 5];
const RECURRENCE_OPTIONS = [['', 'Без повтора'], ['daily', 'Каждый день'], ['weekdays', 'По будням'], ['weekly', 'Каждую неделю'], ['monthly', 'Каждый месяц']];
const $ = (id) => document.getElementById(id);

function toast(message) {
  const element = $('toast');
  element.textContent = message;
  element.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => element.classList.remove('show'), 2600);
}

// --- Работа с датами в интерфейсе (часовой пояс из настроек) ---
function parts(iso, timeZone) {
  const formatter = new Intl.DateTimeFormat('en-CA', { timeZone, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false, hourCycle: 'h23' });
  const list = formatter.formatToParts(new Date(iso));
  const value = (type) => Number(list.find((part) => part.type === type)?.value ?? 0);
  return { year: value('year'), month: value('month'), day: value('day'), hour: value('hour') % 24, minute: value('minute') };
}
function localDate(iso, timeZone) {
  const p = parts(iso, timeZone);
  return `${p.year}-${String(p.month).padStart(2, '0')}-${String(p.day).padStart(2, '0')}`;
}
function todayLocal(timeZone) {
  return localDate(new Date().toISOString(), timeZone);
}
function addDaysLocal(timeZone, days) {
  const p = parts(new Date().toISOString(), timeZone);
  const shifted = new Date(Date.UTC(p.year, p.month - 1, p.day + days, 12, 0));
  return `${shifted.getUTCFullYear()}-${String(shifted.getUTCMonth() + 1).padStart(2, '0')}-${String(shifted.getUTCDate()).padStart(2, '0')}`;
}
function dueLabel(task) {
  if (!task.due_at) return '';
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const p = parts(task.due_at, timeZone);
  const time = `${String(p.hour).padStart(2, '0')}:${String(p.minute).padStart(2, '0')}`;
  return task.all_day ? '' : time;
}
function dueDayLabel(task) {
  if (!task.due_at) return 'без срока';
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const target = localDate(task.due_at, timeZone);
  const today = todayLocal(timeZone);
  const time = dueLabel(task);
  const suffix = time ? ` ${time}` : '';
  if (target === today) return `сегодня${suffix}`;
  if (target === addDaysLocal(timeZone, 1)) return `завтра${suffix}`;
  const p = parts(task.due_at, timeZone);
  return `${String(p.day).padStart(2, '0')}.${String(p.month).padStart(2, '0')}${suffix}`;
}
// Локальные дата и время → момент UTC в выбранном поясе (та же логика, что в общем модуле).
function zonedToUtc(year, month, day, hour, minute, timeZone) {
  const guess = new Date(Date.UTC(year, month - 1, day, hour, minute));
  const offsetOf = (date) => {
    const p = parts(date.toISOString(), timeZone);
    return Math.round((Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute) - date.getTime()) / 60_000);
  };
  const offset = offsetOf(guess);
  const first = new Date(guess.getTime() - offset * 60_000);
  const second = offsetOf(first);
  return second === offset ? first : new Date(guess.getTime() - second * 60_000);
}

function isLate(task) {
  return task.status === 'open' && task.due_at && localDate(task.due_at, state.settings.timezone || 'Europe/Moscow') < todayLocal(state.settings.timezone || 'Europe/Moscow');
}

// --- Загрузка и сохранение ---
async function bootstrap() {
  const payload = await bridge.load();
  state.tasks = payload.tasks || [];
  state.settings = payload.settings || {};
  state.cloud = payload.cloud || {};
  state.startup = Boolean(payload.startup);
  state.update = payload.update || {};
  state.info = await bridge.info();
  $('version').textContent = state.info.version || '';
  render();
}

async function saveTasks(tasks, message) {
  state.tasks = tasks;
  render();
  const result = await bridge.save(tasks);
  if (message) toast(message);
  if (result?.sync && result.sync.ok === false && state.cloud.signedIn && result.sync.error) toast(`Синхронизация: ${result.sync.error}`);
}

function newTask(title, extra = {}) {
  return {
    id: (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)),
    title,
    notes: '',
    priority: 1,
    project: null,
    tags: [],
    due_at: null,
    all_day: false,
    remind_offsets: [1440, 60, 10],
    status: 'open',
    completed_at: null,
    recurrence: null,
    sort_order: state.tasks.length,
    created_at: new Date().toISOString(),
    updated_at: new Date().toISOString(),
    dirty: true,
    synced: false,
    ...extra,
  };
}

// --- Фильтрация и список ---
function visibleTasks() {
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const today = todayLocal(timeZone);
  const weekEnd = addDaysLocal(timeZone, 7);
  const query = state.search.trim().toLowerCase();
  return state.tasks
    .filter((task) => {
      if (task.status === 'archived') return false;
      if (task.status === 'done' && !state.showDone && state.filter !== 'done') return false;
      if (state.project && task.project !== state.project) return false;
      if (query && !`${task.title} ${task.notes} ${task.project ?? ''} ${(task.tags || []).join(' ')}`.toLowerCase().includes(query)) return false;
      const due = task.due_at ? localDate(task.due_at, timeZone) : null;
      if (state.filter === 'today') return !due || due <= today;
      if (state.filter === 'overdue') return due !== null && due < today && task.status === 'open';
      if (state.filter === 'week') return due !== null && due <= weekEnd;
      if (state.filter === 'done') return task.status === 'done';
      if (state.filter === 'open') return task.status === 'open';
      return true;
    })
    .sort((left, right) => {
      if (left.status !== right.status) return left.status === 'open' ? -1 : 1;
      const leftDue = left.due_at ? Date.parse(left.due_at) : Number.MAX_SAFE_INTEGER;
      const rightDue = right.due_at ? Date.parse(right.due_at) : Number.MAX_SAFE_INTEGER;
      if (leftDue !== rightDue) return leftDue - rightDue;
      return Number(right.priority) - Number(left.priority);
    });
}

function renderFilters() {
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const today = todayLocal(timeZone);
  const counts = {
    today: state.tasks.filter((task) => task.status === 'open' && (!task.due_at || localDate(task.due_at, timeZone) <= today)).length,
    week: state.tasks.filter((task) => task.status === 'open' && task.due_at && localDate(task.due_at, timeZone) <= addDaysLocal(timeZone, 7)).length,
    open: state.tasks.filter((task) => task.status === 'open').length,
    overdue: state.tasks.filter((task) => isLate(task)).length,
    done: state.tasks.filter((task) => task.status === 'done').length,
    all: state.tasks.length,
  };
  const items = [['today', 'Сегодня'], ['week', 'Неделя'], ['open', 'Все открытые'], ['overdue', 'Просроченные'], ['done', 'Выполненные'], ['all', 'Все']];
  $('filters').innerHTML = items.map(([key, label]) =>
    `<button data-filter="${key}" class="${state.filter === key ? 'active' : ''}">${label}<span class="count">${counts[key] ?? 0}</span></button>`).join('');
  $('filters').querySelectorAll('button').forEach((button) => {
    button.onclick = () => { state.filter = button.dataset.filter; render(); };
  });

  const projects = Array.from(new Set(state.tasks.map((task) => task.project).filter(Boolean))).sort();
  $('projects').innerHTML = projects.length
    ? `<button class="chip ${!state.project ? 'active' : ''}" data-project="">все</button>` +
      projects.map((name) => `<button class="chip ${state.project === name ? 'active' : ''}" data-project="${escapeHtml(name)}">#${escapeHtml(name)}</button>`).join('')
    : '<span class="hint">Пока нет проектов</span>';
  $('projects').querySelectorAll('button').forEach((button) => {
    button.onclick = () => { state.project = button.dataset.project || null; render(); };
  });

  $('stats').textContent = `открыто: ${counts.open} · просрочено: ${counts.overdue} · выполнено: ${counts.done}`;
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
}

function renderList() {
  const tasks = visibleTasks();
  if (tasks.length === 0) {
    $('list').innerHTML = '<div class="empty">Пусто.<br />Добавь задачу строкой сверху — например:<br /><b>сдать отчёт в пятницу 18:00 !3 #работа</b></div>';
    return;
  }
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const today = todayLocal(timeZone);
  const groups = new Map();
  for (const task of tasks) {
    const key = !task.due_at ? 'Без срока' : localDate(task.due_at, timeZone) < today ? 'Просрочено' : localDate(task.due_at, timeZone) === today ? 'Сегодня' : 'Дальше';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(task);
  }
  let html = '';
  for (const [groupName, groupTasks] of groups) {
    html += `<div class="day-group">${groupName}</div>`;
    for (const task of groupTasks) {
      const meta = [];
      if (task.due_at) meta.push(`<span class="${isLate(task) ? 'late' : ''}">📅 ${dueDayLabel(task)}</span>`);
      if (task.project) meta.push(`<span>#${escapeHtml(task.project)}</span>`);
      if (task.recurrence) meta.push('<span>🔁</span>');
      if ((task.remind_offsets || []).length === 0) meta.push('<span>🔕</span>');
      else if (task.due_at) meta.push(`<span>🔔 ${task.remind_offsets.length}</span>`);
      if (!task.synced && state.cloud.signedIn) meta.push('<span title="Ещё не ушло в облако">⏳</span>');
      html += `
        <div class="task ${task.status === 'done' ? 'done' : ''} ${state.selectedId === task.id ? 'selected' : ''}" data-id="${task.id}">
          <span class="prio prio-${task.priority}"></span>
          <button class="check ${task.status === 'done' ? 'done' : ''}" data-toggle="${task.id}">${task.status === 'done' ? '✓' : ''}</button>
          <div class="body" data-select="${task.id}">
            <div class="title">${escapeHtml(task.title)}</div>
            <div class="meta">${meta.join('')}</div>
          </div>
        </div>`;
    }
  }
  $('list').innerHTML = html;
  $('list').querySelectorAll('[data-toggle]').forEach((button) => {
    button.onclick = (event) => { event.stopPropagation(); toggleDone(button.dataset.toggle); };
  });
  $('list').querySelectorAll('[data-select]').forEach((element) => {
    element.onclick = () => { state.selectedId = element.dataset.select; render(); };
  });
}

async function toggleDone(taskId) {
  const task = state.tasks.find((item) => item.id === taskId);
  if (!task) return;
  const done = task.status !== 'done';
  const next = state.tasks.map((item) => item.id === taskId
    ? { ...item, status: done ? 'done' : 'open', completed_at: done ? new Date().toISOString() : null, updated_at: new Date().toISOString(), dirty: true }
    : item);
  if (done && task.recurrence) {
    // Повторяющиеся задачи создаёт триггер в БД; локально показываем подсказку.
    const backendNote = state.cloud.signedIn ? 'следующее вхождение создастся в облаке' : 'повтор создастся при включённой синхронизации';
    toast(`Готово: ${task.title} · ${backendNote}`);
  }
  await saveTasks(next, null);
}

// --- Панель задачи ---
function renderEditor() {
  const task = state.tasks.find((item) => item.id === state.selectedId);
  if (!task) {
    $('editor').innerHTML = '<p class="hint">Выбери задачу слева или добавь новую строкой сверху.<br /><br />Подсказки ввода:<br />• завтра 19:00<br />• в пятницу в 10<br />• через 3 дня<br />• !2 — приоритет<br />• #дом — проект, +срочно — тег<br />• за день за час — напоминания<br />• каждый день / по будням</p>';
    return;
  }
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const p = task.due_at ? parts(task.due_at, timeZone) : null;
  const dateValue = p ? `${p.year}-${String(p.month).padStart(2, '0')}-${String(p.day).padStart(2, '0')}` : '';
  const timeValue = p && !task.all_day ? `${String(p.hour).padStart(2, '0')}:${String(p.minute).padStart(2, '0')}` : '';
  $('editor').innerHTML = `
    <h3>Задача</h3>
    <div class="field"><label>Название</label><input id="fTitle" value="${escapeHtml(task.title)}" /></div>
    <div class="field"><label>Заметки</label><textarea id="fNotes">${escapeHtml(task.notes || '')}</textarea></div>
    <div class="row">
      <div class="field"><label>Дата</label><input type="date" id="fDate" value="${dateValue}" /></div>
      <div class="field"><label>Время</label><input type="time" id="fTime" value="${timeValue}" /></div>
    </div>
    <div class="row">
      <div class="field"><label>Приоритет</label><select id="fPriority">
        ${PRIORITY_LABELS.map((label, index) => `<option value="${index}" ${Number(task.priority) === index ? 'selected' : ''}>${label}</option>`).join('')}
      </select></div>
      <div class="field"><label>Повтор</label><select id="fRecurrence">
        ${RECURRENCE_OPTIONS.map(([value, label]) => `<option value="${value}" ${(task.recurrence ?? '') === value ? 'selected' : ''}>${label}</option>`).join('')}
      </select></div>
    </div>
    <div class="row">
      <div class="field"><label>Проект</label><input id="fProject" value="${escapeHtml(task.project ?? '')}" placeholder="например, работа" /></div>
      <div class="field"><label>Теги</label><input id="fTags" value="${escapeHtml((task.tags || []).join(' '))}" placeholder="через пробел" /></div>
    </div>
    <div class="field">
      <label>Напоминания до срока</label>
      <div class="offsets" id="fOffsets">
        ${OFFSET_PRESETS.map((minutes) => `<button data-offset="${minutes}" class="${(task.remind_offsets || []).includes(minutes) ? 'on' : ''}">${offsetLabel(minutes)}</button>`).join('')}
        <button data-offset="none" class="${(task.remind_offsets || []).length === 0 ? 'on' : ''}">выключены</button>
      </div>
    </div>
    <div class="actions">
      <button class="primary" id="fSave">Сохранить</button>
      <button class="ghost" id="fArchive">${task.status === 'archived' ? 'Вернуть' : 'В архив'}</button>
    </div>
    <div class="actions">
      <button class="danger" id="fDelete">Удалить</button>
    </div>
    <div class="section hint">
      ${task.due_at ? `Срок: ${dueDayLabel(task)} · ${dueLabel(task) || 'без времени'}` : 'Срок не задан'}
      ${task.synced ? '<br />Синхронизировано с облаком' : '<br />Ждёт синхронизации'}
    </div>`;

  $('fOffsets').querySelectorAll('button').forEach((button) => {
    button.onclick = () => {
      const value = button.dataset.offset;
      const current = new Set(task.remind_offsets || []);
      if (value === 'none') current.clear();
      else if (current.has(Number(value))) current.delete(Number(value));
      else current.add(Number(value));
      task.remind_offsets = Array.from(current).sort((a, b) => b - a);
      renderEditor();
    };
  });
  $('fSave').onclick = () => applyEditor(task);
  $('fArchive').onclick = async () => {
    const next = state.tasks.map((item) => item.id === task.id
      ? { ...item, status: item.status === 'archived' ? 'open' : 'archived', updated_at: new Date().toISOString(), dirty: true }
      : item);
    await saveTasks(next, task.status === 'archived' ? 'Возвращено из архива' : 'Убрано в архив');
  };
  $('fDelete').onclick = async () => {
    await bridge.remove(task.id);
    state.tasks = state.tasks.filter((item) => item.id !== task.id);
    state.selectedId = null;
    render();
    toast('Задача удалена');
  };
}

function offsetLabel(minutes) {
  if (minutes >= 10080) return `${minutes / 10080} нед`;
  if (minutes >= 1440) return `${minutes / 1440} дн`;
  if (minutes >= 60) return `${minutes / 60} ч`;
  return `${minutes} мин`;
}

async function applyEditor(task) {
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const date = $('fDate').value;
  const time = $('fTime').value;
  const previous = task;
  let dueAt = null;
  let allDay = false;
  if (date) {
    const [year, month, day] = date.split('-').map(Number);
    if (time) {
      const [hour, minute] = time.split(':').map(Number);
      dueAt = zonedToUtc(year, month, day, hour, minute, timeZone).toISOString();
    } else {
      dueAt = zonedToUtc(year, month, day, 12, 0, timeZone).toISOString();
      allDay = true;
    }
  }
  const updated = {
    ...previous,
    title: $('fTitle').value.trim() || previous.title,
    notes: $('fNotes').value,
    priority: Number($('fPriority').value),
    recurrence: $('fRecurrence').value || null,
    project: $('fProject').value.trim() || null,
    tags: $('fTags').value.split(/\s+/).map((tag) => tag.replace(/^\+/, '')).filter(Boolean).slice(0, 8),
    due_at: dueAt,
    all_day: allDay,
    remind_offsets: previous.remind_offsets,
    updated_at: new Date().toISOString(),
    dirty: true,
  };
  await saveTasks(state.tasks.map((item) => (item.id === previous.id ? updated : item)), 'Сохранено');
}

// --- Быстрое добавление ---
let previewTimer = null;
async function updatePreview() {
  const text = $('quickInput').value.trim();
  if (!text) { $('quickPreview').textContent = ''; return; }
  const parsed = await bridge.preview(text);
  const bits = [];
  if (parsed.title) bits.push(parsed.title);
  if (parsed.dueLabel) bits.push(parsed.dueLabel);
  if (Number(parsed.priority) > 1) bits.push(`!${parsed.priority}`);
  if (parsed.project) bits.push(`#${parsed.project}`);
  if (parsed.offsets && parsed.offsets.length) bits.push(`🔔 ${parsed.offsets.map(offsetLabel).join(', ')}`);
  else if (parsed.offsets && parsed.offsets.length === 0) bits.push('🔕');
  if (parsed.recurrence) bits.push('🔁');
  $('quickPreview').textContent = bits.join(' · ');
}

async function quickAdd() {
  const text = $('quickInput').value.trim();
  if (!text) return;
  const parsed = await bridge.preview(text);
  if (!parsed.title) { toast('Не понял название задачи'); return; }
  const offsets = parsed.offsets === null ? [1440, 60, 10] : parsed.offsets;
  const task = newTask(parsed.title, {
    due_at: parsed.dueAt,
    all_day: parsed.allDay,
    priority: parsed.priority,
    project: parsed.project,
    tags: parsed.tags,
    recurrence: parsed.recurrence,
    remind_offsets: offsets,
  });
  $('quickInput').value = '';
  $('quickPreview').textContent = '';
  state.selectedId = task.id;
  await saveTasks([...state.tasks, task], `Добавлено: ${task.title}`);
}

// --- Настройки ---
function renderSettings() {
  const settings = state.settings;
  const cloud = state.cloud || {};
  const zones = ['Europe/Moscow', 'Europe/Kaliningrad', 'Asia/Yekaterinburg', 'Asia/Omsk', 'Asia/Krasnoyarsk', 'Asia/Irkutsk', 'Asia/Vladivostok', 'Europe/Kiev', 'Europe/Minsk', 'Asia/Almaty', 'Europe/Berlin', 'UTC']
    .filter((zone, index, list) => list.indexOf(zone) === index);
  $('drawer').innerHTML = `
    <h3>Настройки</h3>
    <p class="hint">Версия ${escapeHtml(state.info.version || '')}. Данные: <button class="chip" id="openData">открыть папку</button></p>

    <div class="section">
      <h4>Расписание</h4>
      <div class="field"><label>Часовой пояс</label><select id="sTimezone">
        ${zones.map((zone) => `<option value="${zone}" ${settings.timezone === zone ? 'selected' : ''}>${zone}</option>`).join('')}
      </select></div>
      <div class="switch"><span>Утренний дайджест в Telegram</span><input type="checkbox" id="sDigest" ${settings.digestEnabled ? 'checked' : ''} /></div>
      <div class="field"><label>Время дайджеста</label><input type="time" id="sDigestAt" value="${escapeHtml(settings.digestAt || '09:00')}" /></div>
      <div class="field"><label>Уведомления</label><select id="sNotifications">
        ${[['both', 'Windows + Telegram'], ['toast', 'Только Windows'], ['telegram', 'Только Telegram'], ['off', 'Выключены']]
          .map(([value, label]) => `<option value="${value}" ${settings.notifications === value ? 'selected' : ''}>${label}</option>`).join('')}
      </select></div>
    </div>

    <div class="section">
      <h4>Облако и аккаунт</h4>
      ${cloud.signedIn
        ? `<p class="hint">Вход выполнен: <b>${escapeHtml(cloud.email)}</b>${cloud.profile?.display_name ? ` · ${escapeHtml(cloud.profile.display_name)}` : ''}<br />
             Telegram: ${cloud.profile?.telegram_username ? `@${escapeHtml(cloud.profile.telegram_username)}` : 'не привязан'}<br />
             Последняя синхронизация: ${state.cloud.lastSyncAt ? escapeHtml(new Date(state.cloud.lastSyncAt).toLocaleString('ru-RU')) : 'ещё не было'}</p>
           <div class="actions"><button class="ghost" id="sSync">Синхронизировать</button><button class="danger" id="sSignOut">Выйти</button></div>`
        : `<div class="field"><label>E-mail</label><input id="sEmail" autocomplete="username" /></div>
           <div class="field"><label>Пароль (минимум 6 символов)</label><input id="sPassword" type="password" autocomplete="current-password" /></div>
           <div class="actions"><button class="primary" id="sSignIn">Войти</button><button class="ghost" id="sSignUp">Создать аккаунт</button></div>
           <p class="hint">После регистрации подтвердите e-mail письмом от Supabase.</p>`}
      <div class="field"><label>Supabase URL</label><input id="sUrl" value="${escapeHtml(settings.supabaseUrl || '')}" placeholder="https://xxxx.supabase.co" /></div>
      <div class="field"><label>Publishable key</label><input id="sKey" value="${escapeHtml(settings.supabaseKey || '')}" placeholder="sb_publishable_... или anon key" /></div>
      <div class="actions"><button class="ghost" id="sSaveCloud">Сохранить параметры облака</button></div>
      ${cloud.signedIn ? `
        <div class="field" style="margin-top:12px"><label>Код привязки Telegram</label><input id="sTgCode" placeholder="10 символов из бота" /></div>
        <div class="actions"><button class="ghost" id="sTgLink">Привязать Telegram</button></div>
        <p class="hint">Отправь боту /start, получи код и введи его здесь.</p>` : ''}
    </div>

    <div class="section">
      <h4>Приложение</h4>
      <div class="switch"><span>Запускать с Windows</span><input type="checkbox" id="sStartup" ${state.startup ? 'checked' : ''} /></div>
      <div class="actions"><button class="ghost" id="sCheckUpdates">Проверить обновления</button>${state.update.status === 'ready' ? '<button class="primary" id="sInstall">Перезапустить и обновить</button>' : ''}</div>
      <p class="hint">${escapeHtml(updateLabel(state.update))}</p>
      <p class="hint">Кнопка «×» закрывает окно в трей: напоминания продолжают работать.</p>
    </div>
    <div class="actions"><button class="ghost" id="sClose">Закрыть</button></div>`;

  const saveSettings = async (patch, message) => {
    state.settings = await bridge.saveSettings(patch);
    if (message) toast(message);
    render();
  };
  $('sTimezone').onchange = () => saveSettings({ timezone: $('sTimezone').value }, 'Часовой пояс сохранён');
  $('sDigest').onchange = () => saveSettings({ digestEnabled: $('sDigest').checked });
  $('sDigestAt').onchange = () => saveSettings({ digestAt: $('sDigestAt').value || '09:00' }, 'Время дайджеста сохранено');
  $('sNotifications').onchange = () => saveSettings({ notifications: $('sNotifications').value });
  $('sStartup').onchange = async () => {
    const result = await bridge.setStartup($('sStartup').checked);
    state.startup = Boolean(result?.enabled);
    toast(state.startup ? 'Автозапуск включён' : 'Автозапуск выключен');
  };
  $('sSaveCloud').onclick = () => saveSettings({ supabaseUrl: $('sUrl').value.trim(), supabaseKey: $('sKey').value.trim() }, 'Параметры облака сохранены');
  $('sSync')?.addEventListener('click', async () => { const result = await bridge.syncNow(); toast(result?.ok ? 'Синхронизировано' : `Не удалось: ${result?.reason ?? result?.error ?? 'ошибка'}`); render(); });
  $('sSignIn')?.addEventListener('click', async () => {
    try {
      state.cloud = await bridge.signIn($('sEmail').value, $('sPassword').value);
      toast('Вход выполнен');
      render();
    } catch (error) { toast(`Не удалось войти: ${error.message}`); }
  });
  $('sSignUp')?.addEventListener('click', async () => {
    try {
      const result = await bridge.signUp($('sEmail').value, $('sPassword').value);
      toast(result.needsConfirmation ? 'Аккаунт создан: подтвердите e-mail письмом' : 'Аккаунт создан');
      state.cloud = result.state || state.cloud;
      render();
    } catch (error) { toast(`Не удалось зарегистрироваться: ${error.message}`); }
  });
  $('sSignOut')?.addEventListener('click', async () => { state.cloud = await bridge.signOut(); toast('Вы вышли из аккаунта'); render(); });
  $('sTgLink')?.addEventListener('click', async () => {
    try {
      const result = await bridge.linkTelegram($('sTgCode').value);
      state.cloud = result.state || state.cloud;
      toast('Telegram привязан');
      render();
    } catch (error) { toast(error.message); }
  });
  $('sCheckUpdates')?.addEventListener('click', async () => { await bridge.checkUpdates(); render(); });
  $('sInstall')?.addEventListener('click', () => bridge.installUpdate());
  $('openData')?.addEventListener('click', () => bridge.openDataFolder());
  $('sClose').onclick = closeDrawer;
}

function updateLabel(update) {
  const map = {
    idle: 'Обновления проверяются при запуске приложения.',
    dev: 'Проверка обновлений доступна только в установленной версии.',
    checking: 'Проверяем обновления…',
    available: `Найдена версия ${update.version}. Скачиваем.`,
    downloading: `Скачивание: ${update.percent ?? 0}%`,
    ready: `Версия ${update.version} готова к установке.`,
    current: 'Установлена последняя версия.',
    error: `Ошибка обновления: ${update.error || 'неизвестно'}`,
  };
  return map[update.status] ?? '';
}

function openDrawer() {
  renderSettings();
  $('drawer').style.display = 'block';
  $('overlay').classList.add('open');
}
function closeDrawer() {
  $('drawer').style.display = 'none';
  $('overlay').classList.remove('open');
}

// --- Общий рендер и события ---
function render() {
  renderFilters();
  renderList();
  renderEditor();
  if ($('drawer').style.display === 'block') renderSettings();

  const cloud = state.cloud || {};
  $('cloudDot').className = `dot ${!cloud.configured ? '' : cloud.signedIn ? (cloud.error ? 'warn' : 'ok') : 'warn'}`;
  $('cloudText').textContent = !cloud.configured
    ? 'Локальный режим'
    : cloud.signedIn
      ? `${cloud.email}${state.cloud.lastSyncAt ? ' · синхронизировано' : ''}`
      : 'Облако настроено, вход не выполнен';
  $('showDone').checked = state.showDone;
}

$('quickInput').addEventListener('input', () => { clearTimeout(previewTimer); previewTimer = setTimeout(updatePreview, 180); });
$('quickInput').addEventListener('keydown', (event) => { if (event.key === 'Enter') quickAdd(); });
$('quickAdd').onclick = quickAdd;
$('search').addEventListener('input', () => { state.search = $('search').value; render(); });
$('showDone').addEventListener('change', () => { state.showDone = $('showDone').checked; render(); });
$('settingsButton').onclick = openDrawer;
$('syncButton').onclick = async () => {
  const result = await bridge.syncNow();
  toast(result?.ok ? `Синхронизировано: ${result.pushed} отправлено, ${result.pulled} получено` : `Синхронизация не выполнена: ${result?.reason ?? result?.error ?? 'нет входа в аккаунт'}`);
};
$('overlay').onclick = closeDrawer;
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') closeDrawer();
  if (event.key === 'n' && event.ctrlKey) { event.preventDefault(); $('quickInput').focus(); }
});

bridge.onTasksChanged((tasks) => { state.tasks = tasks || []; render(); });
bridge.onCloudStatus((cloud) => { state.cloud = { ...state.cloud, ...cloud }; render(); });
bridge.onUpdateStatus((update) => { state.update = update; render(); });
bridge.onFocusTask((taskId) => { state.selectedId = taskId; render(); });

bootstrap();
</script>
</body>
</html>

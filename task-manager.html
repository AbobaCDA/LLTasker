<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:;" />
<title>LLTasker</title>
<style>
  :root {
    --bg: #12151c;
    --panel: rgba(24, 28, 38, .78);
    --panel-2: #1e2431;
    --line: #2a3242;
    --grid-hour: rgba(255, 255, 255, .13);
    --grid-half: rgba(255, 255, 255, .055);
    --text: #e8ecf4;
    --muted: #8d99ae;
    --accent: #4f8cff;
    --accent-soft: #22314f;
    --ok: #3ecf8e;
    --warn: #f2b544;
    --danger: #f2545b;
    --radius: 14px;
    --panel-alpha: .1;            /* прозрачность колонок дней и карточек — одна на всех */
    --scale: 1;                   /* высота карточек (ползунок в настройках) */
    --card-rgb: 34, 40, 54;      /* цвет карточки, прозрачность — отдельно */
    --card-line: rgba(255, 255, 255, .08);
    --solid: #1e2431;             /* непрозрачный фон всплывающих окон */
    --pop-bg: rgba(38, 44, 58, .82);   /* матовый серый фон выпадающих выборов */
    --wallpaper: none;
    --wallpaper-veil: rgba(10, 12, 18, .55);
    --blur: 10px;
  }
  :root[data-theme="light"] {
    --bg: #e9edf2;
    --panel: rgba(255, 255, 255, .62);
    --panel-2: rgba(255, 255, 255, .92);
    --line: rgba(60, 72, 90, .18);
    --grid-hour: rgba(40, 50, 70, .17);
    --grid-half: rgba(40, 50, 70, .075);
    --text: #1f2733;
    --muted: #55637a;
    --accent: #2f6fed;
    --accent-soft: rgba(47, 111, 237, .14);
    --ok: #1f9d64;
    --warn: #c98a12;
    --danger: #d9414a;
    --card-rgb: 255, 255, 255;
    --card-line: rgba(80, 92, 110, .35);  /* серый контур облачка */
    --solid: #ffffff;
    --pop-bg: rgba(214, 220, 228, .72);
    --wallpaper-veil: rgba(240, 243, 247, .25);
    --blur: 12px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none;
  }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: var(--wallpaper) center / cover no-repeat; }
  body::after { content: ""; position: fixed; inset: 0; z-index: -1; background: var(--wallpaper-veil); }
  body.no-wallpaper::before, body.no-wallpaper::after { display: none; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  .app { display: flex; flex-direction: column; height: 100vh; min-height: 0; }

  /* --- Верхняя строка: минимум элементов --- */
  .topbar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-right: 4px; white-space: nowrap; }
  .brand .logo { width: 24px; height: 24px; border-radius: 7px; background: linear-gradient(135deg, #4f8cff, #8b5cf6); display: grid; place-items: center; font-size: 13px; color: #fff; }
  .brand .badge { font-weight: 400; }
  .glass { background: rgba(var(--card-rgb), .35); border: 1px solid var(--card-line); backdrop-filter: blur(var(--blur)); }
  .spacer { flex: 1; }
  .weeknav { display: flex; align-items: center; border-radius: 10px; height: 34px; overflow: hidden; }
  .weeknav button { background: transparent; border: 0; color: var(--text); height: 100%; padding: 0 10px; font-size: 13px; white-space: nowrap; }
  .weeknav button:first-child, .weeknav button:last-child { font-size: 18px; color: var(--muted); padding: 0 9px; }
  .weeknav button:hover { color: var(--accent); }
  .weeknav button.off { color: var(--muted); }
    .arch-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .arch-row:last-child { border-bottom: 0; }
  .arch-row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .arch-row .m { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .arch-row button { border-radius: 8px; padding: 5px 10px; font-size: 12px; }
  .preview { color: var(--muted); font-size: 12px; min-height: 18px; margin: 4px 2px 0; }
  .primary { background: var(--accent); border: 0; color: #fff; border-radius: 10px; padding: 8px 14px; font-weight: 600; }
  .primary:hover { filter: brightness(1.08); }
  .primary.glass { background: rgba(47, 111, 237, .55); border: 1px solid rgba(47, 111, 237, .5); color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .25); }
  .primary.glass:hover { background: rgba(47, 111, 237, .75); }
  .search { border-radius: 10px; padding: 7px 10px; width: 150px; outline: none; transition: width .15s; }
  .search::placeholder { color: var(--muted); }
  .search:focus { width: 220px; border-color: var(--accent); }
  .icon-btn { color: var(--muted); border-radius: 10px; width: 34px; height: 34px; display: grid; place-items: center; font-size: 16px; line-height: 1; flex: none; }
  .modal-card .icon-btn { background: transparent; border: 1px solid var(--line); }
  .icon-btn:hover { color: var(--text); border-color: var(--accent); }
  .icon-btn.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; cursor: pointer; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.err { background: var(--danger); }

  /* --- Доска: колонка «Сегодня» слева + лента дней по календарю (прокрутка мышкой) --- */
  .board { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 7fr); gap: 7px; padding: 4px 14px 8px; }
  .col.today-pane { margin-right: 8px; }
  /* Лента на 4 недели вперёд: в окне видно 7 дней той же ширины, остальные — прокруткой (мышкой, колесом, стрелками). */
  .days { display: flex; gap: 7px; min-height: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  .days::-webkit-scrollbar { display: none; }
  .days .col { flex: 0 0 calc((100% - 42px) / 7); min-width: 0; }
  .days .col-head { cursor: grab; }
  body.panning, body.panning * { cursor: grabbing !important; user-select: none; }
  .cal-grid button.range { background: var(--accent-soft); border-radius: 0; }
  .cal-grid button.range.first { border-radius: 8px 0 0 8px; } .cal-grid button.range.last { border-radius: 0 8px 8px 0; }
  .col.is-today .col-head .name { color: var(--accent); }
  .col.is-today { box-shadow: inset 0 3px 0 var(--accent); }
  .col.past { opacity: .78; }
  .col-body .same-day { color: var(--muted); font-size: 11px; text-align: center; padding: 10px 6px; line-height: 1.4; }
  .col { display: flex; flex-direction: column; min-height: 0; border-radius: var(--radius); background: rgba(var(--card-rgb), var(--panel-alpha)); }
  .col { transition: background-color .15s; }
  .col.drop { background: rgba(var(--card-rgb), calc(var(--panel-alpha) + .14)); }
  .col-head { padding: 10px 10px 6px; display: grid; grid-template-columns: 1fr auto; column-gap: 6px; align-items: baseline; }
  .col-head .name { font-weight: 600; font-size: 13px; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .col-head .date { grid-column: 1 / -1; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .col.weekend .col-head .name { color: var(--danger); opacity: .85; }
  .col-head .n { font-size: 11px; color: var(--muted); }
  .shelf .col-head { grid-template-columns: auto 1fr; }
  .col-body { flex: 1; min-height: 40px; overflow-y: auto; padding: 4px 7px 7px; display: flex; flex-direction: column; gap: 7px; }
  /* Колонка дня — таймлайн 8:00–22:00: 28 получасовых рядов на всю высоту, карточки стоят на своём времени. */
  .col-body[data-zone="day"] { overflow: hidden; gap: 0; padding: 2px 6px 6px; }
  .timeline { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .timeline .slot { flex: 1; min-height: 0; border-top: 1px solid var(--grid-half); position: relative; }
  .timeline .slot.hour { border-top-color: var(--grid-hour); }
  .timeline .slot.hour::before { content: attr(data-h); position: absolute; left: 1px; top: 1px; z-index: 1; font-size: 9px; line-height: 12px; min-width: 14px; text-align: center; padding: 0 3px; border-radius: 4px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); background: rgba(var(--card-rgb), .62); backdrop-filter: blur(3px); box-shadow: 0 0 0 1px rgba(var(--card-rgb), .25); opacity: .9; }
  .timeline .card, .timeline .placeholder { position: absolute; left: 2px; right: 2px; width: auto; transition: top .12s ease, left .12s ease, transform .1s, box-shadow .1s; }
  .timeline .card:hover { z-index: 40 !important; }
  .timeline .placeholder { pointer-events: none; transition: top .08s ease; z-index: 50; }
  .timeline .now { position: absolute; left: 0; right: 0; height: 1px; background: var(--accent); opacity: .6; pointer-events: none; z-index: 2; }
  .timeline .now::before { content: ''; position: absolute; left: -1px; top: -2px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
  .overdue, .allday { flex: none; display: flex; flex-direction: column; gap: 5px; max-height: 40%; overflow-y: auto; }
  .overdue { padding-bottom: 6px; }
  .allday { padding-top: 6px; border-top: 1px dashed var(--grid-hour); min-height: 24px; position: relative; }
  .allday:empty::after { content: 'без времени'; position: absolute; inset: 6px 0 0; text-align: center; font-size: 10px; color: var(--muted); opacity: 0; transition: opacity .15s; }
  body.dragging .allday:empty::after { opacity: .8; }
  .allday .card { aspect-ratio: auto; }
  .allday .card .title { -webkit-line-clamp: 2; }
  .picker.timepop { padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  .picker.timepop .row { display: flex; align-items: center; gap: 6px; }
  .picker.timepop input { width: 64px; text-align: center; font: inherit; font-size: 14px; padding: 5px 6px; border-radius: 8px; border: 1px solid var(--line); background: rgba(var(--card-rgb), .5); color: var(--text); }
  .picker.timepop button { padding: 5px 9px; border-radius: 8px; font-size: 13px; }
  .picker.timepop button.ok { background: var(--accent); color: #fff; }
  .picker.timepop .hint { font-size: 11px; color: var(--muted); }
  /* Выбор недели при перетаскивании: появляется сверху, пока тянешь карточку */
  .weekpick { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 60; display: none; flex-direction: column; gap: 8px; padding: 10px 12px; border-radius: 16px; max-width: calc(100vw - 40px); box-shadow: 0 12px 40px rgba(0, 0, 0, .25); }
  body.dragging .weekpick { display: flex; }
  .weekpick .wk-row, .weekpick .wd-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .weekpick .wk { border: 1px solid var(--line); border-radius: 10px; padding: 5px 11px; font-size: 14px; color: var(--muted); background: rgba(var(--card-rgb), .35); white-space: nowrap; }
  .weekpick .wk b { color: var(--text); font-weight: 600; }
  .weekpick .wk.sel { border-color: var(--accent); background: var(--accent-soft); }
  .weekpick .wk, .weekpick .wd { transition: background-color .15s, transform .15s; }
  .weekpick .wk.over, .weekpick .wd.over { background: rgba(var(--card-rgb), .75); transform: scale(1.06); border-color: var(--card-line); }
  .weekpick .wd { flex: 1; min-width: 78px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; text-align: center; font-size: 14px; background: rgba(var(--card-rgb), .35); }
  .weekpick .wd b { display: block; font-size: 18px; }
  .weekpick .wd.weekend b { color: var(--danger); }
  .weekpick .wd.is-today { border-color: var(--accent); }
  .weekpick .hint { text-align: center; margin: 0; font-size: 13px; }
  .col-body::-webkit-scrollbar { width: 6px; } .col-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

  /* --- Карточка-облачко --- */
  .card {
    position: relative; aspect-ratio: calc(4 / 3 / var(--scale)); width: 100%; flex: none;
    border-radius: var(--radius); border: 1px solid var(--card-line);
    background: rgba(var(--card-rgb), var(--panel-alpha)); backdrop-filter: blur(var(--blur));
    padding: .7em .77em .6em; display: flex; flex-direction: column; gap: .3em; cursor: grab; font-size: 13px;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .06); transition: transform .1s, box-shadow .1s;
  }
  .card:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0, 0, 0, .12); border-color: var(--accent); }
  .card.dragging { opacity: .35; }
  /* Низкие карточки (ползунок < 80 % / < 60 %): меньше отступов, короче заголовок, без нижней строки. */
  body.cards-compact .board .card { padding: .45em .65em .4em; gap: .15em; }
  body.cards-compact .board .timeline .card .title { -webkit-line-clamp: 1; }
  body.cards-tight .board .card .title { -webkit-line-clamp: 1; }
  body.cards-tight .board .card .foot { display: none; }
  body.cards-tight .board .card .top { font-size: .8em; }
  /* Ниже 40 % — карточка в одну строку: время · название · галочка. */
  body.cards-line .board .timeline .card { flex-direction: row; align-items: center; gap: .4em; padding: .2em .5em .2em .6em; }
  body.cards-line .board .timeline .card .top { display: contents; }
  body.cards-line .board .timeline .card .top .time, body.cards-line .board .timeline .card .top .late { font-size: .85em; white-space: nowrap; }
  body.cards-line .board .timeline .card .title { order: 2; flex: 1; min-width: 0; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: .95em; }
  body.cards-line .board .timeline .card .check { order: 3; margin-left: auto; }
  body.cards-line .board .timeline .card .foot { display: none; }
  .card.done { opacity: .55; }
  .card.done .title { text-decoration: line-through; color: var(--muted); }
  .card .top { display: flex; align-items: center; gap: .45em; font-size: .85em; color: var(--muted); }
  .card .top .time { font-weight: 600; color: var(--text); }
  .card .top .late { color: var(--danger); font-weight: 600; }
  .card .check { width: 1.45em; height: 1.45em; border-radius: 50%; border: 1.5px solid var(--muted); background: transparent; flex: none; padding: 0; margin-left: auto; font-size: .9em; line-height: 1; }
  .card .check:hover { border-color: var(--ok); }
  .card .check.done { background: var(--ok); border-color: var(--ok); color: #fff; }
  .card .title { font-weight: 500; font-size: 1em; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow-wrap: anywhere; flex: 1; }
  .card .foot { display: flex; align-items: center; gap: .45em; font-size: .85em; color: var(--muted); min-height: 1.2em; }
  .card .foot .proj { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .stripe { position: absolute; left: 10px; right: 10px; top: 0; height: 3px; border-radius: 0 0 3px 3px; }
  .prio-0 .stripe, .prio-1 .stripe { background: transparent; } .prio-2 .stripe { background: #f59e0b; } .prio-3 .stripe { background: #ef4444; }
  .placeholder { flex: none; width: 100%; aspect-ratio: calc(4 / 3 / var(--scale)); border-radius: var(--radius); background: rgba(var(--card-rgb), .22); box-shadow: inset 0 0 0 1px rgba(var(--card-rgb), .45); animation: ph-in .18s ease; }
  @keyframes ph-in { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }

  /* --- Полка внизу: без срока и позже --- */
  .shelf { display: grid; grid-template-columns: 1fr; gap: 8px; padding: 0 14px 12px; height: calc(150px + 50px * var(--scale)); }
  .shelf .col { flex-direction: column; }
  .shelf .col-body { flex-direction: row; overflow-x: auto; overflow-y: hidden; align-items: stretch; }
  .shelf .card { width: var(--day-card-w, 140px); aspect-ratio: auto; height: 100%; }
  .shelf .placeholder { width: var(--day-card-w, 140px); aspect-ratio: auto; height: auto; }
  .shelf.collapsed { height: 40px; }
  .shelf.collapsed .col-body { display: none; }
  .empty-hint { color: var(--muted); font-size: 12px; align-self: center; padding: 3px 9px; border-radius: 8px; background: rgba(var(--card-rgb), .55); }

  /* --- Всплывающие окна --- */
  .overlay { position: fixed; inset: 0; background: rgba(6, 8, 12, .45); display: none; z-index: 20; }
  .overlay.open { display: block; }
  .modal { position: fixed; inset: 0; display: none; place-items: center; z-index: 30; background: rgba(6, 8, 12, .35); }
  .modal.open { display: grid; }
  .modal-card { width: min(560px, calc(100vw - 40px)); max-height: calc(100vh - 40px); overflow-y: auto; background: rgba(var(--card-rgb), .72); backdrop-filter: blur(22px) saturate(1.1); border: 1px solid var(--card-line); border-radius: 16px; padding: 18px 20px 16px; box-shadow: 0 20px 60px rgba(0, 0, 0, .25); }
  :root[data-theme="light"] .modal-card .field input, :root[data-theme="light"] .modal-card .field select, :root[data-theme="light"] .modal-card .field textarea { background: rgba(255, 255, 255, .6); }
  :root[data-theme="light"] .modal-card .log-view { background: rgba(255, 255, 255, .7); }
  .editor-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .editor-head h3 { margin: 0; font-size: 16px; }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .field label { font-size: 12px; color: var(--muted); }
  .field input, .field select, .field textarea { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; outline: none; width: 100%; }
  :root[data-theme="light"] .field input, :root[data-theme="light"] .field select, :root[data-theme="light"] .field textarea { background: #fff; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 56px; }
  .field input[type=range] { padding: 0; border: 0; background: transparent; }
  .row { display: flex; gap: 10px; }
  .field input.bad { border-color: var(--danger); }
  /* Всплывающий выбор даты / времени под полем (текст в поле и выбор синхронны) */
  .picker { position: fixed; z-index: 70; background: var(--pop-bg); backdrop-filter: blur(18px) saturate(.9); border: 1px solid var(--card-line); border-radius: 12px; padding: 10px; box-shadow: 0 14px 40px rgba(0, 0, 0, .22); user-select: none; }
  .picker button { border: 0; background: transparent; color: var(--text); border-radius: 8px; font-size: 13px; cursor: pointer; padding: 0; }
  .picker button:hover { background: var(--accent-soft); }
  .picker button.sel { background: var(--accent); color: #fff; }
  .picker button.now { box-shadow: inset 0 0 0 1px var(--accent); }
  .cal { width: 238px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .cal-head b { font-weight: 600; font-size: 13px; text-transform: capitalize; }
  .cal-head button { width: 28px; height: 28px; font-size: 18px; color: var(--muted); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-grid span { text-align: center; font-size: 11px; color: var(--muted); padding: 2px 0 4px; }
  .cal-grid span.we, .cal-grid button.we { color: var(--danger); }
  .cal-grid button { height: 30px; }
  .cal-grid button.other { opacity: .35; }
  .cal-foot { display: flex; gap: 6px; margin-top: 8px; }
  .cal-foot button { flex: 1; font-size: 12px; color: var(--muted); padding: 5px 0; border: 1px solid var(--line); }
  .tp { display: flex; gap: 8px; }
  .tp-col { display: flex; flex-direction: column; gap: 2px; max-height: 216px; overflow-y: auto; padding-right: 2px; scrollbar-width: thin; }
  .tp-col button { width: 56px; height: 28px; flex: none; }
  .tp-col::-webkit-scrollbar { width: 5px; } .tp-col::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .tp-foot { margin-top: 8px; display: flex; gap: 6px; }
  .tp-foot button { flex: 1; font-size: 11px; color: var(--muted); padding: 5px 6px; border: 1px solid var(--line); white-space: nowrap; }
  .row > * { flex: 1; }
  .offsets { display: flex; flex-wrap: wrap; gap: 6px; }
  .offsets button { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 20px; padding: 4px 10px; font-size: 12px; }
  .offsets button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
  .offsets button.custom { border-style: dashed; }
  .custom-offset { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .custom-offset input[type=range] { flex: 1; }
  /* Ползунок в общем стиле */
  input[type=range].slim { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 3px; background: rgba(var(--card-rgb), .55); border: 1px solid var(--card-line); outline: none; padding: 0; }

<script>
// Без Electron (например, при простом открытии файла) интерфейс работает в демо-режиме:

    make('demo-3', 'Позвонить в банк', { due_at: utc(-1, 11, 0), priority: 2, remind_offsets: [60, 10] }),
    make('demo-4', 'Тренировка', { due_at: utc(1, 4, 30), recurrence: 'weekdays', project: 'здоровье' }),

}
const demoBridge = {
  load: async () => ({

    settings: { timezone: 'Europe/Moscow', digestEnabled: true, digestAt: '09:00', notifications: 'both', supabaseUrl: '', supabaseKey: '', theme: 'light', wallpaper: 'forest', panelOpacity: 10, cardScale: 100 },
    cloud: { configured: false, signedIn: false, error: '' },

  }),

  save: async (tasks) => ({ saved: tasks.length, sync: { ok: false, reason: 'demo' } }),
  remove: async () => ({ ok: true }),
  preview: async (text) => ({ title: String(text).trim(), dueAt: null, allDay: false, priority: 1, project: null, tags: [], recurrence: null, offsets: null, dueLabel: '' }),

  setStartup: async () => ({ enabled: false }),
  checkUpdates: async () => ({ status: 'dev' }),
  installUpdate: () => {},

  getWallpaper: async () => {
    try {
      const blob = await (await fetch('assets/wallpaper-forest.jpg')).blob();

  logTail: async () => ({ lines: ['2026-10-08 12:00:00\tприложение запущено\tверсия демо', '2026-10-08 12:01:10\tзадача добавлена\t«Оплатить хостинг» · сегодня 18:30'], file: 'демо', directory: 'демо' }),

const bridge = window.lltasker ?? demoBridge;

const state = {
  tasks: [],
  settings: {},
  cloud: {},
  startup: false,
  update: {},
  info: {},
  search: '',
  selectedId: null,
  daysScroll: 0, // прокрутка ленты дней в px — восстанавливается после перерисовки
  pending: null, // новая задача, открытая в карточке, но ещё не созданная

};

const PRIORITY_LABELS = ['Низкий', 'Низкий', 'Средний', 'Высокий']; // 1 — низкий (по умолчанию), 0 — старое значение, читается как низкий

const OFFSET_PRESETS = [5, 15, 30, 90]; // стандартные; остальное — ползунком
const DEFAULT_OFFSETS = [30, 5];
const OFFSET_SLIDER = [1, 2, 3, 5, 10, 15, 20, 30, 45, 60, 90, 120, 180, 240, 300, 360, 480, 720, 1440, 2880, 4320, 7200, 10080, 20160];
const RECURRENCE_OPTIONS = [['', 'Без повтора'], ['daily', 'Каждый день'], ['weekdays', 'По будням'], ['weekly', 'Каждую неделю'], ['monthly', 'Каждый месяц']];
const $ = (id) => document.getElementById(id);

function toast(message) {
  const element = $('toast');
  element.textContent = message;
  element.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => element.classList.remove('show'), 2600);
}

// --- Работа с датами в интерфейсе (часовой пояс из настроек) ---
function parts(iso, timeZone) {
  const formatter = new Intl.DateTimeFormat('en-CA', { timeZone, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false, hourCycle: 'h23' });
  const list = formatter.formatToParts(new Date(iso));
  const value = (type) => Number(list.find((part) => part.type === type)?.value ?? 0);
  return { year: value('year'), month: value('month'), day: value('day'), hour: value('hour') % 24, minute: value('minute') };
}
function localDate(iso, timeZone) {
  const p = parts(iso, timeZone);
  return `${p.year}-${String(p.month).padStart(2, '0')}-${String(p.day).padStart(2, '0')}`;
}
function todayLocal(timeZone) {
  return localDate(new Date().toISOString(), timeZone);
}
function addDaysLocal(timeZone, days) {
  const p = parts(new Date().toISOString(), timeZone);
  const shifted = new Date(Date.UTC(p.year, p.month - 1, p.day + days, 12, 0));
  return `${shifted.getUTCFullYear()}-${String(shifted.getUTCMonth() + 1).padStart(2, '0')}-${String(shifted.getUTCDate()).padStart(2, '0')}`;
}
function dueLabel(task) {
  if (!task.due_at) return '';
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const p = parts(task.due_at, timeZone);
  const time = `${String(p.hour).padStart(2, '0')}:${String(p.minute).padStart(2, '0')}`;
  return task.all_day ? '' : time;
}
function dueDayLabel(task) {
  if (!task.due_at) return 'без срока';
  const timeZone = state.settings.timezone || 'Europe/Moscow';
  const target = localDate(task.due_at, timeZone);
  const today = todayLocal(timeZone);
  const time = dueLabel(task);
  const suffix = time ? ` ${time}` : '';
  if (target === today) return `сегодня${suffix}`;
  if (target === addDaysLocal(timeZone, 1)) return `завтра${suffix}`;
  const p = parts(task.due_at, timeZone);
  return `${String(p.day).padStart(2, '0')}.${String(p.month).padStart(2, '0')}${suffix}`;
}
// Локальные дата и время → момент UTC в выбранном поясе (та же логика, что в общем модуле).
function zonedToUtc(year, month, day, hour, minute, timeZone) {
  const guess = new Date(Date.UTC(year, month - 1, day, hour, minute));
  const offsetOf = (date) => {
    const p = parts(date.toISOString(), timeZone);
    return Math.round((Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute) - date.getTime()) / 60_000);
  };
  const offset = offsetOf(guess);
  const first = new Date(guess.getTime() - offset * 60_000);
  const second = offsetOf(first);
  return second === offset ? first : new Date(guess.getTime() - second * 60_000);
}

function isLate(task) {
  return task.status === 'open' && task.due_at && localDate(task.due_at, state.settings.timezone || 'Europe/Moscow') < todayLocal(state.settings.timezone || 'Europe/Moscow');
}

// --- Оформление: тема и обои ---
// Картинки приходят из главного процесса как data URL: CSP страницы не пускает file://.
let wallpapers = null; // { forest, custom }
async function loadWallpapers(force = false) {
  if (!wallpapers || force) wallpapers = (await bridge.getWallpaper()) || { forest: null, custom: null };
  return wallpapers;
}
async function applyAppearance() {
  const theme = state.settings.theme === 'light' ? 'light' : 'dark';
  document.documentElement.dataset.theme = theme;
  let url = null;
  if (state.settings.wallpaper === 'forest' || state.settings.wallpaper === 'custom') {
    const images = await loadWallpapers();
    url = images[state.settings.wallpaper] || null;
  }
  document.body.classList.toggle('no-wallpaper', !url);
  const opacity = Math.min(60, Math.max(5, Number(state.settings.panelOpacity) || 10));
  document.documentElement.style.setProperty('--panel-alpha', String(opacity / 100));
  setCardScale(Number(state.settings.cardScale) || 100);
  document.documentElement.style.setProperty('--wallpaper', url ? `url("${url}")` : 'none');
}

/** Высота карточек: CSS-переменная + режимы «компактно»/«в одну строку» для низких карточек. */
function setCardScale(value) {
  const scale = Math.min(160, Math.max(25, Number(value) || 100));
  document.documentElement.style.setProperty('--scale', String(scale / 100));
  document.body.classList.toggle('cards-compact', scale < 80);
  document.body.classList.toggle('cards-tight', scale < 60);
  document.body.classList.toggle('cards-line', scale < 40);
  if (typeof layoutTimelines === 'function') layoutTimelines();
}

// --- Загрузка и сохранение ---
async function bootstrap() {
  const payload = await bridge.load();
  state.tasks = payload.tasks || [];
  state.settings = payload.settings || {};
  await applyAppearance();
  state.cloud = payload.cloud || {};
  state.startup = Boolean(payload.startup);
  state.update = payload.update || {};

}

async function saveTasks(tasks, message) {
  state.tasks = tasks;
  render();
  const result = await bridge.save(tasks);
  if (message) toast(message);
  if (result?.sync && result.sync.ok === false && state.cloud.signedIn && result.sync.error) toast(`Синхронизация: ${result.sync.error}`);
}

function newTask(title, extra = {}) {
  return {
    id: (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)),
    title,
    notes: '',
    priority: 1,
    project: null,
    tags: [],
    due_at: null,
    all_day: false,
    remind_offsets: [...DEFAULT_OFFSETS],
    status: 'open',
    completed_at: null,
    recurrence: null,

    created_at: new Date().toISOString(),
    updated_at: new Date().toISOString(),
    dirty: true,
    synced: false,
    ...extra,

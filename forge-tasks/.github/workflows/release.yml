name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # нужно и для публикации релиза, и для gh CLI

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Кэш npm включаем только если package-lock.json есть в репозитории:
          # иначе setup-node падает с «Dependencies lock file is not found».
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Check environment
        shell: pwsh
        run: |
          node -v
          npm -v
          $version = node -p "require('./package.json').version"
          $repo = node -p "require('./package.json').build.publish[0].repo"
          Write-Host "Версия в package.json: $version · репозиторий для публикации: $repo"
          if (-not (Test-Path package-lock.json)) {
            Write-Host "::warning::package-lock.json отсутствует — установка пойдёт через npm install"
          }

      - name: Check tag matches package version
        if: github.event_name == 'push'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = node -p "require('./package.json').version"
          $expectedTag = "v$version"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Тег $env:RELEASE_TAG не совпадает с версией $version (ожидается $expectedTag)."
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) {
            Write-Host "npm ci не сработал (обычно нет package-lock.json или он разошёлся с package.json) — ставлю через npm install"
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw "Не удалось установить зависимости" }
          }

      - name: Run tests (схема БД, парсер, синхронизация, напоминания)
        run: npm test

      # Собираем без публикации: публикацию делает отдельный шаг через gh CLI.
      # Так меньше сюрпризов от встроенного публикатора electron-builder.
      - name: Build NSIS package
        run: npm run dist:win

      - name: Upload build artifacts to the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-tasks-${{ github.ref_name || 'manual' }}
          if-no-files-found: warn
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap

      - name: Publish release (only for tag pushes)
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $setup = "release/Forge-Tasks-Setup-$version.exe"
          $assets = @($setup, "${setup}.blockmap", "release/latest.yml")

          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) { throw "Не найден обязательный файл обновления: $asset" }
          }

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Релиза $tag ещё нет — создаю."
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "Forge Tasks $version" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Не удалось создать релиз $tag" }
          } else {
            Write-Host "Релиз $tag уже существует — обновляю файлы."
          }

          gh release upload $tag $assets --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Не удалось загрузить файлы релиза" }

          Write-Host "Готово: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"
